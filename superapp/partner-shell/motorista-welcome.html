<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0D0F12" />
  <title>Boas-vindas — APOIS Motorista</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#0D0F12}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#0D0F12;overscroll-behavior:none;overflow:hidden;-webkit-text-size-adjust:100%}
    body{position:fixed;inset:0}
    .page{width:100%;height:100dvh;margin:auto;max-width:540px;display:flex;flex-direction:column;overflow:hidden;padding-top:max(54px,calc(env(safe-area-inset-top) + 28px));background:#0D0F12}
    .hero{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
    .hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:center center;user-select:none;-webkit-user-drag:none}
    .entry{flex:0 0 auto;background:linear-gradient(180deg,#0B0B0F,#0D0F12);padding:9px 22px max(70px,calc(env(safe-area-inset-bottom) + 45px))}
    .entry button{appearance:none;width:100%;min-height:60px;display:flex;align-items:center;justify-content:center;gap:22px;border-radius:999px;border:1px solid rgba(255,255,255,.13);background:linear-gradient(135deg,#F51D2A 0%,#E90A21 50%,#BB071D 100%);color:#fff;font:900 clamp(20px,6vw,26px) Inter,system-ui,sans-serif;box-shadow:0 11px 27px rgba(187,7,29,.25);cursor:pointer;touch-action:manipulation}
    .entry button:active{transform:scale(.985)}.entry button:focus-visible{outline:3px solid #fff;outline-offset:3px}
    .entry svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
    @media(max-height:690px){.page{padding-top:max(44px,calc(env(safe-area-inset-top) + 24px))}.entry{padding:6px 16px max(48px,calc(env(safe-area-inset-bottom) + 30px))}.entry button{min-height:54px}}
  </style>
</head>
<body>
  <!-- APOIS_DRIVER_APPROVED_WELCOME_V1: approved art, authentic link, safe areas -->
  <main class="page" data-apois-driver-approved-welcome-v1>
    <div class="hero" role="img" aria-label="APOIS Motorista. Dirija com liberdade e ganhe no seu ritmo. Carro branco adesivado com a logomarca APOIS Motorista.">
      <img src="./assets/apois-motorista-hero.webp" alt="" aria-hidden="true" />
    </div>
    <div class="entry" data-apois-driver-enter-safe-area-v1>
      <button id="apois-driver-welcome-enter" type="button">Entrar <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
    </div>
  </main>
  <script>
    document.getElementById('apois-driver-welcome-enter').addEventListener('click',()=>{
      window.location.assign('./modules/motorista/index.html#/motorista/login');
    });
  </script>
</body>
</html>
