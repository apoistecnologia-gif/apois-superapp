<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0D0F12" />
  <title>Boas-vindas — APOIS Motorista</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#0D0F12}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#0D0F12;overscroll-behavior:none;overflow:hidden;-webkit-text-size-adjust:100%}
    body{position:fixed;inset:0}
    .page{position:relative;width:100%;height:100dvh;margin:auto;max-width:480px;display:flex;flex-direction:column;overflow:hidden;padding-top:max(28px,env(safe-area-inset-top));padding-bottom:calc(72px + env(safe-area-inset-bottom));background:#0D0F12}
    .page::before{content:"";position:absolute;inset:0 0 auto;height:max(28px,env(safe-area-inset-top));background:#fff;z-index:3}
    .hero{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;display:grid;place-items:center;padding:6px 12px 0}
    .hero img{display:block;width:100%;height:100%;min-height:0;object-fit:contain;object-position:center center;user-select:none;-webkit-user-drag:none}
    .entry{position:absolute;z-index:2;inset-inline:0;bottom:0;background:#0D0F12;padding:8px 22px max(14px,env(safe-area-inset-bottom))}
    .entry button{appearance:none;width:100%;min-height:48px;display:flex;align-items:center;justify-content:center;gap:22px;border-radius:999px;border:1px solid rgba(255,255,255,.13);background:linear-gradient(135deg,#F51D2A 0%,#E90A21 50%,#BB071D 100%);color:#fff;font:800 clamp(16px,4.6vw,20px) Inter,system-ui,sans-serif;box-shadow:0 11px 27px rgba(187,7,29,.25);cursor:pointer;touch-action:manipulation}
    .entry button:active{transform:scale(.985)}.entry button:focus-visible{outline:3px solid #fff;outline-offset:3px}
    .entry svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
    @media(max-height:690px){.hero{padding-inline:8px}.entry{padding-inline:16px}.entry button{min-height:46px}}
  </style>
</head>
<body>
  <!-- APOIS_DRIVER_APPROVED_WELCOME_V1 / APOIS_MOTORISTA_VISUAL_REF_20261124_WELCOME: original artwork contained without cropping; CTA has reserved space; native safe areas retained -->
  <main class="page" data-apois-driver-approved-welcome-v1>
    <div class="hero" role="img" aria-label="APOIS Motorista. Dirija com liberdade e ganhe no seu ritmo. Carro branco adesivado com a logomarca APOIS Motorista.">
      <img src="./assets/apois-motorista-hero.webp" alt="" aria-hidden="true" />
    </div>
    <div class="entry" data-apois-driver-enter-safe-area-v1>
      <button id="apois-driver-welcome-enter" type="button">Entrar <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
    </div>
  </main>
  <script>
    document.getElementById('apois-driver-welcome-enter').addEventListener('click',()=>{
      try{sessionStorage.setItem('apois-driver-welcome-entered-v2','1')}catch{}
      window.location.assign('./modules/motorista/index.html#/motorista/login');
    });
  </script>
</body>
</html>
