<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>APOIS Parceiro</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#050505;--gold:#f6be1c}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#fff}body{min-height:100dvh}
    .screen{min-height:100dvh;max-width:520px;margin:0 auto;padding:max(env(safe-area-inset-top),28px) 18px max(env(safe-area-inset-bottom),24px);display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 50% 18%,rgba(246,190,28,.18),transparent 25%),#050505}
    .brand{text-align:center}.logo{width:126px;height:126px;margin:0 auto 16px;border-radius:50%;overflow:hidden;border:1px solid rgba(246,190,28,.22);background:#000;box-shadow:0 16px 34px -22px rgba(246,190,28,.65)}.logo img{display:block;width:100%;height:100%;object-fit:cover}.brand h1{margin:0;font-size:34px;line-height:1;font-weight:950}.brand p{margin:10px auto 0;color:#b8b8b8;font-size:14px;max-width:330px;line-height:1.45}
    .choices{display:grid;gap:14px;margin-top:34px}.card{width:100%;border:1px solid rgba(246,190,28,.42);border-radius:26px;background:linear-gradient(180deg,#111,#090909);padding:20px;text-align:left;color:white;box-shadow:0 14px 34px -28px rgba(246,190,28,.5)}.card strong{display:block;font-size:22px}.card span{display:block;margin-top:6px;font-size:13px;color:#b9b9b9;line-height:1.4}.card button{margin-top:18px;width:100%;height:52px;border:0;border-radius:16px;font:inherit;font-weight:900;background:linear-gradient(135deg,#f7ca48,#f6be1c 56%,#c88a08);color:#050505;box-shadow:0 12px 28px -18px rgba(246,190,28,.9)}.card button:focus-visible{outline:3px solid rgba(246,190,28,.5);outline-offset:3px}.foot{text-align:center;margin-top:28px;color:#777;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  </style>
</head>
<body>
  <main class="screen">
    <section class="brand">
      <div class="logo"><img src="__APOIS_BRAND_DATA_URL__" alt="APOIS Brasil" /></div>
      <h1>APOIS Parceiro</h1>
      <p>Escolha como você trabalha na APOIS. Motoristas e entregadores usam este aplicativo.</p>
    </section>
    <section class="choices">
      <article class="card motorista"><strong>Sou Motorista</strong><span>Fique online, receba corridas, acompanhe ganhos e conecte sua conta Mercado Pago.</span><button data-module="motorista" type="button">Entrar como motorista →</button></article>
      <article class="card entregador"><strong>Sou Entregador</strong><span>Fique disponível, receba entregas e acompanhe suas rotas e pedidos.</span><button data-module="entregador" type="button">Entrar como entregador →</button></article>
    </section>
    <div class="foot">APOIS • PARCEIROS</div>
  </main>
  <script>
    const urls={motorista:'./modules/motorista/index.html#/motorista/login',entregador:'./modules/entregador/index.html'};
    const operationalUrls={motorista:'./modules/motorista/index.html#/motorista/app',entregador:'./modules/entregador/index.html'};
    const COURIER_AUTH_KEY='apois-parceiro:entregador-auth-url';
    const DRIVER_RECOVERY_KEY='apois-parceiro:motorista-recovery-url';
    const DRIVER_GOOGLE_KEY='apois-parceiro:motorista-google-url';
    const PARTNER_PENDING_PUSH_KEY='apois-parceiro:pending-push';
    const PARTNER_OPERATIONAL_ROLE_KEY='apois-parceiro:operational-role';

    function operationalRole(){
      try{
        const value=localStorage.getItem(PARTNER_OPERATIONAL_ROLE_KEY);
        return value==='motorista'||value==='entregador'?value:null;
      }catch{return null;}
    }
    function operationalHome(role){return role==='motorista'?operationalUrls.motorista:operationalUrls.entregador;}
    function routeRole(requestedRole,target){
      const locked=operationalRole();
      if(locked&&locked!==requestedRole){
        window.location.replace(operationalHome(locked));
        return false;
      }
      try{localStorage.setItem('apois-parceiro:last-module',requestedRole);}catch{}
      window.location.assign(locked===requestedRole?operationalHome(requestedRole):target);
      return true;
    }

    document.querySelectorAll('[data-module]').forEach((button)=>button.addEventListener('click',()=>{
      const moduleName=button.dataset.module;
      if(moduleName!=='motorista'&&moduleName!=='entregador')return;
      routeRole(moduleName,urls[moduleName]);
    }));

    function authParams(incoming){
      const params=new URLSearchParams(incoming.search);
      const fragment=incoming.hash.replace(/^#/,'');
      if(fragment){
        const fragmentParams=new URLSearchParams(fragment);
        fragmentParams.forEach((value,key)=>{if(!params.has(key))params.set(key,value);});
      }
      return params;
    }

    function relayDeepLink(rawUrl){
      const isLegacy=typeof rawUrl==='string'&&rawUrl.startsWith('br.com.apois.app://auth/');
      const isPartner=typeof rawUrl==='string'&&rawUrl.startsWith('br.com.apois.parceiro://');
      const isDriver=typeof rawUrl==='string'&&rawUrl.startsWith('apoismotorista://auth/');
      if(!isLegacy&&!isPartner&&!isDriver)return false;
      try{
        const incoming=new URL(rawUrl);
        const path=incoming.pathname.replace(/^\//,'');
        const params=authParams(incoming);
        const suffix=params.toString()?('?'+params.toString()):'';
        void window.Capacitor?.Plugins?.Browser?.close?.().catch(()=>undefined);

        if(isPartner&&incoming.host==='module'&&path==='motorista'){
          routeRole('motorista',operationalUrls.motorista);
          return true;
        }
        if(isPartner&&incoming.host==='module'&&path==='entregador'){
          routeRole('entregador',operationalUrls.entregador);
          return true;
        }
        if(path==='mercadopago'){
          const locked=operationalRole();
          if(locked&&locked!=='motorista'){
            window.location.replace(operationalHome(locked));
            return true;
          }
          window.location.assign('./modules/motorista/index.html#/motorista/assinatura'+suffix);
          return true;
        }
        if(isDriver && path==='redefinir-senha'){
          const locked=operationalRole();
          if(locked&&locked!=='motorista'){
            window.location.replace(operationalHome(locked));
            return true;
          }
          try{sessionStorage.setItem(DRIVER_RECOVERY_KEY,rawUrl);}catch{}
          window.location.assign('./modules/motorista/index.html#/motorista/login');
          return true;
        }
        if(isDriver && path==='google'){
          const locked=operationalRole();
          if(locked&&locked!=='motorista'){
            window.location.replace(operationalHome(locked));
            return true;
          }
          try{sessionStorage.setItem(DRIVER_GOOGLE_KEY,rawUrl);}catch{}
          window.location.assign('./modules/motorista/index.html#/motorista/login');
          return true;
        }
        if(isPartner && incoming.host==='auth' && (path==='callback'||path==='reset')){
          const locked=operationalRole();
          if(locked&&locked!=='entregador'){
            window.location.replace(operationalHome(locked));
            return true;
          }
          try{sessionStorage.setItem(COURIER_AUTH_KEY,rawUrl);}catch{}
          const target=path==='reset'?'#/redefinir-senha'+suffix:'#/auth/callback'+suffix;
          window.location.assign('./modules/entregador/index.html'+target);
          return true;
        }
      }catch(error){console.error('[APOIS Parceiro] deep link inválido',error);}
      return false;
    }

    function relayPartnerPush(data){
      const payload=data&&typeof data==='object'?data:{};
      const notificationType=String(payload.notificationType||payload.notification_type||'').toLowerCase();
      const orderId=String(payload.orderId||payload.order_id||payload.orderID||'').trim();
      const rideId=String(payload.ride_id||payload.rideId||'').trim();
      const event=String(payload.event||'').toLowerCase();
      const isDelivery=Boolean(orderId)||notificationType.includes('delivery')||notificationType.includes('order');
      const isRide=Boolean(rideId)||event.startsWith('ride.')||event.startsWith('driver.')||event.includes('corrida');
      if(isDelivery&&isRide)return false;
      if(isDelivery)return routeRole('entregador',operationalUrls.entregador);
      if(isRide)return routeRole('motorista',operationalUrls.motorista);
      return false;
    }

    function consumePendingPartnerPush(){
      try{
        const raw=sessionStorage.getItem(PARTNER_PENDING_PUSH_KEY);
        if(!raw)return false;
        sessionStorage.removeItem(PARTNER_PENDING_PUSH_KEY);
        const parsed=JSON.parse(raw);
        return relayPartnerPush(parsed);
      }catch(error){
        try{sessionStorage.removeItem(PARTNER_PENDING_PUSH_KEY);}catch{}
        console.error('[APOIS Parceiro] push encaminhado inválido',error);
        return false;
      }
    }

    const lockedOnLaunch=operationalRole();
    if(lockedOnLaunch){
      window.location.replace(operationalHome(lockedOnLaunch));
    }else if(!consumePendingPartnerPush()){
      const appPlugin=window.Capacitor?.Plugins?.App;
      if(appPlugin){
        appPlugin.addListener('appUrlOpen',({url})=>{relayDeepLink(url);}).catch(()=>undefined);
        appPlugin.getLaunchUrl().then((result)=>{if(result?.url)relayDeepLink(result.url);}).catch(()=>undefined);
      }
      const pushPlugin=window.Capacitor?.Plugins?.PushNotifications;
      if(pushPlugin){
        pushPlugin.addListener('pushNotificationActionPerformed',(action)=>{
          relayPartnerPush(action?.notification?.data||{});
        }).catch(()=>undefined);
      }
    }
  </script>
</body>
</html>
