<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0D0F12" />
  <title>APOIS Corridas — Boas-vindas</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--apois-red:#F51D2A;--apois-dark-red:#BB071D;--apois-black:#0D0F12;--apois-white:#FFFFFF}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--apois-black);color:#fff}
    body{overflow-x:hidden}
    .apois-welcome{isolation:isolate;position:relative;min-height:100vh;min-height:100dvh;max-width:560px;margin:0 auto;overflow:hidden;background:radial-gradient(ellipse 115% 33% at 55% 38%,rgba(128,51,42,.49),transparent 85%),linear-gradient(180deg,#090B10 0%,#111015 38%,#111013 63%,#050507 100%)}
    .apois-welcome:before{content:"";z-index:-1;position:absolute;inset:auto -12% 23% -12%;height:23%;background:linear-gradient(180deg,transparent,rgba(17,8,12,.4) 20%,rgba(4,5,8,.96) 97%);pointer-events:none}
    .skyline{position:absolute;z-index:-1;left:0;right:0;top:20%;height:38%;width:100%;opacity:.66;overflow:hidden;pointer-events:none}
    .skyline svg{width:100%;height:100%;display:block}
    .inner{position:relative;display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:100dvh;padding:max(20px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom));text-align:center}
    .brand{width:clamp(142px,38vw,186px);height:clamp(142px,38vw,186px);flex:0 0 auto;margin:clamp(8px,2vh,30px) auto 0;border-radius:50%;filter:drop-shadow(0 8px 18px rgba(0,0,0,.38))}
    .brand img{width:100%;height:100%;object-fit:contain;display:block}
    h1{margin:clamp(10px,2vh,20px) 0 0;font-size:clamp(40px,11.5vw,62px);font-weight:950;line-height:1;letter-spacing:-.045em;color:#fff}
    .role{margin-top:8px;display:inline-grid;place-items:center;padding:5px 22px 7px;border-radius:999px;background:linear-gradient(135deg,var(--apois-red),var(--apois-dark-red));font-size:clamp(22px,7vw,29px);font-weight:900;line-height:1.15;box-shadow:0 10px 22px rgba(187,7,29,.25)}
    .headline{margin:clamp(14px,2.8vh,26px) 0 0;font-weight:900;font-size:clamp(23px,6.6vw,32px);letter-spacing:-.025em;line-height:1.17;text-wrap:balance}
    .accent{width:130px;height:5px;margin:clamp(11px,2vh,18px) 0 0;border-radius:100%;background:var(--apois-red);transform:rotate(-5deg)}
    .benefits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;width:100%;max-width:410px;margin:clamp(14px,2.5vh,24px) 0 0}
    .benefit{padding:0 6px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:clamp(11px,3.5vw,14px);line-height:1.25;font-weight:600}
    .benefit+.benefit{border-left:1px solid rgba(255,255,255,.5)}
    .benefit svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .vehicle{position:relative;width:calc(100% + 44px);max-width:520px;flex:1 1 auto;min-height:135px;margin:6px -22px 10px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
    .vehicle img{display:block;width:100%;max-width:520px;height:auto;object-fit:contain;object-position:bottom center;-webkit-mask-image:linear-gradient(180deg,transparent 0%,black 13%,black 94%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,black 13%,black 94%,transparent 100%)}
    .enter{position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:20px;width:100%;max-width:430px;min-height:60px;margin:0 auto 4px;padding:12px 18px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:linear-gradient(135deg,#F51D2A 0%,#E60A1B 46%,#BB071D 100%);color:#fff;box-shadow:0 13px 27px rgba(187,7,29,.25);font-size:clamp(20px,6vw,26px);font-weight:900;cursor:pointer;touch-action:manipulation;transition:transform .12s ease}
    .enter:active{transform:scale(.985)}.enter:focus-visible{outline:3px solid #fff;outline-offset:4px}
    .enter svg{width:24px;height:24px;stroke:#fff;stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
    @media(max-height:780px){.inner{padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(13px,env(safe-area-inset-bottom))}.brand{width:116px;height:116px;margin-top:2px}h1{font-size:38px;margin-top:5px}.role{font-size:19px;padding:3px 15px}.headline{margin-top:10px;font-size:21px}.accent{margin-top:8px}.benefits{margin-top:10px}.benefit svg{width:24px;height:24px}.benefit{font-size:11px}.enter{min-height:52px;font-size:20px}.vehicle{min-height:100px;margin-top:2px}}
    @media(max-height:535px){.benefits{display:none}.brand{width:92px;height:92px}.headline{font-size:19px}.vehicle{min-height:75px}}
    @media(prefers-reduced-motion:reduce){.enter{transition:none}}
  </style>
</head>

      <button type="button" id="apois-corridas-welcome-enter" class="enter" aria-label="Entrar na minha conta APOIS Corridas">Entrar <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
    </div>
  </main>
  <script>
    // APOIS_CORRIDAS_ONLY_CLIENT_BOOT_V1
    // The approved welcome stays visible until the real Entrar action. Auth
    // callbacks and password recovery bypass it; no new auth or session logic.
    (function(){
      'use strict';
      const home='./modules/corridas/index.html';
      const login='./modules/corridas/index.html#/login';
      const oauthKey='apois-superapp:corridas-google-url';
      const recoveryKey='apois-superapp:corridas-recovery-url';
      const pendingKey='apois-superapp:pending-oauth-product';
      const lastModule='apois-superapp:last-module';
      let navigated=false;
      function go(target){
        if(navigated)return false;
        navigated=true;
        try{localStorage.setItem(lastModule,'corridas');}catch{}
        window.location.replace(target);
        return true;
      }
      function handleUrl(raw){
        if(typeof raw!=='string'||!raw.startsWith('br.com.apois.app://auth/'))return false;
        try{
          const url=new URL(raw);
          const path=url.pathname.replace(/^\//,'');
          const params=new URLSearchParams(url.search);
          const fragment=url.hash.replace(/^#/,'');
          if(fragment)new URLSearchParams(fragment).forEach((v,k)=>{if(!params.has(k))params.set(k,v);});
          if(path==='corridas-confirm')return go(login);
          if(path==='corridas-reset'){
            try{sessionStorage.setItem(recoveryKey,raw);}catch{}
            return go(home);
          }
          if(path==='corridas-google'||path==='callback'){
            const hasCode=params.getAll('code').length===1&&Boolean(params.get('code')?.trim());
            const hasError=Boolean(params.get('error')||params.get('error_description'));
            if(!hasCode&&!hasError)return false;
            if(params.has('access_token')||params.has('refresh_token'))return false;
            const data=JSON.stringify({url:raw,createdAt:Date.now()});
            try{
              if(path==='callback'){
                const pending=localStorage.getItem(pendingKey);
                if(pending){
                  const obj=JSON.parse(pending);
                  if(obj?.product!=='corridas'||Date.now()-Number(obj.createdAt)>120000)return false;
                }
              }
              localStorage.setItem(oauthKey,data);
              localStorage.removeItem(pendingKey);
            }catch{return false;}
            void window.Capacitor?.Plugins?.Browser?.close?.().catch(()=>undefined);
            return go(login);
          }
        }catch(error){console.warn('[APOIS Cliente] callback inválido',error);}
        return false;
      }
      async function boot(){
        const app=window.Capacitor?.Plugins?.App;
        if(app){
          try{await app.addListener('appUrlOpen',({url})=>{handleUrl(url);});}catch{}
          try{
            const launch=await app.getLaunchUrl();
            if(launch?.url && handleUrl(launch.url))return;
          }catch{}
        }
        // Ordinary cold start shows Welcome; Entrar opens the existing login.
      }
      document.getElementById('apois-corridas-welcome-enter').addEventListener('click',()=>{go(login);});
      void boot();
    })();
  </script>
