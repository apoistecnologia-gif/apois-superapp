<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>APOIS</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7fafc;background:#071014;--accent:#1f9db2;--accent2:#176f80;--card:#101a1f;--line:#223139;--muted:#8fa0a8}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -10%,#12303a 0,transparent 34%),#071014;color:#fff}
    main{min-height:100dvh;max-width:460px;margin:auto;padding:max(env(safe-area-inset-top),28px) 22px max(env(safe-area-inset-bottom),28px);display:flex;flex-direction:column}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:44px}.brand{font-size:28px;font-weight:900;letter-spacing:.04em}.brand span{color:var(--accent)}
    .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:7px 10px;border-radius:999px;background:#0d171b}
    h1{font-size:34px;line-height:1.05;margin:0 0 12px}.lead{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 30px}
    .services{display:grid;gap:16px}.service{width:100%;text-align:left;border:1px solid var(--line);background:linear-gradient(145deg,#111d22,#0b1519);border-radius:26px;padding:22px;color:#fff;box-shadow:0 18px 45px rgba(0,0,0,.24);cursor:pointer}.service:active{transform:scale(.985)}
    .icon{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:rgba(31,157,178,.13);border:1px solid rgba(31,157,178,.25);font-size:25px;margin-bottom:18px}.service h2{margin:0;font-size:22px}.service p{margin:7px 0 0;color:var(--muted);font-size:14px;line-height:1.45}.arrow{float:right;color:var(--accent);font-size:24px}
    footer{margin-top:auto;padding-top:34px;color:#607179;text-align:center;font-size:12px}
  </style>
</head>
<body>
  <main>
    <header><div class="brand">APOIS<span>.</span></div><div class="tag">Tudo em um só app</div></header>
    <h1>O que você precisa agora?</h1>
    <p class="lead">Escolha o serviço que você quer usar.</p>
    <section class="services" aria-label="Serviços APOIS">
      <button class="service" data-module="corridas">
        <span class="arrow">›</span><div class="icon">🚘</div><h2>Corridas</h2><p>Carro, moto, fretes, guincho e envios.</p>
      </button>
      <button class="service" data-module="entregas">
        <span class="arrow">›</span><div class="icon">🛍️</div><h2>Entregas</h2><p>Restaurantes, mercados, farmácias e lojas.</p>
      </button>
    </section>
    <footer>APOIS — tudo em um só lugar.</footer>
  </main>
  <script>
    const moduleUrls={corridas:'./modules/corridas/index.html',entregas:'./modules/entregas/index.html'};
    document.querySelectorAll('[data-module]').forEach((button)=>button.addEventListener('click',()=>{
      const moduleName=button.dataset.module;
      const destination=moduleUrls[moduleName];
      if(!destination)return;
      window.dispatchEvent(new CustomEvent('apois:module-selected',{detail:{module:moduleName}}));
      window.location.href=destination;
    }));
  </script>
</body>
</html>
