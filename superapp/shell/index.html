<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>APOIS</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#050505;--gold:#f2b414;--gold2:#ffcc43;--teal:#f2b414;--muted:#b5b5b5}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#fff}body{min-height:100dvh;overflow-x:hidden;overflow-y:auto}
    button{font:inherit}.screen{position:relative;min-height:100dvh;max-width:520px;margin:0 auto;padding:max(env(safe-area-inset-top),18px) 16px max(env(safe-area-inset-bottom),20px);overflow-x:hidden;overflow-y:auto;background:linear-gradient(180deg,rgba(0,0,0,.08),#050505 44%),radial-gradient(circle at 17% 20%,rgba(242,180,20,.18),transparent 24%),radial-gradient(circle at 84% 34%,rgba(242,180,20,.10),transparent 26%),#050505}
    .screen:before,.screen:after{content:"";position:absolute;pointer-events:none}.screen:before{inset:-8% -30% auto;height:360px;background:repeating-linear-gradient(8deg,transparent 0 34px,rgba(242,180,20,.16) 35px 37px,transparent 38px 72px);filter:blur(8px);opacity:.6;transform:rotate(-5deg)}.screen:after{left:-20%;right:-20%;top:300px;height:260px;background:radial-gradient(ellipse at center,rgba(255,183,13,.14),transparent 60%);filter:blur(14px)}
    .content{position:relative;z-index:1}.top{display:flex;align-items:center;justify-content:center;min-height:116px;padding-top:4px}.logo-mark{width:94px;height:94px;border-radius:30px;display:grid;place-items:center;overflow:hidden;background:#050505;border:1px solid rgba(242,180,20,.24);box-shadow:0 0 34px rgba(242,180,20,.2)}.logo-mark img{display:block;width:100%;height:100%;object-fit:contain;padding:6px}.brand{text-align:center;margin-top:5px;font-size:42px;font-weight:1000;letter-spacing:.03em;background:linear-gradient(180deg,#ffd85d,#d99600);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 7px 26px rgba(242,180,20,.12)}.subtitle{margin-top:-2px;text-align:center;font-size:10px;letter-spacing:.48em;font-weight:800;color:#f4f4f4}
    .hero{text-align:center;margin:16px auto 20px;max-width:430px}.hero h1{margin:0;font-size:clamp(29px,8.5vw,45px);line-height:1.04;font-weight:900;letter-spacing:-.035em}.hero h1 em{font-style:italic;color:var(--gold2)}.hero p{margin:10px auto 0;max-width:330px;color:#c7c7c7;font-size:14px;line-height:1.45}
    .services{display:grid;grid-template-columns:1fr 1fr;gap:12px}.service{position:relative;min-height:320px;border-radius:28px;padding:14px;overflow:hidden;color:#fff;background:#090b0d;border:1.5px solid;box-shadow:0 18px 46px rgba(0,0,0,.42);text-align:left}.service.corridas{border-color:rgba(242,180,20,.95);box-shadow:0 0 0 1px rgba(242,180,20,.08) inset,0 16px 40px rgba(242,180,20,.10)}.service.entregas{border-color:rgba(242,180,20,.88);box-shadow:0 0 0 1px rgba(242,180,20,.07) inset,0 16px 40px rgba(242,180,20,.08)}
    .photo{height:150px;border-radius:20px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;background:#111}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 36%,rgba(0,0,0,.92) 100%)}.corridas .photo{background:radial-gradient(circle at 68% 34%,rgba(255,188,22,.75),transparent 22%),linear-gradient(145deg,#2b2110,#080808 62%)}.entregas .photo{background:radial-gradient(circle at 68% 34%,rgba(242,180,20,.68),transparent 22%),linear-gradient(145deg,#2b2110,#080808 62%)}
    .vehicle,.delivery{position:relative;z-index:1;margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:8px;color:#f6be1c;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}.vehicle svg,.delivery svg{width:54px;height:54px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.badge svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.badge{position:absolute;left:10px;top:10px;z-index:2;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:rgba(3,3,3,.72);backdrop-filter:blur(8px)}.corridas .badge{border:1px solid var(--gold);color:var(--gold)}.entregas .badge{border:1px solid var(--teal);color:var(--teal)}
    .service h2{font-size:26px;margin:13px 0 4px;text-align:center;letter-spacing:-.03em}.service p{margin:0;text-align:center;color:#d1d1d1;font-size:12px;line-height:1.4;min-height:35px}.action{margin-top:14px;width:100%;height:48px;border:0;border-radius:17px;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer}.action:focus-visible{outline:3px solid #fff;outline-offset:3px}.corridas .action{background:linear-gradient(135deg,#f7c847,#e9a90e);color:#050505}.entregas .action{background:linear-gradient(135deg,#f7c847,#e9a90e);color:#050505}.service:active{transform:scale(.985)}
    .features{margin-top:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.feature{min-height:82px;border-radius:18px;padding:10px 6px;background:linear-gradient(180deg,rgba(20,20,20,.96),rgba(8,9,10,.96));border:1px solid #30343a;text-align:center}.feature .ico{font-size:22px;color:var(--gold2);line-height:1;margin-bottom:8px}.feature b{display:block;font-size:11px;line-height:1.15}.feature span{display:block;font-size:9px;color:#bcbcbc;margin-top:2px;line-height:1.2}.closing{padding:18px 0 2px;text-align:center}.closing strong{font-size:28px;font-style:italic;font-weight:800}.closing strong span{color:var(--gold)}.closing small{display:block;margin-top:8px;font-size:9px;letter-spacing:.42em;color:#ddd}
    @media(max-height:720px){.top{min-height:88px}.logo-mark{width:76px;height:76px}.brand{font-size:34px}.subtitle{font-size:9px}.hero{margin:10px auto 14px}.hero h1{font-size:28px}.hero p{margin-top:6px;font-size:12px}.service{min-height:265px}.photo{height:118px}.features{margin-top:10px}.feature{min-height:68px}.closing{padding-top:12px}.closing strong{font-size:24px}}
    @media(max-width:380px){.screen{padding-left:12px;padding-right:12px}.services{gap:9px}.service{padding:10px;min-height:300px;border-radius:24px}.photo{height:135px}.service h2{font-size:23px}.service p{font-size:11px}.features{gap:6px}.feature{padding:8px 4px}.feature b{font-size:10px}.brand{font-size:38px}.logo-mark{width:84px;height:84px}}
  </style>
</head>
<body>
  <main class="screen">
    <div class="content">
      <div class="top"><div class="logo-mark"><img src="./assets/apois-brand.png" alt="APOIS" /></div></div>
      <div class="brand">APOIS</div>
      <div class="subtitle">TUDO EM UM SÓ APP</div>
      <section class="hero"><h1>Para onde <em>vamos</em> hoje?</h1><p>Escolha o serviço que você precisa e resolva do seu jeito.</p></section>
      <section class="services" aria-label="Serviços APOIS">
        <article class="service corridas"><div class="photo"><div class="badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17h14l-1.2-6.1a2 2 0 0 0-2-1.6H8.2a2 2 0 0 0-2 1.6L5 17Z"/><path d="M7 9.3 8.4 6h7.2L17 9.3M5 13H3.5M20.5 13H19"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg></div><div class="vehicle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17h14l-1.2-6.1a2 2 0 0 0-2-1.6H8.2a2 2 0 0 0-2 1.6L5 17Z"/><path d="M7 9.3 8.4 6h7.2L17 9.3M5 13H3.5M20.5 13H19"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="m7 17 4-7h3l3 7M9 13h7M12 10l-2-3H7"/></svg></div></div><h2>Corridas</h2><p>Carro • Moto • Envios</p><button class="action" data-module="corridas" type="button">Acessar <span>→</span></button></article>
        <article class="service entregas"><div class="photo"><div class="badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg></div><div class="delivery"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="m7 17 4-7h3l3 7M9 13h7M12 10l-2-3H7"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 8-4 8 4-8 4-8-4Z"/><path d="M4 7v10l8 4 8-4V7M12 11v10"/></svg></div></div><h2>Entregas</h2><p>Restaurantes • Mercados • Lojas</p><button class="action" data-module="entregas" type="button">Acessar <span>→</span></button></article>
      </section>
      <section class="features" aria-label="Diferenciais"><div class="feature"><div class="ico">♢</div><b>Seguro</b><span>e confiável</span></div><div class="feature"><div class="ico">◷</div><b>Rápido</b><span>e prático</span></div><div class="feature"><div class="ico">⌖</div><b>Acompanhe</b><span>em tempo real</span></div><div class="feature"><div class="ico">★</div><b>Avalie</b><span>e ajude</span></div></section>
      <div class="closing"><strong>Apois, <span>vamos?</span></strong><small>FEITO PARA VOCÊ</small></div>
    </div>
  </main>
  <script>
    const moduleUrls={corridas:'./modules/corridas/index.html',entregas:'./modules/entregas/index.html'};
    const LAST_MODULE_KEY='apois-superapp:last-module';
    const AUTH_DEEP_LINK_KEY='apois-superapp:last-auth-deeplink';
    const CORRIDAS_RECOVERY_KEY='apois-superapp:corridas-recovery-url';
    const CORRIDAS_GOOGLE_KEY='apois-superapp:corridas-google-url';
    const OAUTH_PENDING_KEY='apois-superapp:pending-oauth-product';
    const OAUTH_HANDOFF_TTL_MS=120000;
    const clearExpiredCorridasGoogle=()=>{
      try{
        const stored=localStorage.getItem(CORRIDAS_GOOGLE_KEY);
        if(!stored)return;
        const envelope=JSON.parse(stored);
        const age=Date.now()-Number(envelope?.createdAt);
        if(age<0||age>OAUTH_HANDOFF_TTL_MS)localStorage.removeItem(CORRIDAS_GOOGLE_KEY);
      }catch{try{localStorage.removeItem(CORRIDAS_GOOGLE_KEY);}catch{/* storage indisponível */}}
    };
    clearExpiredCorridasGoogle();
    const PUBLIC_ROUTE_FRAGMENTS=['/login','/register','/cadastro','/recuperar-senha','/redefinir-senha','/auth/callback'];

    function authStorageKey(moduleName){
      return moduleName==='corridas'?'apois-superapp-corridas-auth-v1':'apois-superapp-entregas-auth-v1';
    }

    function routeStorageKey(moduleName){
      return 'apois-superapp:last-route:'+moduleName;
    }

    function hasPersistedSession(moduleName){
      const key=authStorageKey(moduleName);
      try{
        const raw=localStorage.getItem(key);
        if(!raw)return false;
        const parsed=JSON.parse(raw);
        return Boolean(parsed?.access_token||parsed?.currentSession?.access_token||parsed?.session?.access_token);
      }catch{
        try{localStorage.removeItem(key);}catch{}
        return false;
      }
    }

    function resumableRoute(moduleName){
      if(!hasPersistedSession(moduleName))return null;
      try{
        const route=localStorage.getItem(routeStorageKey(moduleName));
        if(!route||!route.startsWith('#/'))return null;
        if(PUBLIC_ROUTE_FRAGMENTS.some((fragment)=>route.includes(fragment)))return null;
        return route;
      }catch{return null;}
    }

    function moduleDestination(moduleName){
      const base=moduleUrls[moduleName];
      if(!base)return null;
      const route=resumableRoute(moduleName);
      if(route)return base+route;
      return hasPersistedSession(moduleName)?base+'#/inicio':base+'#/login';
    }

    function openModule(moduleName){
      const destination=moduleDestination(moduleName);
      if(!destination)return;
      try{localStorage.setItem(LAST_MODULE_KEY,moduleName);}catch{}
      window.dispatchEvent(new CustomEvent('apois:module-selected',{detail:{module:moduleName}}));
      window.location.replace(destination);
    }

    document.querySelectorAll('[data-module]').forEach((button)=>button.addEventListener('click',()=>openModule(button.dataset.module)));

    function relayAuthDeepLink(rawUrl){
      if(typeof rawUrl!=='string'||!rawUrl.startsWith('br.com.apois.app://auth/'))return false;
      try{
        try{
          const previousRaw=sessionStorage.getItem(AUTH_DEEP_LINK_KEY);
          if(previousRaw){try{const previous=JSON.parse(previousRaw);if(previous?.url===rawUrl&&Date.now()-Number(previous?.at||0)<5000)return true;}catch{}}
          sessionStorage.setItem(AUTH_DEEP_LINK_KEY,JSON.stringify({url:rawUrl,at:Date.now()}));
        }catch{}

        const incoming=new URL(rawUrl);
        const path=incoming.pathname.replace(/^\//,'');
        const params=new URLSearchParams(incoming.search);
        const fragment=incoming.hash.replace(/^#/,'');
        if(fragment){
          const fragmentParams=new URLSearchParams(fragment);
          fragmentParams.forEach((value,key)=>{if(!params.has(key))params.set(key,value);});
        }
        const suffix=()=>{const query=params.toString();return query?`?${query}`:'';};
        const storeCorridasGoogle=()=>{
          if(!params.get('code')||params.has('access_token')||params.has('refresh_token'))return false;
          try{
            const envelope=JSON.stringify({url:rawUrl,createdAt:Date.now()});
            localStorage.setItem(CORRIDAS_GOOGLE_KEY,envelope);
            window.setTimeout(()=>{try{if(localStorage.getItem(CORRIDAS_GOOGLE_KEY)===envelope)localStorage.removeItem(CORRIDAS_GOOGLE_KEY);}catch{/* storage indisponível */}},OAUTH_HANDOFF_TTL_MS);
            return true;
          }catch{return false;}
        };
        const hasPendingCorridas=()=>{
          try{
            const stored=localStorage.getItem(OAUTH_PENDING_KEY);
            localStorage.removeItem(OAUTH_PENDING_KEY);
            if(!stored)return false;
            const envelope=JSON.parse(stored);
            const age=Date.now()-Number(envelope?.createdAt);
            return envelope?.product==='corridas'&&age>=0&&age<=OAUTH_HANDOFF_TTL_MS;
          }catch{return false;}
        };
        if(path==='corridas-google'){
          if(!storeCorridasGoogle())return false;
          void window.Capacitor?.Plugins?.Browser?.close?.().catch(()=>undefined);
          window.location.replace('./modules/corridas/index.html#/login');
          return true;
        }
        if(path==='corridas-reset'){
          try{sessionStorage.setItem(CORRIDAS_RECOVERY_KEY,rawUrl);}catch{}
          window.location.replace('./modules/corridas/index.html');
          return true;
        }
        if(path==='email-change'){
          if(!params.has('next'))params.set('next','/perfil/dados-pessoais');
          window.location.replace(`./modules/entregas/index.html#/auth/callback${suffix()}`);
          return true;
        }
        if(path==='reset'){
          window.location.replace(`./modules/entregas/index.html#/redefinir-senha${suffix()}`);
          return true;
        }
        if(path==='callback'){
          try{
            if(hasPendingCorridas()&&storeCorridasGoogle()){
              void window.Capacitor?.Plugins?.Browser?.close?.().catch(()=>undefined);
              window.location.replace('./modules/corridas/index.html#/login');
              return true;
            }
          }catch{}
          window.location.replace(`./modules/entregas/index.html#/auth/callback${suffix()}`);
          return true;
        }
      }catch(error){
        console.error('[APOIS] deep link inválido',error);
      }
      return false;
    }

    const appPlugin=window.Capacitor?.Plugins?.App;
    if(appPlugin){
      appPlugin.addListener('appUrlOpen',({url})=>{relayAuthDeepLink(url);}).catch(()=>undefined);
      appPlugin.getLaunchUrl().then((result)=>{if(result?.url)relayAuthDeepLink(result.url);}).catch(()=>undefined);
    }
  </script>
</body>
</html>
