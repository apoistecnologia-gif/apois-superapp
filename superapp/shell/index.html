<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#E51B23" />
  <title>APOIS</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f7f7f8;--red:#E51B23;--red-dark:#C9141B;--muted:#666B73;--line:#E2E4E8}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f7f7f8;color:#111}body{min-height:100dvh;overflow-x:hidden;overflow-y:auto}button{font:inherit}
    .screen{position:relative;min-height:100dvh;max-width:520px;margin:0 auto;padding:max(env(safe-area-inset-top),20px) 18px max(env(safe-area-inset-bottom),24px);overflow:hidden;background:linear-gradient(180deg,#fff 0%,#fff8f7 66%,#fff1f2 100%)}
    .screen:before,.screen:after{content:"";position:absolute;pointer-events:none;z-index:0}.screen:before{right:-95px;top:-85px;width:270px;height:250px;border-radius:45%;background:linear-gradient(145deg,#ff2d35,#c9141b);transform:rotate(14deg)}.screen:after{left:-140px;bottom:-120px;width:360px;height:330px;border-radius:48%;background:linear-gradient(145deg,#ff2d35,#c9141b);transform:rotate(-14deg)}
    .content{position:relative;z-index:1;min-height:calc(100dvh - max(env(safe-area-inset-top),20px) - max(env(safe-area-inset-bottom),24px));display:flex;flex-direction:column}
    .top{display:flex;justify-content:center;align-items:center;min-height:126px;padding-top:6px;position:relative;z-index:2}.logo-mark{width:clamp(104px,30vw,128px);height:auto;aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden;flex:0 0 auto}.logo-mark img{display:block;width:100%;height:100%;object-fit:contain}
    .hero{position:relative;z-index:1;text-align:center;margin:12px auto 24px;max-width:440px}.hero h1{margin:0;font-size:clamp(36px,9vw,50px);line-height:1.02;font-weight:950;letter-spacing:-.045em}.hero h1 span{display:block;color:var(--red)}.hero p{margin:12px auto 0;max-width:360px;color:var(--muted);font-size:17px;line-height:1.35;font-weight:600}
    .services{display:grid;grid-template-columns:1fr 1fr;gap:14px}.service{position:relative;min-height:430px;border:1px solid rgba(255,255,255,.96);border-radius:30px;padding:14px;background:rgba(255,255,255,.95);box-shadow:0 18px 48px rgba(17,17,17,.10);overflow:hidden}.visual{height:230px;border-radius:22px;background:linear-gradient(180deg,#fff,#f4f5f7);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}.visual svg{width:100%;height:100%;filter:drop-shadow(0 14px 12px rgba(17,17,17,.18))}.vehicle-photo{display:block;width:100%;height:100%;object-fit:contain;object-position:center;filter:drop-shadow(0 14px 12px rgba(17,17,17,.16));mix-blend-mode:multiply}.pill{position:absolute;left:15px;top:15px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#fff1f2;color:var(--red);z-index:2}.pill svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:none}.service h2{margin:14px 0 4px;text-align:center;font-size:31px;line-height:1;font-weight:950;letter-spacing:-.04em}.service p{margin:0 auto;max-width:190px;text-align:center;color:var(--muted);font-size:15px;line-height:1.3;min-height:40px;font-weight:600}.action{margin-top:16px;width:100%;height:58px;border:0;border-radius:20px;background:linear-gradient(135deg,#ef222a,#e51b23);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;box-shadow:0 11px 26px rgba(229,27,35,.22)}.action:active{background:var(--red-dark);transform:scale(.985)}.action:focus-visible{outline:3px solid #111;outline-offset:3px}
    .footer-copy{margin-top:auto;padding:24px 0 4px;text-align:center;color:#71767d;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
    @media(max-height:760px){.top{min-height:92px;padding-top:0}.logo-mark{width:88px;height:88px}.hero{margin:6px auto 16px}.hero h1{font-size:31px}.hero p{font-size:14px}.service{min-height:350px}.visual{height:176px}.service h2{font-size:26px}.action{height:50px}.footer-copy{padding-top:14px}}
    @media(max-width:390px){.screen{padding-left:12px;padding-right:12px}.services{gap:9px}.service{padding:10px;border-radius:24px;min-height:370px}.visual{height:190px}.service h2{font-size:25px}.service p{font-size:13px}.action{font-size:16px}.logo-mark{width:104px;height:104px}}
  </style>
</head>

    </div>
  </main>
  <script>
    const moduleUrls={corridas:'./modules/corridas/index.html',entregas:'./modules/entregas/index.html'};
    const LAST_MODULE_KEY='apois-superapp:last-module';
    const AUTH_DEEP_LINK_KEY='apois-superapp:last-auth-deeplink';
    const CORRIDAS_RECOVERY_KEY='apois-superapp:corridas-recovery-url';
    const CORRIDAS_GOOGLE_KEY='apois-superapp:corridas-google-url';
    const ENTREGAS_GOOGLE_KEY='apois-superapp:entregas-google-url';
    const OAUTH_PENDING_KEY='apois-superapp:pending-oauth-product';
    const OAUTH_HANDOFF_TTL_MS=120000;
    const clearExpiredCorridasGoogle=()=>{
      try{
        const stored=localStorage.getItem(CORRIDAS_GOOGLE_KEY);
        if(!stored)return;
        const envelope=JSON.parse(stored);
        const age=Date.now()-Number(envelope?.createdAt);
        if(age<0||age>OAUTH_HANDOFF_TTL_MS)localStorage.removeItem(CORRIDAS_GOOGLE_KEY);
      }catch{try{localStorage.removeItem(CORRIDAS_GOOGLE_KEY);}catch{/* storage indisponível */}}
    };
    clearExpiredCorridasGoogle();
    const PUBLIC_ROUTE_FRAGMENTS=['/login','/register','/cadastro','/recuperar-senha','/redefinir-senha','/auth/callback'];

    function authStorageKey(moduleName){
      return moduleName==='corridas'?'apois-superapp-corridas-auth-v1':'apois-superapp-entregas-auth-v1';
    }

    function routeStorageKey(moduleName){
      return 'apois-superapp:last-route:'+moduleName;
    }

    function hasPersistedSession(moduleName){
      const key=authStorageKey(moduleName);
      try{
        const raw=localStorage.getItem(key);
        if(!raw)return false;
        const parsed=JSON.parse(raw);
        return Boolean(parsed?.access_token||parsed?.currentSession?.access_token||parsed?.session?.access_token);
      }catch{
        try{localStorage.removeItem(key);}catch{}
        return false;
      }
    }

    function resumableRoute(moduleName){
      if(!hasPersistedSession(moduleName))return null;
      try{
        const route=localStorage.getItem(routeStorageKey(moduleName));
        if(!route||!route.startsWith('#/'))return null;
        if(PUBLIC_ROUTE_FRAGMENTS.some((fragment)=>route.includes(fragment)))return null;
        return route;
      }catch{return null;}
    }

    function moduleDestination(moduleName){
      const base=moduleUrls[moduleName];
      if(!base)return null;
      const route=resumableRoute(moduleName);
      if(route)return base+route;
      return hasPersistedSession(moduleName)?base+'#/inicio':base+'#/login';
    }

    function openModule(moduleName){
      const destination=moduleDestination(moduleName);
      if(!destination)return;
      try{localStorage.setItem(LAST_MODULE_KEY,moduleName);}catch{}
      window.dispatchEvent(new CustomEvent('apois:module-selected',{detail:{module:moduleName}}));
      window.location.replace(destination);
    }

    document.querySelectorAll('[data-module]').forEach((button)=>button.addEventListener('click',()=>openModule(button.dataset.module)));

    function relayAuthDeepLink(rawUrl){
      if(typeof rawUrl!=='string'||!rawUrl.startsWith('br.com.apois.app://auth/'))return false;
      try{
        try{
          const previousRaw=sessionStorage.getItem(AUTH_DEEP_LINK_KEY);
          if(previousRaw){try{const previous=JSON.parse(previousRaw);if(previous?.url===rawUrl&&Date.now()-Number(previous?.at||0)<5000)return true;}catch{}}
          sessionStorage.setItem(AUTH_DEEP_LINK_KEY,JSON.stringify({url:rawUrl,at:Date.now()}));
        }catch{}

        const incoming=new URL(rawUrl);
        const path=incoming.pathname.replace(/^\//,'');
        const params=new URLSearchParams(incoming.search);
        const fragment=incoming.hash.replace(/^#/,'');
        if(fragment){
          const fragmentParams=new URLSearchParams(fragment);
          fragmentParams.forEach((value,key)=>{if(!params.has(key))params.set(key,value);});
        }
        const suffix=()=>{const query=params.toString();return query?`?${query}`:'';};
        const storeCorridasGoogle=()=>{
          const codes=params.getAll('code');
          const providerError=params.get('error_description')||params.get('error');
          const hasSingleCode=codes.length===1&&Boolean(codes[0]?.trim());
          if((!hasSingleCode&&!providerError)||params.has('access_token')||params.has('refresh_token'))return false;
          try{
            const envelope=JSON.stringify({url:rawUrl,createdAt:Date.now()});
            localStorage.setItem(CORRIDAS_GOOGLE_KEY,envelope);
            window.setTimeout(()=>{try{if(localStorage.getItem(CORRIDAS_GOOGLE_KEY)===envelope)localStorage.removeItem(CORRIDAS_GOOGLE_KEY);}catch{/* storage indisponível */}},OAUTH_HANDOFF_TTL_MS);
            return true;
          }catch{return false;}
        };
        const hasPendingCorridas=()=>{
          try{
            const stored=localStorage.getItem(OAUTH_PENDING_KEY);
            if(!stored)return false;
            const envelope=JSON.parse(stored);
            const age=Date.now()-Number(envelope?.createdAt);
            if(envelope?.product==='corridas'&&age>=0&&age<=OAUTH_HANDOFF_TTL_MS){
              localStorage.removeItem(OAUTH_PENDING_KEY);
              return true;
            }
            if(age<0||age>OAUTH_HANDOFF_TTL_MS)localStorage.removeItem(OAUTH_PENDING_KEY);
            return false;
          }catch{try{localStorage.removeItem(OAUTH_PENDING_KEY);}catch{}return false;}
        };
        const hasPendingEntregas=()=>{
          try{
            const stored=localStorage.getItem(OAUTH_PENDING_KEY);
            if(!stored)return false;
            const envelope=JSON.parse(stored);
            const age=Date.now()-Number(envelope?.createdAt);
            if(envelope?.product==='entregas'&&age>=0&&age<=OAUTH_HANDOFF_TTL_MS){
              localStorage.removeItem(OAUTH_PENDING_KEY);
              return true;
            }
            if(age<0||age>OAUTH_HANDOFF_TTL_MS)localStorage.removeItem(OAUTH_PENDING_KEY);
            return false;
          }catch{try{localStorage.removeItem(OAUTH_PENDING_KEY);}catch{}return false;}
        };
        const storeEntregasGoogle=()=>{
          const codes=params.getAll('code');
          const hasSingleCode=codes.length===1&&Boolean(codes[0]?.trim());
          const hasTokenPair=Boolean(params.get('access_token')&&params.get('refresh_token'));
          if(!hasSingleCode&&!hasTokenPair)return false;
          try{
            const envelope=JSON.stringify({url:rawUrl,createdAt:Date.now()});
            localStorage.setItem(ENTREGAS_GOOGLE_KEY,envelope);
            window.setTimeout(()=>{try{if(localStorage.getItem(ENTREGAS_GOOGLE_KEY)===envelope)localStorage.removeItem(ENTREGAS_GOOGLE_KEY);}catch{}},OAUTH_HANDOFF_TTL_MS);
            return true;
          }catch{return false;}
        };
        if(path==='corridas-google'){
          if(!storeCorridasGoogle())return false;
          void window.Capacitor?.Plugins?.Browser?.close?.().catch(()=>undefined);
          window.location.replace('./modules/corridas/index.html#/login');
          return true;
        }
        if(path==='corridas-reset'){
          try{sessionStorage.setItem(CORRIDAS_RECOVERY_KEY,rawUrl);}catch{}
          window.location.replace('./modules/corridas/index.html');
          return true;
        }
        if(path==='email-change'){
          if(!params.has('next'))params.set('next','/perfil/dados-pessoais');
          window.location.replace(`./modules/entregas/index.html#/auth/callback${suffix()}`);
          return true;
        }
        if(path==='reset'){
          window.location.replace(`./modules/entregas/index.html#/redefinir-senha${suffix()}`);
          return true;
        }
        if(path==='callback'){
          try{
            if(hasPendingCorridas()&&storeCorridasGoogle()){
              void window.Capacitor?.Plugins?.Browser?.close?.().catch(()=>undefined);
              window.location.replace('./modules/corridas/index.html#/login');
              return true;
            }
            if(hasPendingEntregas()&&storeEntregasGoogle()){
              void window.Capacitor?.Plugins?.Browser?.close?.().catch(()=>undefined);
              window.location.replace('./modules/entregas/index.html#/login');
              return true;
            }
          }catch{}
          window.location.replace(`./modules/entregas/index.html#/auth/callback${suffix()}`);
          return true;
        }
      }catch(error){
        console.error('[APOIS] deep link inválido',error);
      }
      return false;
    }

    const appPlugin=window.Capacitor?.Plugins?.App;
    if(appPlugin){
      appPlugin.addListener('appUrlOpen',({url})=>{relayAuthDeepLink(url);}).catch(()=>undefined);
      appPlugin.getLaunchUrl().then((result)=>{if(result?.url)relayAuthDeepLink(result.url);}).catch(()=>undefined);
    }
  </script>
