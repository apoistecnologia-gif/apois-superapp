name: APOIS GPS - catalogo offline Vale PE-BA
on:
  push:
    branches: [lab/apois-navegacao-ferrostar-etapa1]
    paths: ['labs/apois-navigation/launch-vale/search.py','labs/apois-navigation/embedded-search/catalog.py','.github/workflows/apois-navigation-lab-launch-vale-search.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s labs/apois-navigation/embedded-search -p 'test_*.py' -v
      - run: sudo apt-get update -qq && sudo apt-get install -y osmium-tool
      - uses: actions/cache/restore@v4
        with:
          path: labs/apois-navigation/valhalla/.regional-cache
          key: apois-valhalla-petrolina-juazeiro-bbox-v1-2026-11
      - name: Generate search candidates from exact regional source
        run: |
          set -euo pipefail
          C=labs/apois-navigation/valhalla/.regional-cache
          (cd "$C" && echo 'c50dd021ab11518b230c191bc9fa85f683c9b82810f605476532c16172f55238  vale.osm.pbf' | sha256sum -c -)
          python labs/apois-navigation/launch-vale/search.py "$C/vale.osm.pbf" "$RUNNER_TEMP/apois-vale-search"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apois-launch-vale-search-candidates
          path: ${{ runner.temp }}/apois-vale-search/
          retention-days: 7
