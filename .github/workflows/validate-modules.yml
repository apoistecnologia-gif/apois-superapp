name: Validate Superapp Modules

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout superapp
        uses: actions/checkout@v4

      - name: Checkout APOIS Entregas snapshot
        uses: actions/checkout@v4
        with:
          repository: franciel046631/apois-entregas
          ref: 835772994e2c9828dbcef759016c4fad613090e4
          path: sources/apois-entregas
          token: ${{ github.token }}

      - name: Checkout APOIS Corridas Passageiro snapshot
        uses: actions/checkout@v4
        with:
          repository: franciel046631/say-hello-buddy-23-84b5dcbf
          ref: c25dd67464f0913da3dfbe5504ec018d6ff8dfec
          path: sources/apois-corridas-passageiro
          token: ${{ github.token }}

      - name: Checkout APOIS Corridas Motorista/Admin snapshot
        uses: actions/checkout@v4
        with:
          repository: franciel046631/movvi-go-connect
          ref: d10008ec86da135512e70aa6f3c0dc954922af9c
          path: sources/apois-corridas-motorista-admin
          token: ${{ github.token }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify protected source pins
        run: npm run verify:pins

      - name: Build Corridas Passageiro in isolated workspace
        run: npm run build:corridas

      - name: Build Entregas Cliente in isolated workspace
        run: npm run build:entregas
