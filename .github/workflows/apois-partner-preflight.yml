name: APOIS Parceiro - Preflight sem APK
on:
  push:
    branches:
      - fix/apois-partner-courier-gps-logo-push-20261027
      - fix/entregas-homologacao-ajustes-20261030
      # QA219: isolated validation of generated Motorista/Parceiro modules; no APK or deploy.
      - fix/motorista-qa219-video-20261112
    paths:
      - '.github/workflows/apois-partner-preflight.yml'
      - 'scripts/**'
      - 'superapp/partner-shell/**'
      - 'superapp/shell/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-web-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUN_VERSION: "1.3.14"
      APOIS_REPO_TOKEN: ${{ secrets.APOIS_REPO_TOKEN }}
      CORRIDAS_VITE_SUPABASE_URL: ${{ secrets.CORRIDAS_VITE_SUPABASE_URL }}
      CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY }}
      CORRIDAS_WEB_MAPS_API_KEY: ${{ secrets.CORRIDAS_WEB_MAPS_API_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Protected source checkout
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APOIS_REPO_TOKEN:-}"
          git config --global url."https://x-access-token:${APOIS_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive
          test -f sources/apois-corridas-motorista-admin/src/routes/motorista.perfil.tsx
          test -f sources/apois-entregas/src/routes/courier.tsx
      - name: Install pinned Bun
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.bun/bin:$PATH"
          test "$(bun --version)" = "$BUN_VERSION"
      - name: Audit all partner policies and regression gates
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:pins
          npm run audit:partner
          node --check scripts/harden-partner-motorista-profile-contrast-v2.mjs
          node --check scripts/harden-partner-courier-driver-inspired-home-v1.mjs
          node --check scripts/harden-partner-courier-map-native-fallback-v3.mjs
          node --check scripts/harden-partner-courier-inner-panels-v1.mjs
          node --check scripts/harden-partner-courier-push-diagnostics-v1.mjs
          node --check scripts/harden-partner-courier-waiting-compact-v2.mjs
          node --check scripts/audit-partner-preflight-v1.mjs
          node --check api/admin/driver-documents.js
          cmp -s api/admin/driver-documents.js admin-preview/api/admin/driver-documents.js
          node scripts/test-admin-preview-private-documents-v1.mjs
          node scripts/audit-partner-preflight-v1.mjs
          node scripts/test-partner-shell-navigation-v2.mjs
          node --test scripts/test-courier-navigation-busy-v1.mjs
      - name: PostgreSQL 17 disposable cash-contract tests (synthetic, no Supabase)
        shell: bash
        run: bash scripts/test-cash-postgres-isolated-v1.sh

      - name: Build web modules and run typechecks - NO ANDROID APK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          npm run build:partner
          node scripts/build-corridas-admin-spa-v1.mjs
          test -s .work/partner-motorista/dist/admin-preview/index.html
          node --test scripts/test-courier-entry-retry-v1.mjs
          node scripts/audit-partner-preflight-v1.mjs --dist
          node scripts/test-partner-shell-navigation-v2.mjs --dist
          node --check scripts/fix-partner-motorista-recovery-relay-v2.mjs
          node scripts/test-partner-driver-recovery-relay-v2.mjs
          test -s superapp/partner-shell/dist/modules/motorista/index.html
          test -s superapp/partner-shell/dist/modules/entregador/index.html
          test -s superapp/partner-shell/dist/index.html
          echo "[OK] Motorista + Entregador: web bundles e checks prontos para posterior APK"

      - name: Install isolated browser QA tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/apois-browser-qa" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.62.1
          "$RUNNER_TEMP/apois-browser-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render anonymous WEB screens with external network blocked
        shell: bash
        env:
          APOIS_PLAYWRIGHT_ROOT: ${{ runner.temp }}/apois-browser-qa
        run: |
          node scripts/audit-browser-public-v1.mjs parceiro
          node scripts/audit-admin-preview-render-v2.mjs
          node scripts/test-courier-home-render-v1.mjs
      - name: Preserve browser QA screenshots and metrics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: apois-browser-parceiro-${{ github.sha }}
          path: |
            qa-browser/parceiro/
            qa-browser/admin-corridas/
          if-no-files-found: warn
          retention-days: 7

  # Only WEB builders: no Gradle, Capacitor Android, deployment or SQL mutations.
  web-other-modules:
    name: WEB-only ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [cliente, estabelecimento]
    env:
      BUN_VERSION: "1.3.14"
      APOIS_REPO_TOKEN: ${{ secrets.APOIS_REPO_TOKEN }}
      CORRIDAS_VITE_SUPABASE_URL: ${{ secrets.CORRIDAS_VITE_SUPABASE_URL }}
      CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY }}
      CORRIDAS_WEB_MAPS_API_KEY: ${{ secrets.CORRIDAS_WEB_MAPS_API_KEY }}
      CORRIDAS_ANDROID_MAPS_API_KEY: ""
      ENTREGAS_WEB_MAPS_API_KEY: ${{ secrets.ENTREGAS_WEB_MAPS_API_KEY }}
      ENTREGAS_GOOGLE_MAPS_MAP_ID: ${{ vars.ENTREGAS_GOOGLE_MAPS_MAP_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Checkout pinned protected repositories
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APOIS_REPO_TOKEN:-}"
          git config --global url."https://x-access-token:${APOIS_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive
          npm run verify:pins
      - name: Install pinned Bun
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.bun/bin:$PATH"
          test "$(bun --version)" = "$BUN_VERSION"
      - name: Static audit + isolated WEB build only
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          npm run audit:ui
          if [ "${{ matrix.target }}" = "cliente" ]; then
            npm run build:corridas
            npm run build:entregas
            npm run build:shell
            npm run harden:auth-deeplinks
            npm run inject:push-routing
            npm run verify:dist
            test -s superapp/shell/dist/modules/corridas/index.html
            test -s superapp/shell/dist/modules/entregas/index.html
            echo "[OK] Cliente Corridas e Cliente Entregas: WEB preflight, nenhum APK"
          else
            npm run build:merchant
            test -s .vercel/output/config.json
            echo "[OK] Painel Estabelecimento: build WEB local, nenhum deploy"
            # Build the protected Admin Entregas routes separately in the same
            # ephemeral QA workspace. No Vercel CLI, APK or deployment action.
            (
              cd .work/entregas
              APOIS_MOBILE_BUILD=0 bun run build:admin
            )
            echo "[OK] Painel Admin Entregas: rotas WEB compiladas isoladamente, nenhum deploy"
          fi

      - name: Install isolated browser QA tools
        if: matrix.target == 'cliente'
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/apois-browser-qa" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.62.1
          "$RUNNER_TEMP/apois-browser-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render anonymous WEB screens with external network blocked
        if: matrix.target == 'cliente'
        shell: bash
        env:
          APOIS_PLAYWRIGHT_ROOT: ${{ runner.temp }}/apois-browser-qa
        run: node scripts/audit-browser-public-v1.mjs cliente
      - name: Preserve browser QA screenshots and metrics
        if: ${{ always() && matrix.target == 'cliente' }}
        uses: actions/upload-artifact@v4
        with:
          name: apois-browser-cliente-${{ github.sha }}
          path: qa-browser/cliente/
          if-no-files-found: warn
          retention-days: 7
