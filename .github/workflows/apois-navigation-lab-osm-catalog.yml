name: APOIS Navegacao - catalogo OSM regional (sem deploy)
on:
  push:
    branches: [lab/apois-navegacao-ferrostar-etapa1]
    paths:
      - '.github/workflows/apois-navigation-lab-osm-catalog.yml'
      - 'labs/apois-navigation/osm-search/**'
      - 'labs/apois-navigation/passenger-provenance-snapshot/experimental/apois-navigation/ui/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node labs/apois-navigation/passenger-provenance-snapshot/verify.mjs
      - name: Testar busca offline com dados sinteticos
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {createOsmSearch} from './labs/apois-navigation/osm-search/search.mjs'
          const manifest = {source:'OSM_PBF',version:1,extract_sha256:'a'}
          const row = {version:1,extract_sha256:'a',lat:-9.4,lng:-40.5,active:true}
          const rows = [
            {...row,id:'a',label:'Praça da Sé',street:'Rua São José',house_number:'12',neighborhood:'Centro'},
            {...row,id:'b',label:'Praça da Serra',street:'Rua São José',house_number:'120'},
            {...row,id:'c',label:'Praça da Sé',active:false},
            {...row,id:'d',label:'Praça da Sé',extract_sha256:'b'},
          ]
          const search = createOsmSearch({...manifest,rows})
          assert.deepEqual(search('Praca da Se').map(x=>x.id),['a','b'])
          assert.deepEqual(search('Sao Jose 12').map(x=>x.id),['a'])
          assert.deepEqual(search('Sao Jose 120').map(x=>x.id),['b'])
          assert.deepEqual(search('praca centro').map(x=>x.id),['a'])
          assert.deepEqual(createOsmSearch({...manifest,rows:[rows[2]]})('praca'),[])
          assert.throws(()=>createOsmSearch({source:'GOOGLE',rows:[]}),TypeError)
          console.log('APOIS_OSM_SEARCH_OK')
          JS
      - name: Testar selecao no mapa com o contrato do Passageiro
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {createSelectionCatalog} from './labs/apois-navigation/osm-search/map-selection.mjs'
          import {confirmIndependentSelection} from './labs/apois-navigation/passenger-provenance-snapshot/src/services/navigation/independent-selection.ts'

          const digest = 'a'.repeat(64)
          const row = {version:1,active:true,extract_sha256:digest,lng:-40.5}
          const [pickupId,destinationId,requestKey,selectionId,inactiveId] =
            [1,2,3,4,5].map(n=>'00000000-0000-4000-8000-00000000000'+n)
          const catalog = createSelectionCatalog({source:'OSM_PBF',version:1,extract_sha256:digest,rows:[
            {...row,id:pickupId,lat:-9.4,label:'Embarque'},
            {...row,id:destinationId,lat:-9.41,label:'Destino'},
            {...row,id:inactiveId,lat:-9.42,label:'Desativado',active:false},
          ]})
          assert.equal(catalog.suggestForMapTap({lat:-9.4002,lng:-40.5}).id,pickupId)
          assert.equal(catalog.suggestForMapTap({lat:-9.42,lng:-40.5}),null)
          assert.equal(catalog.suggestForMapTap({lat:-9.405,lng:-40.5}),null)
          const draft = {requestKey,pickupId,destinationId}
          assert.equal(catalog.prepareConfirmation(draft),null)
          assert.equal(catalog.prepareConfirmation({...draft,confirmed:true,destinationId:inactiveId}),null)
          const payload = catalog.prepareConfirmation({...draft,confirmed:true})
          const now = Date.now()
          let sent
          const result = await confirmIndependentSelection(payload,async body=>{
            sent = body
            return {selectionId,requestKey,expiresAt:new Date(now+120000).toISOString(),
              origin:{lat:-9.4,lng:-40.5,label:'Embarque'},
              destination:{lat:-9.41,lng:-40.5,label:'Destino'}}
          },undefined,()=>now)
          assert.equal(result?.selectionId,selectionId)
          assert.deepEqual(sent,{requestKey,confirmed:true,
            pickup:{id:pickupId,version:1},destination:{id:destinationId,version:1}})
          console.log('APOIS_SELECTION_CLIENT_CONTRACT_OK')
          JS
      - run: node --test labs/apois-navigation/osm-search/passenger-flow.test.mjs labs/apois-navigation/osm-search/passenger-panel.test.mjs labs/apois-navigation/passenger-provenance-snapshot/experimental/apois-navigation/ui/passenger-panel.test.mjs labs/apois-navigation/passenger-provenance-snapshot/experimental/apois-navigation/ui/request-review.test.mjs
      - name: Mes do cache regional
        id: cache-month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: labs/apois-navigation/valhalla/.regional-cache
          key: apois-valhalla-petrolina-juazeiro-bbox-v1-${{ steps.cache-month.outputs.month }}
          fail-on-cache-miss: true
      - run: sudo apt-get update -qq && sudo apt-get install -y osmium-tool
      - name: Derivar catalogo do extrato regional ja verificado
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/labs/apois-navigation/valhalla/.regional-cache"
          D="$RUNNER_TEMP/apois-osm-catalog"
          mkdir -p "$D"
          (cd "$C" && sha256sum -c extract.sha256)
          osmium fileinfo "$C/vale.osm.pbf" > "$D/extract-info.txt"
          cp "$C/source-sha256.txt" "$C/extract.sha256" "$D/"
          python3 labs/apois-navigation/passenger-provenance-snapshot/experimental/apois-navigation/import_catalog.py --extract "$C/vale.osm.pbf" --expected-sha256 "$(cut -d' ' -f1 "$C/extract.sha256")" --version 1 --out "$D/catalog.json"
          python3 - "$D/catalog.json" <<'PY'
          import json,sys,pathlib
          p=pathlib.Path(sys.argv[1]); c=json.loads(p.read_text())
          assert c["source"]=="OSM_PBF" and c["count"]==len(c["rows"]) and c["count"]>0
          assert len({r["id"] for r in c["rows"]})==c["count"]
          assert all(r["active"] is False and r["extract_sha256"]==c["extract_sha256"] for r in c["rows"])
          print("APOIS_REAL_CATALOG_VALIDATED",json.dumps({"count":c["count"],"bytes":p.stat().st_size,"extract_sha256":c["extract_sha256"],"active":0}))
          PY
      - name: Medir cobertura de ruas, enderecos e bairros no extrato
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/labs/apois-navigation/valhalla/.regional-cache"
          D="$RUNNER_TEMP/apois-osm-catalog"
          osmium tags-filter -R "$C/vale.osm.pbf" \
            w/highway nwr/addr:housenumber nwr/place \
            -o "$RUNNER_TEMP/apois-coverage.osm.pbf"
          osmium cat "$RUNNER_TEMP/apois-coverage.osm.pbf" -f opl \
            | python3 -c '
          import collections
          import json
          import pathlib
          import sys

          counts = collections.Counter(dict.fromkeys([
              "named_highway_segments",
              "objects_with_house_number",
              "objects_with_house_number_and_street",
              "objects_with_house_number_and_place",
              "named_neighborhood_objects",
          ], 0))
          for line in sys.stdin:
              fields = line.split()
              raw_tags = next((field[1:] for field in fields if field.startswith("T")), "")
              tags = dict(tag.split("=", 1) for tag in raw_tags.split(",") if "=" in tag)
              if fields[0].startswith("w") and tags.get("highway") and tags.get("name"):
                  counts["named_highway_segments"] += 1
              if tags.get("addr:housenumber"):
                  counts["objects_with_house_number"] += 1
                  if tags.get("addr:street"):
                      counts["objects_with_house_number_and_street"] += 1
                  if tags.get("addr:place"):
                      counts["objects_with_house_number_and_place"] += 1
              if tags.get("name") and tags.get("place") in {"suburb", "quarter", "neighbourhood"}:
                  counts["named_neighborhood_objects"] += 1

          output = pathlib.Path(sys.argv[1])
          extract_sha256 = (output.parent / "extract.sha256").read_text().split()[0]
          report = {
              "extract_sha256": extract_sha256,
              "license": "ODbL-1.0",
              "attribution": "© OpenStreetMap contributors",
              "scope": "OSM objects in the cached regional extract; no deduplication or completeness estimate",
              "counts": dict(counts),
          }
          payload = json.dumps(report, ensure_ascii=False, sort_keys=True)
          output.write_text(payload + "\n", encoding="utf-8")
          print("APOIS_OSM_ADDRESS_COVERAGE", payload)
          ' "$D/address-coverage.json"
      - name: Extrair enderecos OSM para catalogo desativado
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/labs/apois-navigation/valhalla/.regional-cache"
          D="$RUNNER_TEMP/apois-osm-catalog"
          python3 labs/apois-navigation/osm-search/import_addresses.py \
            --verified-extract "$C/vale.osm.pbf" \
            --sha256 "$(cut -d' ' -f1 "$C/extract.sha256")" \
            --version 1 --out "$D/address-catalog.json"
      - uses: actions/upload-artifact@v4
        with:
          name: apois-independent-regional-catalog
          path: ${{ runner.temp }}/apois-osm-catalog/
          retention-days: 7
