name: APOIS Motorista - APK EXCLUSIVO Corridas TESTE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apois-motorista-only-qa-apk.yml
      - scripts/apply-driver-login-approved-qa-v1.mjs
      - scripts/build-partner-modules.sh
      - scripts/harden-partner-motorista-google-oauth-recovery-v1.mjs
      - scripts/build-apois-motorista-only-qa.mjs
      - superapp/partner-shell/index-motorista-only.html
      - superapp/partner-shell/motorista-welcome.html

permissions:
  contents: read

concurrency:
  group: motorista-only-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-partner-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      BUN_VERSION: "1.3.14"
      APOIS_REPO_TOKEN: ${{ secrets.APOIS_REPO_TOKEN }}
      CORRIDAS_VITE_SUPABASE_URL: ${{ secrets.CORRIDAS_VITE_SUPABASE_URL }}
      CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY }}
      CORRIDAS_WEB_MAPS_API_KEY: ${{ secrets.CORRIDAS_WEB_MAPS_API_KEY }}
      CORRIDAS_ANDROID_MAPS_API_KEY: ${{ secrets.CORRIDAS_ANDROID_MAPS_API_KEY }}
      ENTREGAS_WEB_MAPS_API_KEY: ${{ secrets.ENTREGAS_WEB_MAPS_API_KEY }}
      ENTREGAS_GOOGLE_MAPS_MAP_ID: ${{ vars.ENTREGAS_GOOGLE_MAPS_MAP_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      FIREBASE_PARTNER_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_PARTNER_GOOGLE_SERVICES_JSON_BASE64 }}
      PARTNER_FIREBASE_PROJECT_ID: "movvi-4d041"
      PARTNER_APP_PACKAGE: "br.com.apois.parceiro"
      PARTNER_APP_LABEL: "APOIS Motorista"
      APOIS_PARTNER_QA_DEBUG_KEYSTORE_BASE64: ${{ secrets.APOIS_PARTNER_QA_DEBUG_KEYSTORE_BASE64 }}
      APOIS_PARTNER_QA_CERT_SHA256: ${{ secrets.APOIS_PARTNER_QA_CERT_SHA256 }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Verificar configuracao sem revelar segredos
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in APOIS_REPO_TOKEN CORRIDAS_VITE_SUPABASE_URL CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY CORRIDAS_WEB_MAPS_API_KEY CORRIDAS_ANDROID_MAPS_API_KEY VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY FIREBASE_PARTNER_GOOGLE_SERVICES_JSON_BASE64 APOIS_PARTNER_QA_DEBUG_KEYSTORE_BASE64 APOIS_PARTNER_QA_CERT_SHA256; do
            if [ -z "$(printenv "$key")" ]; then
              echo "::error::Variavel obrigatoria ausente: $key"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo '[OK] Configuracao completa para APK Parceiro.'

      - name: Checkout fontes protegidas e pins
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:$APOIS_REPO_TOKEN@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive
          npm run verify:pins

      - name: Validar autenticação do Supabase Corridas ativo
        shell: bash
        env:
          APOIS_CORRIDAS_PUBLIC_KEY: sb_publishable_gbh4HsVrO-EaT5QeYbT8dQ_-dW19bVu
        run: |
          set -euo pipefail
          PROD_URL='https://tbbzkrfupmqdywnzgnms.supabase.co'
          test -n "$APOIS_CORRIDAS_PUBLIC_KEY"
          echo "CORRIDAS_VITE_SUPABASE_URL=$PROD_URL" >> "$GITHUB_ENV"
          echo "CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY=$APOIS_CORRIDAS_PUBLIC_KEY" >> "$GITHUB_ENV"
          # Teste de URL REAL e do provedor antes de incluir login Google no APK.
          curl -fSsL --retry 2 --connect-timeout 8 --max-time 22 \
            -H "apikey: $APOIS_CORRIDAS_PUBLIC_KEY" \
            "$PROD_URL/auth/v1/settings" > "$RUNNER_TEMP/apois-auth-settings.json"
          node -e '
            const fs=require("fs");
            const obj=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            const enabled=obj?.external?.google===true;
            console.log("[CHECK] OAuth Google habilitado: "+enabled);
            if(!enabled)process.exit(16);
          ' "$RUNNER_TEMP/apois-auth-settings.json"
          echo '[OK] Supabase Corridas PRODUCTION acessivel; endpoint de login Google ativo.'
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SDK_ROOT"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Instalar Bun
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash -s "bun-v$BUN_VERSION"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.bun/bin:$PATH"
          test "$(bun --version)" = "$BUN_VERSION"

      - name: Configurar versao de teste
        shell: bash
        run: |
          echo "PARTNER_VERSION_CODE=$((9000+GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "PARTNER_VERSION_NAME=1.0.11-qa.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Compilar fontes conservadas e isolar a distribuicao Motorista
        shell: bash
        run: |
          set -euo pipefail
          # Homologação não publica release; Codemagic continua sendo único publicador oficial.
          # A auditoria v22 reprova deliberadamente qualquer arquivo de GitHub Actions,
          # inclusive este workflow QA. Executamos todas as demais auditorias sem
          # desabilitar nem modificar a regra de release.
          npm run audit:partner
          node scripts/audit-mobile-ui-v16.mjs
          node scripts/audit-unified-app-surfaces-v17.mjs
          node scripts/audit-codemagic-host-installs-v18.mjs
          node scripts/audit-entregas-order-finish-ui-v19.mjs
          node scripts/audit-entregas-auth-mobile-ui-v20.mjs
          node scripts/audit-shell-branding-v21.mjs
          node scripts/audit-unified-brand-theme-v23.mjs
          node scripts/audit-entregas-brand-sweep-v24.mjs
          npm run verify:pins
          npm run verify:partner-portability
          node scripts/run-bash.mjs scripts/build-partner-modules.sh
          node scripts/build-apois-motorista-only-qa.mjs brand
          node scripts/build-apois-motorista-only-qa.mjs web
          test -s superapp/partner-shell/dist/motorista-welcome.html
          test -s superapp/partner-shell/dist/assets/apois-motorista-hero.webp
          grep -Fq 'data-apois-driver-approved-welcome-v1' superapp/partner-shell/dist/motorista-welcome.html
          grep -Fq 'APOIS_MOTORISTA_APPROVED_WELCOME_RESTORED_V1' superapp/partner-shell/dist/index.html
          test ! -e superapp/partner-shell/dist/modules/entregador
          grep -Fq 'APOIS MOTORISTA' superapp/partner-shell/dist/index.html
          grep -Fq 'APOIS_DRIVER_HOME_PREMIUM_V1' .work/partner-motorista/src/routes/motorista.app.tsx
          grep -Fq 'themeOverride={!active ? "client" : "dark"}' .work/partner-motorista/src/routes/motorista.app.tsx
          grep -Fq 'Preferências do passageiro' .work/partner-motorista/src/routes/motorista.app.tsx
          grep -Fq 'APOIS_MOTORISTA_GOOGLE_OAUTH_RECOVERY_V1' .work/partner-motorista/src/components/DriverGoogleLoginButton.tsx
          grep -R -Fq 'O Google não respondeu' superapp/partner-shell/dist/modules/motorista
          grep -Fq 'tbbzkrfupmqdywnzgnms.supabase.co' .work/partner-motorista/.env.mobile.local
          ! grep -Fq 'vqtucstyduxrqjgyigfk.supabase.co' .work/partner-motorista/.env.mobile.local
          grep -Fq 'data-apois-driver-approved-login-v1' .work/partner-motorista/src/routes/motorista.login.tsx
          grep -R -Fq 'data-apois-driver-approved-login-v1' superapp/partner-shell/dist/modules/motorista
          if grep -Fq '#F6BE1C' .work/partner-motorista/src/routes/motorista.login.tsx || grep -Fq 'bg-[#030405]' .work/partner-motorista/src/routes/motorista.login.tsx; then
            echo "::error::Regressao: o login antigo preto/dourado reapareceu"; exit 1
          fi
          echo '[OK] Interface aprovada de login branco/vermelho incluida no APK.'
          test -s superapp/partner-shell/dist/modules/motorista/index.html
          test ! -e superapp/partner-shell/dist/modules/entregador
          echo '[OK] Bundle completo com nova Home.'

      - name: Criar Android nativo Parceiro
        shell: bash
        run: |
          set -euo pipefail
          cd superapp/partner-shell
          bun install
          cd ../..
          node scripts/build-apois-motorista-only-qa.mjs config
          grep -Fq "appName: 'APOIS Motorista'" superapp/partner-shell/capacitor.config.ts
          cd superapp/partner-shell
          rm -rf android
          bunx cap add android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          bunx cap sync android
          cd ../..
          node scripts/configure-partner-android.mjs
          node scripts/install-partner-launcher.mjs
          node scripts/install-partner-splash.mjs
          node scripts/build-apois-motorista-only-qa.mjs native
          test ! -e superapp/partner-shell/android/app/src/main/java/br/com/apois/parceiro/CourierLocationPlugin.java
          test ! -e superapp/partner-shell/android/app/src/main/java/br/com/apois/parceiro/CourierLocationService.java
          grep -Fq 'APOIS Motorista' superapp/partner-shell/android/app/src/main/res/values/strings.xml
          ! grep -Fq '>APOIS Parceiro<' superapp/partner-shell/android/app/src/main/res/values/strings.xml
          test -s superapp/partner-shell/android/app/google-services.json
          grep -Fq "versionCode $PARTNER_VERSION_CODE" superapp/partner-shell/android/app/build.gradle
          grep -Fq "versionName \"$PARTNER_VERSION_NAME\"" superapp/partner-shell/android/app/build.gradle

      - name: Exigir certificado original protegido e configurar assinatura Gradle
        shell: bash
        run: |
          set -euo pipefail
          : "${APOIS_PARTNER_QA_DEBUG_KEYSTORE_BASE64:?Keystore original do Motorista obrigatorio}"
          : "${APOIS_PARTNER_QA_CERT_SHA256:?SHA-256 do certificado QA Motorista obrigatorio}"
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$APOIS_PARTNER_QA_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          # Chave somente do Motorista: o Gradle precisa usa-la explicitamente.
          node scripts/qa/configure-partner-qa-debug-signing-v1.mjs
          echo '[OK] Certificado original do APK Motorista confirmado antes da compilacao.'

      - name: Compilar e verificar APK assinado para teste
        shell: bash
        run: |
          set -euo pipefail
          cd superapp/partner-shell/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ../../..
          APK="superapp/partner-shell/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt -perm -111 | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK" >/dev/null
          APK_CERT="$("$APKSIGNER" verify --print-certs "$APK" | node scripts/qa/extract-partner-apk-cert-sha256-v1.mjs)"
          EXPECTED_CERT="$(printf '%s' "$APOIS_PARTNER_QA_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          if [ "${#EXPECTED_CERT}" -ne 64 ] || [ "$APK_CERT" != "$EXPECTED_CERT" ]; then
            echo '::error::Certificado do APK Motorista divergente do original; artefato BLOQUEADO.'
            exit 1
          fi
          echo '[OK] APK assinado com a identidade protegida e original do Motorista.'
          test "$PARTNER_VERSION_CODE" -gt 335
          "$AAPT" dump badging "$APK" | grep -F "name='br.com.apois.parceiro'"
          "$AAPT" dump badging "$APK" | grep -F "application-label:'APOIS Motorista'"
          echo '[OK] Rótulo do launcher validado dentro do APK: APOIS Motorista.'
          "$AAPT" dump badging "$APK" | grep -F "versionCode='$PARTNER_VERSION_CODE'"
          "$APKSIGNER" verify --print-certs "$APK" | grep -Ei 'certificate .*digest' | head -n 3 || true
          # Critérios obrigatorios do APK isolado: sem Entregas nem Courier nativo.
          unzip -Z1 "$APK" > "$RUNNER_TEMP/apois-motorista-files.txt"
          grep -Eq '^assets/public/modules/motorista/' "$RUNNER_TEMP/apois-motorista-files.txt"
          if grep -Ei 'assets/public/modules/entregador/|CourierLocation|Entregador' "$RUNNER_TEMP/apois-motorista-files.txt"; then
            echo "::error::O APK ainda contem artefatos de Entregas"; exit 1
          fi
          test -s superapp/branding/apois-client-red-logo.b64
          test -s superapp/partner-shell/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          echo '[OK] APK SOMENTE Corridas; iconografia vermelha oficial do Cliente; Courier removido.'
          mkdir -p build
          cp "$APK" build/APOIS-Motorista-Somente-Corridas-TESTE.apk
          echo '[OK] APK APOIS Motorista exclusivo pronto para homologacao.'

      - uses: actions/upload-artifact@v4
        with:
          name: APOIS-Motorista-Somente-Corridas-TESTE
          path: build/APOIS-Motorista-Somente-Corridas-TESTE.apk
          if-no-files-found: error
          retention-days: 14
