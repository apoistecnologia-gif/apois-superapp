name: APOIS Motorista - Auditoria recuperacao (sem APK)
on:
  push:
    branches:
      - fix/apois-motorista-assinatura-recuperacao-20261124
    paths:
      - .github/workflows/apois-motorista-recovery-audit.yml
      - .github/workflows/apois-motorista-only-qa-apk.yml
      - .github/workflows/apois-partner-motorista-home-qa-apk.yml
      - scripts/qa/test-motorista-recovery-gates-v1.test.mjs
      - scripts/qa/configure-partner-qa-debug-signing-v1.mjs
      - scripts/qa/extract-partner-apk-cert-sha256-v1.mjs
      - scripts/build-apois-motorista-only-qa.mjs
      - scripts/build-partner-modules.sh
      - superapp/partner-shell/build.mjs
      - scripts/install-partner-launcher.mjs
      - scripts/sanitize-partner-launcher-resources.mjs
      - scripts/install-partner-splash.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-no-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source and signing regression gates
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-partner-modules.sh
          for file in superapp/partner-shell/build.mjs scripts/build-apois-motorista-only-qa.mjs scripts/install-partner-launcher.mjs scripts/sanitize-partner-launcher-resources.mjs scripts/install-partner-splash.mjs scripts/qa/configure-partner-qa-debug-signing-v1.mjs scripts/qa/extract-partner-apk-cert-sha256-v1.mjs; do
            node --check "$file"
          done
          node --test scripts/qa/test-motorista-recovery-gates-v1.test.mjs
      - name: Confirm no Android/keystore build was requested
        run: echo '[OK] Apenas auditoria estÃ¡tica; nenhum APK foi criado nem assinado.'

  verify-protected-partner-keystore:
    name: Comprovar segredo de assinatura do Motorista (sem compilar)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PARTNER_QA_KEY_B64: ${{ secrets.APOIS_PARTNER_QA_DEBUG_KEYSTORE_BASE64 }}
      PARTNER_QA_CERT_SHA256: ${{ secrets.APOIS_PARTNER_QA_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirmar integridade do keystore original protegido
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$PARTNER_QA_KEY_B64" ] || [ -z "$PARTNER_QA_CERT_SHA256" ]; then
            echo '::error::Segredo de assinatura original do Motorista ausente.'
            exit 1
          fi
          EXPECTED="$(printf '%s' "$PARTNER_QA_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ': -')"
          KNOWN_PREVIOUS_APK_CERT='4a3476b91674301eb066146b6f3b8384d9827ab4bdb287b6f00cbbeab56a33f4'
          if [[ ! "$EXPECTED" =~ ^[a-f0-9]{64}$ ]] || [ "$EXPECTED" != "$KNOWN_PREVIOUS_APK_CERT" ]; then
            echo '::error::Certificado protegido difere do APK Parceiro QA historicamente assinado.'
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/apois-partner-recovery-debug.keystore"
          umask 077
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$PARTNER_QA_KEY_B64" | base64 --decode > "$KEY_FILE"
          test -s "$KEY_FILE"
          ACTUAL="$(keytool -list -v -keystore "$KEY_FILE" -alias androiddebugkey -storepass android |
            grep -m1 'SHA256:' | sed -E 's/.*SHA256:[[:space:]]*//;s/://g' | tr '[:upper:]' '[:lower:]')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo '::error::Keystore atual nao corresponde ao APK antigo: bloqueada assinatura de atualizacao.'
            exit 1
          fi
          echo '[OK] Keystore QA Motorista intacto, certificado confere com APK historico; nenhum APK foi gerado.'

  locate-installed-qa-key:
    name: Verificar se existe chave compativel com o APK do aparelho (sem APK)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MOTORISTA_PARTNER_KEY: ${{ secrets.APOIS_PARTNER_QA_DEBUG_KEYSTORE_BASE64 }}
      MOTORISTA_CLIENT_KEY: ${{ secrets.APOIS_CLIENT_QA_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Conferir chaves protegidas sem expor chave ou certificado
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_INSTALLED='94a11563082e4f8e57f76b0a5d0982d4b88da93353753f87c732310e9d887132'
          FOUND=0
          check_key() {
            local name="$1"
            local encoded="$2"
            local keyfile="$RUNNER_TEMP/apois-motorista-compare-${name}.keystore"
            if [ -z "$encoded" ]; then
              echo "[INFO] Chave protegida ${name} nao disponivel."
              return
            fi
            umask 077
            if ! printf '%s' "$encoded" | base64 --decode > "$keyfile" 2>/dev/null; then
              echo "[BLOCK] Chave ${name} indisponivel ou invalida."
              rm -f "$keyfile"
              return
            fi
            local actual=''
            actual="$(keytool -list -v -keystore "$keyfile" -alias androiddebugkey -storepass android 2>/dev/null |
              grep -m1 'SHA256:' | sed -E 's/.*SHA256:[[:space:]]*//;s/://g' | tr '[:upper:]' '[:lower:]')" || true
            rm -f "$keyfile"
            if [ "$actual" = "$EXPECTED_INSTALLED" ]; then
              echo "[FOUND] Keystore ${name} compativel com certificado do APK instalado."
              FOUND=1
            else
              echo "[NO MATCH] Keystore ${name} nao assina a instalacao atual."
            fi
          }
          check_key 'partner' "$MOTORISTA_PARTNER_KEY"
          check_key 'cliente' "$MOTORISTA_CLIENT_KEY"
          if [ "$FOUND" -eq 0 ]; then
            echo '::error::BLOQUEIO DE ATUALIZACAO: nenhum keystore protegido corresponde ao APK instalado (cert SHA-256 94A11563...).'
            exit 1
          else
            echo '[OK] Uma chave privada original ainda esta disponivel para a instalacao atual.'
          fi
          echo '[OK] Analise somente leitura: nenhum APK gerado, nenhuma chave enviada ou exibida.'
