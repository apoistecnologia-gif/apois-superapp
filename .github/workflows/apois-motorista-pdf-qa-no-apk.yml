name: APOIS Motorista PDF 12-11 - QA sem APK

on:
  push:
    branches:
      - fix/motorista-ui-pdf-20261112
      - fix/motorista-mapa-rotacao-video-20261112
      - feat/apois-motorista-premium-visual-20261122
      - fix/apois-parceiro-qa291-entregador-mapa-premium-20261123
    paths:
      - '.github/workflows/apois-motorista-pdf-qa-no-apk.yml'
      - 'scripts/fix-partner-driver-pdf-notes-20261112-v1.mjs'
      - 'scripts/fix-partner-driver-video-map-rotation-20261112-v1.mjs'
      - 'scripts/qa/test-partner-driver-video-map-rotation-20261112-v1.test.mjs'
      - 'scripts/qa/test-partner-driver-pdf-notes-20261112-v1.test.mjs'
      - 'scripts/build-partner-release.sh'
      - 'scripts/apply-partner-motorista-premium-home-v1.mjs'
      - 'scripts/qa/test-partner-motorista-premium-home-v1.test.mjs'
      - 'scripts/apply-partner-courier-premium-home-v1.mjs'
      - 'scripts/qa/test-partner-courier-premium-home-v1.test.mjs'
      - 'scripts/apply-partner-premium-all-screens-v1.mjs'
      - 'scripts/qa/verify-partner-premium-all-screens-v1.mjs'
      - 'scripts/fix-partner-courier-map-first-visual-v2.mjs'
      - 'scripts/qa/test-partner-courier-map-first-visual-v2.test.mjs'
      - 'superapp/partner-shell/index.html'
      - 'scripts/audit-shell-branding-v21.mjs'
      - 'scripts/audit-partner-red-visual-v16.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUN_VERSION: "1.3.14"
      APOIS_REPO_TOKEN: ${{ secrets.APOIS_REPO_TOKEN }}
      CORRIDAS_VITE_SUPABASE_URL: ${{ secrets.CORRIDAS_VITE_SUPABASE_URL }}
      CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY }}
      CORRIDAS_WEB_MAPS_API_KEY: ${{ secrets.CORRIDAS_WEB_MAPS_API_KEY }}
      VITE_APOIS_PARTNER_VECTOR_MAP_ID: "1af3628136c58ef870ba9d1a"
      VITE_APOIS_PARTNER_CLOUD_STYLE_VERIFIED: "true"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout public builder
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Fetch protected pinned sources
        run: |
          set -euo pipefail
          test -n "$APOIS_REPO_TOKEN"
          git config --global url."https://x-access-token:${APOIS_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive
          test -f sources/apois-corridas-motorista-admin/src/routes/motorista.app.tsx
          echo "[OK] Source pinned; no upstream changes"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Bun
        run: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Verify patch syntax and protected source pins
        run: |
          set -euo pipefail
          node --check scripts/fix-partner-driver-pdf-notes-20261112-v1.mjs
          node --check scripts/fix-partner-driver-video-map-rotation-20261112-v1.mjs
          node --check scripts/qa/test-partner-driver-video-map-rotation-20261112-v1.test.mjs
          node --check scripts/qa/test-partner-driver-pdf-notes-20261112-v1.test.mjs
          node --check scripts/apply-partner-motorista-premium-home-v1.mjs
          node --check scripts/qa/test-partner-motorista-premium-home-v1.test.mjs
          node --check scripts/apply-partner-courier-premium-home-v1.mjs
          node --check scripts/apply-partner-premium-all-screens-v1.mjs
          node --check scripts/fix-partner-courier-map-first-visual-v2.mjs
          node --check scripts/qa/test-partner-courier-map-first-visual-v2.test.mjs
          node --test scripts/qa/test-partner-courier-map-first-visual-v2.test.mjs
          node --check scripts/qa/verify-partner-premium-all-screens-v1.mjs
          node --check scripts/qa/test-partner-courier-premium-home-v1.test.mjs
          node --test scripts/qa/test-partner-courier-premium-home-v1.test.mjs
          node --test scripts/qa/test-partner-motorista-premium-home-v1.test.mjs
          npm run verify:pins
          npm run audit:partner
          npm run audit:ui
      - name: Web-only build and PDF regressions (NO APK)
        run: |
          set -euo pipefail
          # Build the exact shared Partner release web modules, without Gradle/APK.
          # Audits run above before any transformations.
          bash scripts/build-partner-release.sh
          node scripts/qa/verify-partner-premium-all-screens-v1.mjs
          grep -Fq 'data-apois-courier-map-first-v2' .work/partner-entregador/src/routes/courier.tsx || { echo "[FAIL] QA291 post-build gate 1: generated source or bundle check missing"; exit 1; }
          grep -Fq 'data-apois-courier-map-canvas-v2' .work/partner-entregador/src/components/CourierRouteMap.tsx || { echo "[FAIL] QA291 post-build gate 2: generated source or bundle check missing"; exit 1; }
          grep -Fq 'data-apois-courier-premium-status-v2' .work/partner-entregador/src/components/CourierPremiumViews.tsx || { echo "[FAIL] QA291 post-build gate 3: generated source or bundle check missing"; exit 1; }
          grep -Fq 'data-apois-courier-gps-status-v2' .work/partner-entregador/src/components/CourierLocationTracker.tsx || { echo "[FAIL] QA291 post-build gate 4: generated source or bundle check missing"; exit 1; }
          grep -Fq 'data-apois-qa290-compact-offer="true"' .work/partner-motorista/src/routes/motorista.app.tsx || { echo "[FAIL] QA291 post-build gate 5: generated source or bundle check missing"; exit 1; }
          grep -Fq 'data-apois-premium-driver-header' .work/partner-motorista/src/routes/motorista.app.tsx || { echo "[FAIL] QA291 post-build gate 6: generated source or bundle check missing"; exit 1; }
          grep -Fq 'data-apois-premium-driver-summary' .work/partner-motorista/src/routes/motorista.app.tsx || { echo "[FAIL] QA291 post-build gate 7: generated source or bundle check missing"; exit 1; }
          grep -Fq 'data-apois-premium-driver-nav' .work/partner-motorista/src/routes/motorista.app.tsx || { echo "[FAIL] QA291 post-build gate 8: generated source or bundle check missing"; exit 1; }
          grep -Fq 'data-apois-premium-courier-summary' .work/partner-entregador/src/routes/courier.tsx || { echo "[FAIL] QA291 post-build gate 9: generated source or bundle check missing"; exit 1; }
          grep -Fq 'data-apois-premium-availability' .work/partner-entregador/src/routes/courier.tsx || { echo "[FAIL] QA291 post-build gate 10: generated source or bundle check missing"; exit 1; }
          grep -Fq 'aria-checked={online}' .work/partner-motorista/src/routes/motorista.app.tsx || { echo "[FAIL] QA291 post-build gate 11: generated source or bundle check missing"; exit 1; }
          grep -Fq 'data-apois-trip-one-metrics-v1' .work/partner-motorista/src/routes/motorista.app.tsx || { echo "[FAIL] QA291 post-build gate 12: generated source or bundle check missing"; exit 1; }
          grep -Fq 'APOIS_DRIVER_VIDEO_20261112_ROTATION_V1' .work/partner-motorista/src/components/MovviMap.tsx || { echo "[FAIL] QA291 post-build gate 13: generated source or bundle check missing"; exit 1; }
          grep -Fq 'driverCameraHistory.delete(map)' .work/partner-motorista/src/routes/motorista.app.tsx || { echo "[FAIL] QA291 post-build gate 14: generated source or bundle check missing"; exit 1; }
          test -s superapp/partner-shell/dist/modules/motorista/index.html || { echo "[FAIL] QA291 post-build gate 15: generated source or bundle check missing"; exit 1; }
          test -s superapp/partner-shell/dist/modules/entregador/index.html || { echo "[FAIL] QA291 post-build gate 16: generated source or bundle check missing"; exit 1; }
          grep -Fq -- '--red:#F51D2A' superapp/partner-shell/dist/index.html || { echo "[FAIL] QA291 post-build gate 17: generated source or bundle check missing"; exit 1; }
          grep -Fq -- '--red-dark:#BB071D' superapp/partner-shell/dist/index.html || { echo "[FAIL] QA291 post-build gate 18: generated source or bundle check missing"; exit 1; }
          grep -Fq 'VAMOS JUNTOS.' superapp/partner-shell/dist/index.html || { echo "[FAIL] QA291 post-build gate 19: generated source or bundle check missing"; exit 1; }
          if find . -type f -name '*.apk' -print -quit | grep -q .; then
            echo "::error::Proibido criar APK nesta homologação"
            exit 1
          fi
          echo "[OK] JS/CSS, fluxos motoristas e integração web compilados, sem APK"

      - name: Show limited generated Courier code around typecheck errors
        if: ${{ failure() }}
        run: |
          if [ -f .work/partner-entregador/src/routes/courier.tsx ]; then
            echo '--- Courier generated JSX around the final home (safe code excerpt) ---'
            nl -ba .work/partner-entregador/src/routes/courier.tsx | sed -n '1480,1545p'
            grep -nF 'APOIS_COURIER_PREMIUM_HOME_V1' .work/partner-entregador/src/routes/courier.tsx || true
          fi

      - name: Prepare isolated Chromium screenshot QA
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/apois-browser-qa" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.62.1
          "$RUNNER_TEMP/apois-browser-qa/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify anonymous selector and both login screens, no backend
        env:
          APOIS_PLAYWRIGHT_ROOT: ${{ runner.temp }}/apois-browser-qa
        run: |
          set -euo pipefail
          node scripts/audit-browser-public-v1.mjs parceiro

      - name: Preserve visual QA captures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: apois-premium-parceiro-web-captures-${{ github.sha }}
          path: qa-browser/parceiro/
          if-no-files-found: warn
          retention-days: 7
