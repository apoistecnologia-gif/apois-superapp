name: APOIS GPS - infraestrutura piloto (sem deploy)
on:
  push:
    branches: [lab/apois-navegacao-ferrostar-etapa1]
    paths: ['labs/apois-navigation/field-host/**','labs/apois-navigation/field-dynamic/gateway.mjs','.github/workflows/apois-navigation-lab-field-host.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test labs/apois-navigation/field-host/gateway-expiry.test.mjs
      - name: Resolve candidate image digests and inspect platform support
        run: |
          set -euo pipefail
          docker pull node:24-alpine
          docker pull caddy:2-alpine
          echo "APOIS_NODE_IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' node:24-alpine)" >> "$GITHUB_ENV"
          echo "APOIS_CADDY_IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' caddy:2-alpine)" >> "$GITHUB_ENV"
          docker buildx imagetools inspect ghcr.io/valhalla/valhalla-scripted@sha256:0e559e57b19e293bcf62e10c64163f2fe60c42902a760152c9238307e13e7257
      - name: Validate Caddy config without publishing
        working-directory: labs/apois-navigation/field-host
        run: docker run --rm --network none -e APOIS_FIELD_HOST=navigation-lab.apoisbrasil.com.br -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" "$APOIS_CADDY_IMAGE" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate compose config only
        working-directory: labs/apois-navigation/field-host
        env:
          APOIS_GRAPH_DIR: /tmp/apois-graph-test
          APOIS_UID: '1000'
          APOIS_GID: '1000'
          APOIS_SECRET_FILE: /tmp/apois-secret-test
          APOIS_EXPIRES_AT: '1000'
          APOIS_FIELD_HOST: field.invalid
        run: docker compose config --quiet
