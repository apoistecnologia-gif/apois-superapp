name: APOIS Navegacao - dados piloto Itainopolis Picos
on:
  push:
    branches: [lab/apois-navegacao-ferrostar-etapa1]
    paths: ['labs/apois-navigation/field-pilot/**','.github/workflows/apois-navigation-lab-field-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y osmium-tool
          python -m pip install --disable-pip-version-check pmtiles==3.8.1 mapbox-vector-tile==2.2.0
          bash -n labs/apois-navigation/field-pilot/build.sh
      - run: bash labs/apois-navigation/field-pilot/build.sh "$RUNNER_TEMP/apois-field-pilot"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apois-field-pilot-data
          path: ${{ runner.temp }}/apois-field-pilot/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apois-field-pilot-diagnostics
          path: |
            ${{ runner.temp }}/apois-field-pilot/*-report.json
            ${{ runner.temp }}/apois-field-pilot/source*.txt
            ${{ runner.temp }}/apois-field-pilot/valhalla.log
          retention-days: 7
          if-no-files-found: warn
