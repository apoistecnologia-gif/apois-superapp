name: APOIS Corridas Admin - Publicar Preview WEB Isolado
on:
  workflow_dispatch:
  push:
    branches:
      - fix/entregas-homologacao-ajustes-20261030
    paths:
      - .github/workflows/apois-admin-corridas-preview.yml

permissions:
  contents: write

jobs:
  publish-admin-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BUN_VERSION: "1.3.14"
      APOIS_REPO_TOKEN: ${{ secrets.APOIS_REPO_TOKEN }}
      CORRIDAS_VITE_SUPABASE_URL: ${{ secrets.CORRIDAS_VITE_SUPABASE_URL }}
      CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY }}
      CORRIDAS_WEB_MAPS_API_KEY: ${{ secrets.CORRIDAS_WEB_MAPS_API_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout QA branch (original repos untouched)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: true
      - name: Load protected pinned sources
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APOIS_REPO_TOKEN:-}"
          git config --global url."https://x-access-token:${APOIS_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive
          npm run verify:pins
          git config --global --unset-all url."https://x-access-token:${APOIS_REPO_TOKEN}@github.com/".insteadOf || true
      - name: Install pinned Bun
        run: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.bun/bin:$PATH"
          test "$(bun --version)" = "$BUN_VERSION"
      - name: Build and audit WEB only - no APK / no production changes
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          npm run build:partner
          test -s .work/partner-motorista/dist/client/index.html
          grep -R -Fq 'APOIS_ADMIN_PENDING_CORRECTIONS_V1' .work/partner-motorista/src/routes/admin.motoristas.tsx
          grep -R -Fq 'ApoisDriverCorrections' .work/partner-motorista/src/routes/motorista.documentos.tsx
          grep -R -Fq 'Visualizar foto internamente' .work/partner-motorista/src/routes/admin.motoristas.tsx
          test -d .work/partner-motorista/dist/client/assets
          if grep -REqi 'sb_secret_|RESEND_API_KEY=|SUPABASE_SERVICE_ROLE_KEY=|x-access-token:' .work/partner-motorista/dist/client; then
            echo "::error::Potential secret pattern in client preview bundle"; exit 1
          fi
          echo "[OK] Preview Admin compiled with 13-photo inspection, corrections and internal viewer"
      - name: Checkout dedicated static preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/apois-corridas-admin-20261031
          path: .preview-release
          fetch-depth: 1
          submodules: false
          persist-credentials: true
      - name: Publish static preview branch (never production)
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="$GITHUB_WORKSPACE/.preview-release"
          test -d "$RELEASE/.git"
          find "$RELEASE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude '*.map' .work/partner-motorista/dist/client/ "$RELEASE/"
          cat > "$RELEASE/vercel.json" <<'EOF'
          {"version":2,"routes":[{"handle":"filesystem"},{"src":"/(.*)","dest":"/index.html"}]}
          EOF
          cat > "$RELEASE/README.md" <<'EOF'
          APOIS Corridas - Admin/Motorista preview WEB only.
          Generated exclusively from the QA branch with protected pinned sources.
          NOT the production site. No Android APK or Supabase migration.
          EOF
          test -s "$RELEASE/index.html"
          test -d "$RELEASE/assets"
          git -C "$RELEASE" config user.name "APOIS QA"
          git -C "$RELEASE" config user.email "apois-qa@users.noreply.github.com"
          git -C "$RELEASE" add -A
          if ! git -C "$RELEASE" diff --cached --quiet; then
            git -C "$RELEASE" commit -m "build(preview): Admin Corridas QA ${GITHUB_SHA:0:12}"
            git -C "$RELEASE" push origin HEAD:refs/heads/preview/apois-corridas-admin-20261031
          fi
          echo "[OK] Preview-only static branch updated; production domain and repo source untouched"
