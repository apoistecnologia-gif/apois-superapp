name: APOIS Navegacao - variante externa API 24 (sem APK)
on:
  push:
    branches: [lab/apois-navegacao-ferrostar-etapa1]
    paths: ['labs/apois-navigation/api24/**', '.github/workflows/apois-navigation-lab-api24.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: apoistecnologia-gif/movvi-go-connect
          ref: 9fc171050d8b5703540c49d19a8f1e9f5162775f
          path: .navigation-driver-source
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Android API 36
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Verificar fallback externo sem bridge nativa
        run: node --test labs/apois-navigation/host-compat/confirmed-navigation-launch.test.mjs
      - name: Gerar variante externa descartavel sem Ferrostar
        run: |
          set -euo pipefail
          H="$RUNNER_TEMP/apois-external-api24"
          mkdir -p "$H/www"
          cd "$H"
          npm init -y >/dev/null
          npm install --save-exact --no-audit --no-fund @capacitor/core@8.5.0 @capacitor/cli@8.5.0 @capacitor/android@8.5.0
          printf '<!doctype html><html lang="pt-BR"><title>API 24 compile fixture</title></html>' > www/index.html
          printf '{"appId":"br.com.apois.navigation.external.lab","appName":"APOIS external API24 lab","webDir":"www"}' > capacitor.config.json
          npx cap add android
          node "$GITHUB_WORKSPACE/labs/apois-navigation/api24/prepare.mjs" "$H" "$GITHUB_WORKSPACE/.navigation-driver-source" "$GITHUB_WORKSPACE"
      - name: Compilar Java e validar manifesto API 24 sem APK
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/apois-external-api24/android"
          tasks=(:app:checkDebugAarMetadata :app:processDebugMainManifest :app:compileDebugJavaWithJavac)
          log="$RUNNER_TEMP/apois-api24-compile.log"
          if ! gradle "${tasks[@]}" --no-daemon --stacktrace 2>&1 | tee "$log"; then
            if grep -Eq 'Received status code (403|429|502|503|504) from server|Read timed out|Connection reset' "$log"; then
              if grep -q "Received status code 429" "$log"; then sleep 30; fi
              gradle "${tasks[@]}" --no-daemon --stacktrace 2>&1 | tee -a "$log"
            else
              exit 1
            fi
          fi
          gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon > "$RUNNER_TEMP/apois-api24-dependencies.log"
          if grep -Ei 'ferrostar|maplibre|navigation-probe|FAILED' "$RUNNER_TEMP/apois-api24-dependencies.log"; then exit 1; fi
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          ns='{http://schemas.android.com/apk/res/android}'
          manifests=list(pathlib.Path('app/build/intermediates/merged_manifest').rglob('AndroidManifest.xml'))
          assert manifests, 'merged manifest missing'
          for path in manifests:
              root=ET.parse(path).getroot()
              assert root.find('uses-sdk').get(ns+'minSdkVersion')=='24', path
              xml=path.read_text().lower()
              assert not any(v in xml for v in ('overridelibrary','ferrostar','maplibre','confirmedlivenavigation','labnavigationactivity')), path
          print('[OK] merged manifest minSdk=24; no navigation SDK/Activity or override')
          PY
          test -z "$(find . -name '*.apk' -o -name '*.aab' | head -n 1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apois-api24-compile-report
          path: |
            ${{ runner.temp }}/apois-api24-compile.log
            ${{ runner.temp }}/apois-api24-dependencies.log
          retention-days: 7
