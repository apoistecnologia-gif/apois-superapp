name: APOIS Navegacao - provenance snapshot (no deploy)
on:
  push:
    branches: [lab/apois-navegacao-ferrostar-etapa1]
    paths: ['labs/apois-navigation/passenger-provenance-snapshot/**','.github/workflows/apois-navigation-lab-provenance-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Conferir copia exata do Passageiro e testar contratos
        working-directory: labs/apois-navigation/passenger-provenance-snapshot
        run: |
          set -euo pipefail
          node verify.mjs
          node --test driver-authority.test.mjs supabase-session.test.mjs revocation-reconciler.test.mjs
          node --test experimental/apois-navigation/client.test.mjs
          python3 -m unittest discover -s experimental/apois-navigation -p 'test_import_catalog.py' -v
      - name: PostgreSQL descartavel sem rede
        working-directory: labs/apois-navigation/passenger-provenance-snapshot
        run: |
          set -euo pipefail
          docker run -d --name apois-provenance-fixture --network none -e POSTGRES_PASSWORD=synthetic_ci_only -e POSTGRES_DB=apois_navigation_fixture postgres:17
          ready=0
          for n in $(seq 1 60); do
            if docker exec apois-provenance-fixture pg_isready -h 127.0.0.1 -U postgres -d apois_navigation_fixture; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          for file in fixture.sql schema.sql test.sql; do
            docker exec -i apois-provenance-fixture psql -U postgres -d apois_navigation_fixture -v ON_ERROR_STOP=1 < "experimental/apois-navigation/$file"
          done
      - name: Integrar consulta SQL ao emissor criptografico
        working-directory: labs/apois-navigation/passenger-provenance-snapshot
        run: |
          set -euo pipefail
          docker exec -i apois-provenance-fixture psql -X -U postgres -d apois_navigation_fixture -v ON_ERROR_STOP=1 < revocation-fixture.sql
          node sql-issuer-integration.mjs
      - name: Encerrar fixture
        if: always()
        run: |
          docker logs apois-provenance-fixture || true
          docker rm -f apois-provenance-fixture || true
