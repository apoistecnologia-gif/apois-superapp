name: APOIS navigation lab - driver broker
on:
  push:
    branches: [lab/apois-navegacao-ferrostar-etapa1]
    paths: ['labs/apois-navigation/driver-broker/**','.github/workflows/apois-navigation-lab-driver-broker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  broker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test labs/apois-navigation/driver-broker/driver-broker.test.mjs
