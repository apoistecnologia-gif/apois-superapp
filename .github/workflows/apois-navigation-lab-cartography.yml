name: APOIS Navegacao - cartografia regional (sem APK)
on:
  push:
    branches: [lab/apois-navegacao-ferrostar-etapa1]
    paths: ['labs/apois-navigation/cartography/**', '.github/workflows/apois-navigation-lab-cartography.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apois-navigation-cartography
  cancel-in-progress: true
jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Instalar extrator OSM
        run: sudo apt-get update -qq && sudo apt-get install -y osmium-tool time nginx-light
      - name: Mes do cache regional
        id: cache-month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: labs/apois-navigation/valhalla/.regional-cache
          key: apois-valhalla-petrolina-juazeiro-bbox-v1-${{ steps.cache-month.outputs.month }}
      - name: Gerar PMTiles regional e verificar metadados
        run: |
          bash -n labs/apois-navigation/cartography/build-region.sh
          bash labs/apois-navigation/cartography/build-region.sh "$RUNNER_TEMP/apois-cartography-report"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decodificar tiles e validar cobertura regional
        run: |
          python -m pip install --disable-pip-version-check pmtiles==3.8.1 mapbox-vector-tile==2.2.0
          python labs/apois-navigation/cartography/verify_content.py "$RUNNER_TEMP/apois-cartography-report/vale.pmtiles" "$RUNNER_TEMP/apois-cartography-report" | tee "$RUNNER_TEMP/apois-cartography-report/content-report.json"
      - name: Preparar glifos licenciados e cobertura pt-BR
        run: bash labs/apois-navigation/cartography/prepare-glyphs.sh "$RUNNER_TEMP/apois-cartography-report"
      - name: Preparar pacote local verificavel para Android
        run: python labs/apois-navigation/cartography/build_asset_pack.py "$RUNNER_TEMP/apois-cartography-report" | tee "$RUNNER_TEMP/apois-cartography-report/asset-pack-report.json"
      - name: Verificar leitura parcial HTTP local
        run: bash labs/apois-navigation/cartography/test-http-range.sh "$RUNNER_TEMP/apois-cartography-report"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android API 36 para teste de merge de assets
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Verificar pacote no merge Android sem APK
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/labs/apois-navigation/android/probe"
          O="$RUNNER_TEMP/apois-cartography-report"
          test ! -e "$P/src/main/assets/apois-regional"
          mkdir -p "$P/src/main/assets"
          cp -a "$O/android-assets/apois-regional" "$P/src/main/assets/"
          gradle -p labs/apois-navigation/android :probe:mergeDebugAssets --no-daemon --stacktrace
          python labs/apois-navigation/cartography/verify_merged_assets.py "$O/android-assets/apois-regional" "$P/build/intermediates/assets" | tee "$O/merged-assets-report.json"
          test -z "$(find "$P" -name '*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apois-cartography-regional
          path: ${{ runner.temp }}/apois-cartography-report/
          retention-days: 7
