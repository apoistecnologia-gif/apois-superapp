name: APOIS GPS - Vale pacote instalado no Android
on:
  push:
    branches: [lab/apois-navegacao-ferrostar-etapa1]
    paths: ['labs/apois-navigation/launch-vale/InstalledValePackTest.kt','labs/apois-navigation/launch-vale/pack-android-build.sh','.github/workflows/apois-navigation-lab-launch-vale-pack-android.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  embedded:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          name: apois-vale-inactive-data-pack
          run-id: 45748961675
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apois-vale-pack
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Android SDK and emulator
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" >/dev/null
      - name: Compile engine and Ferrostar, inspect APK permissions and ABI
        env:
          APOIS_PIAUI_GRAPH_DIR: ${{ runner.temp }}/apois-piaui-graph
        run: bash labs/apois-navigation/launch-vale/pack-android-build.sh
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute Vale routes offline and parse for Ferrostar
        run: bash labs/apois-navigation/embedded-probe/emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apois-vale-installed-pack-report
          path: ${{ runner.temp }}/apois-embedded-report/
          retention-days: 7
          if-no-files-found: warn
