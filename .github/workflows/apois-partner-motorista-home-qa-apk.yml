name: APOIS Parceiro - APK TESTE Home Motorista
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apois-partner-motorista-home-qa-apk.yml

permissions:
  contents: read

concurrency:
  group: partner-home-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-partner-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      BUN_VERSION: "1.3.14"
      APOIS_REPO_TOKEN: ${{ secrets.APOIS_REPO_TOKEN }}
      CORRIDAS_VITE_SUPABASE_URL: ${{ secrets.CORRIDAS_VITE_SUPABASE_URL }}
      CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY }}
      CORRIDAS_WEB_MAPS_API_KEY: ${{ secrets.CORRIDAS_WEB_MAPS_API_KEY }}
      CORRIDAS_ANDROID_MAPS_API_KEY: ${{ secrets.CORRIDAS_ANDROID_MAPS_API_KEY }}
      ENTREGAS_WEB_MAPS_API_KEY: ${{ secrets.ENTREGAS_WEB_MAPS_API_KEY }}
      ENTREGAS_GOOGLE_MAPS_MAP_ID: ${{ vars.ENTREGAS_GOOGLE_MAPS_MAP_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      FIREBASE_PARTNER_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_PARTNER_GOOGLE_SERVICES_JSON_BASE64 }}
      PARTNER_FIREBASE_PROJECT_ID: "movvi-4d041"
      PARTNER_APP_PACKAGE: "br.com.apois.parceiro"
      PARTNER_APP_LABEL: "APOIS Parceiro"
      QA_DEBUG_KEYSTORE_BASE64: ${{ secrets.APOIS_CLIENT_QA_DEBUG_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Verificar configuracao sem revelar segredos
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in APOIS_REPO_TOKEN CORRIDAS_VITE_SUPABASE_URL CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY CORRIDAS_WEB_MAPS_API_KEY CORRIDAS_ANDROID_MAPS_API_KEY VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY FIREBASE_PARTNER_GOOGLE_SERVICES_JSON_BASE64; do
            if [ -z "$(printenv "$key")" ]; then
              echo "::error::Variavel obrigatoria ausente: $key"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo '[OK] Configuracao completa para APK Parceiro.'

      - name: Checkout fontes protegidas e pins
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:$APOIS_REPO_TOKEN@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive
          npm run verify:pins

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SDK_ROOT"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Instalar Bun
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash -s "bun-v$BUN_VERSION"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.bun/bin:$PATH"
          test "$(bun --version)" = "$BUN_VERSION"

      - name: Configurar versao de teste
        shell: bash
        run: |
          echo "PARTNER_VERSION_CODE=$((9000+GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "PARTNER_VERSION_NAME=1.0.11-qa.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Compilar Parceiro Motorista e Entregador
        shell: bash
        run: |
          set -euo pipefail
          npm run build:partner
          grep -Fq 'APOIS_DRIVER_HOME_PREMIUM_V1' .work/partner-motorista/src/routes/motorista.app.tsx
          grep -Fq 'themeOverride={!active ? "client" : "dark"}' .work/partner-motorista/src/routes/motorista.app.tsx
          grep -Fq 'Preferências do passageiro' .work/partner-motorista/src/routes/motorista.app.tsx
          test -s superapp/partner-shell/dist/modules/motorista/index.html
          test -s superapp/partner-shell/dist/modules/entregador/index.html
          echo '[OK] Bundle completo com nova Home.'

      - name: Criar Android nativo Parceiro
        shell: bash
        run: |
          set -euo pipefail
          cd superapp/partner-shell
          bun install
          rm -rf android
          bunx cap add android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          bunx cap sync android
          cd ../..
          node scripts/configure-partner-android.mjs
          node scripts/install-partner-launcher.mjs
          node scripts/install-partner-splash.mjs
          test -s superapp/partner-shell/android/app/google-services.json
          grep -Fq "versionCode $PARTNER_VERSION_CODE" superapp/partner-shell/android/app/build.gradle
          grep -Fq "versionName \"$PARTNER_VERSION_NAME\"" superapp/partner-shell/android/app/build.gradle

      - name: Restaurar identidade de assinatura QA se disponivel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "$QA_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$QA_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android >/dev/null
            echo '[OK] Certificado QA existente restaurado.'
          else
            echo '[WARN] Certificado QA nao configurado. APK usara assinatura debug temporaria, sem garantia de instalar sobre o app atual.'
          fi

      - name: Compilar e verificar APK assinado para teste
        shell: bash
        run: |
          set -euo pipefail
          cd superapp/partner-shell/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ../../..
          APK="superapp/partner-shell/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt -perm -111 | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -F "name='br.com.apois.parceiro'"
          "$AAPT" dump badging "$APK" | grep -F "versionCode='$PARTNER_VERSION_CODE'"
          "$APKSIGNER" verify --print-certs "$APK" | grep 'Signer #1 certificate SHA-1 digest:' | head -n 1
          mkdir -p build
          cp "$APK" build/APOIS-Parceiro-Motorista-Home-TESTE.apk
          echo '[OK] APK pronto para homologacao.'

      - uses: actions/upload-artifact@v4
        with:
          name: APOIS-Parceiro-Motorista-Home-TESTE
          path: build/APOIS-Parceiro-Motorista-Home-TESTE.apk
          if-no-files-found: error
          retention-days: 14
