name: APOIS Cliente Android APK
# QA Android: corrigir registro do geocodificador no MainActivity já protegido contra overscroll (12/11/2026).
# QA218: known authorized web-only audit workflows are explicitly allowlisted; no release or deploy.
# Build de homologacao Android solicitado em 12/11/2026: executar APK Cliente no repositorio oficial publico.
# homologação 1.0.3: persistência de nomes das paradas e build Android final — retry hardening 26/10
# diagnóstico de cobertura da loja fictícia — 30/10/2026
# valida execução do patch no builder Android — 30/10/2026
# QA 31/10: PIN após retirada, validação de marcador no workspace e assinatura QA imutável
# Audit 07/11: validate V10-V13 plus loading release after invalid/cleared CEP cancellation.
# QA 10/11: validate pinned component footer safe-area and customer APK build.
# QA215: homologation Android for reverse geocode retry cooldown and completed CTA native safe-area.

on:
  workflow_dispatch:
  push:
    branches:
      - audit/ecossistema-20261107
      - audit/continuacao-20261107
      - build/qa218-android-homologacao-20261112
      - fix/apois-cliente-qa237-botao-push-20261113
      - fix/apois-cliente-qa238-mapa-livre-20261113
      - fix/entregas-homologacao-ajustes-20261030
      - feat/apois-cliente-red-visual-20261003
      - fix/apois-android-github-homolog-20261029
      - test/apois-pix-simulado-isolado-20261029
    paths:
      - '.github/workflows/apois-client-android.yml'
      - 'scripts/fix-report08-passenger-redispatch-v1.mjs'
      - 'scripts/fix-corridas-client-qa237-request-recovery-v1.mjs'
      - 'scripts/qa/test-client-qa237-request-recovery-v1.test.mjs'
      - 'scripts/qa/test-client-qa238-map-home-regression.test.mjs'
      - 'scripts/fix-corridas-passenger-home-qa217-v1.mjs'
      - 'scripts/fix-corridas-passenger-optin-qa218-v1.mjs'
      - 'scripts/templates/PassengerDemandSharing.tsx'
      - 'scripts/qa/test-passenger-optin-zones-qa218.test.mjs'
      - 'scripts/qa/test-corridas-passenger-map-qa217-v1.test.mjs'
      - 'scripts/qa/test-report08-passenger-redispatch-v1.test.mjs'
      - 'scripts/qa/test-apois-account-deletion-visual09-v1.test.mjs'
      - 'scripts/build-isolated-module.mjs'
      - 'scripts/connect-corridas-passenger-driver-rating-v1.mjs'
      - 'scripts/qa/test-corridas-passenger-driver-rating-v1.test.mjs'
      - 'scripts/fix-corridas-passenger-qa215-pickup-address-v1.mjs'
      - 'scripts/qa/test-corridas-passenger-qa215-pickup-address-v1.test.mjs'
      - 'scripts/fix-corridas-passenger-qa215-completed-safe-area-v1.mjs'
      - 'scripts/qa/test-corridas-passenger-qa215-completed-safe-area-v1.test.mjs'
      - 'scripts/verify-corridas-trip-flow-ux.mjs'
      - 'scripts/harden-corridas-trip-flow-ux.mjs'
      - 'scripts/qa/test-corridas-ride-footer-layout-v1.test.mjs'
      - 'scripts/fix-corridas-client-qa169-video-v1.mjs'
      - 'scripts/qa/test-corridas-client-qa169-video-v1.test.mjs'
      - 'scripts/build-isolated-module.mjs'
      - 'scripts/fix-corridas-ride-gps-stability-v1.mjs'
      - 'scripts/qa/test-corridas-ride-gps-stability-v1.test.mjs'
      - 'scripts/fix-corridas-profile-viewport-v1.mjs'
      - 'scripts/harden-corridas-final-red-surfaces.mjs'
      - 'scripts/verify-corridas-profile-viewport-v1.mjs'
      - 'scripts/protect-apois-embedded-viewport-v1.mjs'
      - 'scripts/harden-apois-native-webview-scroll-v1.mjs'
      - 'scripts/qa/verify-apois-mobile-viewport-v1.mjs'
      - 'scripts/configure-superapp-android.mjs'
      - 'scripts/fix-corridas-generated-ts-gate-v1.mjs'
      - 'scripts/harden-corridas-backend-identity-boundary.mjs'
      - '.apois/modules.json'
      - 'scripts/verify-corridas-auth-regressions.mjs'
      - 'scripts/verify-corridas-dispatch-ux-v1.mjs'
      - 'scripts/harden-corridas-trip-flow-ux.mjs'
      - 'scripts/qa/test-entregas-viewport-v1.test.mjs'
      - 'scripts/harden-entregas-personal-data-light-v1.mjs'
      - 'scripts/fix-entregas-persisted-cart-validation-v3.mjs'
      - 'scripts/fix-entregas-product-customization-visual10-v1.mjs'
      - 'scripts/harden-entregas-overlay-layering.mjs'
      - 'scripts/harden-entregas-superapp-order-details.mjs'
      - 'scripts/stabilize-entregas-secondary-mobile-inputs.mjs'
      - 'scripts/verify-entregas-customer-light-v4.mjs'
      - 'scripts/verify-entregas-customer-current-visual-v5.mjs'
      - 'scripts/harden-entregas-superapp-secondary-mobile-ui.mjs'
      - 'scripts/harden-entregas-address-async-v11.mjs'
      - 'scripts/qa/test-entregas-address-async-v3.mjs'
      - 'superapp/shell/build.mjs'
      - 'scripts/harden-superapp-shell-mobile-ui.mjs'
      - 'scripts/qa/verify-client-home-viewport-v2.mjs'
      - 'scripts/qa/verify-client-corridas-loading-v1.mjs'
      - 'scripts/harden-entregas-customer-address-uf-v9.mjs'

permissions:
  contents: read

jobs:
  build-client-apk:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/fix/entregas-homologacao-ajustes-20261030' || github.ref == 'refs/heads/audit/ecossistema-20261107' || github.ref == 'refs/heads/audit/continuacao-20261107' || github.ref == 'refs/heads/build/qa218-android-homologacao-20261112' || github.ref == 'refs/heads/fix/apois-cliente-qa237-botao-push-20261113' || github.ref == 'refs/heads/fix/apois-cliente-qa238-mapa-livre-20261113'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUN_VERSION: "1.3.14"
      APP_PACKAGE: "br.com.apois.app"
      APP_LABEL: "APOIS Cliente"
      APP_VERSION_CODE: "12"
      APP_VERSION_NAME: "1.0.11"
      QA_DEBUG_KEYSTORE_BASE64: ${{ secrets.APOIS_CLIENT_QA_DEBUG_KEYSTORE_BASE64 }}
      QA_CERT_EXPECTED_SHA256: ${{ secrets.APOIS_CLIENT_QA_CERT_SHA256 }}
      APOIS_REPO_TOKEN: ${{ secrets.APOIS_REPO_TOKEN }}
      CORRIDAS_VITE_SUPABASE_URL: ${{ secrets.CORRIDAS_VITE_SUPABASE_URL }}
      CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY }}
      CORRIDAS_WEB_MAPS_API_KEY: ${{ secrets.CORRIDAS_WEB_MAPS_API_KEY }}
      CORRIDAS_ANDROID_MAPS_API_KEY: ${{ secrets.CORRIDAS_ANDROID_MAPS_API_KEY }}
      ENTREGAS_WEB_MAPS_API_KEY: ${{ secrets.ENTREGAS_WEB_MAPS_API_KEY }}
      ENTREGAS_GOOGLE_MAPS_MAP_ID: ${{ vars.ENTREGAS_GOOGLE_MAPS_MAP_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      FIREBASE_SUPERAPP_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_SUPERAPP_GOOGLE_SERVICES_JSON_BASE64 }}
      APOIS_SUPERAPP_RIDES_PUSH_ENABLED: "0"
      CORRIDAS_FIREBASE_PROJECT_ID: ${{ secrets.CORRIDAS_FIREBASE_PROJECT_ID }}
      CORRIDAS_PUBLIC_APP_URL: "https://tbbzkrfupmqdywnzgnms.supabase.co/functions/v1/public-ride-tracker"

    steps:
      - name: Checkout APOIS Superapp
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Validate required GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in APOIS_REPO_TOKEN CORRIDAS_VITE_SUPABASE_URL CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY CORRIDAS_WEB_MAPS_API_KEY CORRIDAS_ANDROID_MAPS_API_KEY VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY
          do
            if [ -z "${!key:-}" ]; then
              echo "::error::GitHub secret ausente: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          test "${CORRIDAS_WEB_MAPS_API_KEY: -6}" = "yRViDk" || { echo "::error::CORRIDAS_WEB_MAPS_API_KEY não corresponde à chave WebView homologada"; exit 1; }
          test "${CORRIDAS_ANDROID_MAPS_API_KEY: -6}" = "av01xU" || { echo "::error::CORRIDAS_ANDROID_MAPS_API_KEY não corresponde à chave Android homologada"; exit 1; }
          echo "[OK] Secrets mínimos presentes e chaves Maps conferidas pelos sufixos esperados"

      # Protect users and runner time: fail BEFORE costly builds when the
      # original QA identity is unavailable. An APK cannot be updated with
      # a new/random key, even if its Gradle compilation succeeds.
      # Chave QA criptografada antes de entrar no cache do Actions.
      # O token privado existente protege a chave, sem conceder novas permissões.
      - name: Restore encrypted QA signing from Actions cache
        id: qa_signing_restore
        uses: actions/cache/restore@v4
        with:
          path: .qa-signing/android-debug-keystore.enc
          key: apois-client-qa-encrypted-signing-v1

      - name: Require original Cliente QA signing BEFORE module compilation
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QA_DEBUG_KEYSTORE_BASE64:-}" ] && [ ! -s .qa-signing/android-debug-keystore.enc ]; then
            echo "::error::Original Client QA signing identity missing. Restore protected APOIS_CLIENT_QA_DEBUG_KEYSTORE_BASE64 or original encrypted cache before compiling."
            exit 1
          fi
          echo "[OK] Original QA keystore candidate available; pinned certificate still checked after restore"

      - name: Checkout protected APOIS sources
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${APOIS_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive
          test -d sources/apois-corridas-passageiro
          test -d sources/apois-entregas
          echo "[OK] Fontes protegidas carregadas"

      - name: Setup Node 24 for address runtime regression tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Android SDK on runner
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_SDK_ROOT:-}"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --list >/dev/null
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "[OK] Android SDK disponível"

      - name: Install pinned Bun
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.bun/bin:$PATH"
          test "$(bun --version)" = "$BUN_VERSION"
          java -version

      - name: Verify source pins
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          npm run verify:pins
          node scripts/test-apois-unified-maps.mjs
          node --check scripts/test-apois-maps-loader-callback.mjs
          node scripts/test-apois-maps-loader-callback.mjs
          node --check scripts/apois-maps-loader-callback.mjs
          grep -Fq 'patchMapsJavaScriptLoader(loaderBefore)' scripts/harden-corridas-native-map.mjs
          node --check scripts/harden-corridas-native-map.mjs
          node --check scripts/harden-corridas-pickup-map-focus.mjs
          grep -Fq 'pickupCameraCoordinate' scripts/harden-corridas-pickup-map-focus.mjs
          node --check scripts/harden-corridas-trip-flow-ux.mjs
          node --check scripts/qa/test-corridas-ride-footer-layout-v1.test.mjs
          node --check scripts/harden-client-live-ride-camera-v2.mjs
          node --check scripts/verify-client-live-ride-camera-v2.mjs
          grep -Fq 'harden-client-live-ride-camera-v2.mjs' scripts/build-isolated-module.mjs
          grep -Fq 'APOIS_PASSENGER_LIVE_FOCUS_V2' scripts/harden-corridas-pickup-map-focus.mjs
          node --check scripts/harden-corridas-pickup-map-focus.mjs
          node --check scripts/harden-corridas-pickup-timeout-v1.mjs
          node --check scripts/fix-corridas-native-geocoder-recovery-v1.mjs
          node --check scripts/install-apois-client-native-geocoder.mjs
          node --check scripts/qa/test-corridas-native-geocoder-v1.test.mjs
          grep -Fq 'relative flex h-full min-h-0' scripts/harden-corridas-trip-flow-ux.mjs
          grep -Fq 'APOIS_PICKUP_STABLE_V1' scripts/harden-corridas-trip-flow-ux.mjs
          node --check scripts/verify-corridas-trip-flow-ux.mjs
          node --check scripts/harden-corridas-save-favorites-in-search.mjs
          node --check scripts/harden-entregas-customer-current-visual-v5.mjs
          node --check scripts/harden-corridas-driver-accept-pin-visibility.mjs
          node --check scripts/verify-corridas-driver-accept-pin-visibility.mjs
          node --check scripts/harden-corridas-profile-edit.mjs
          grep -Fq "'scripts/harden-corridas-profile-actions.mjs'" scripts/build-isolated-module.mjs
          grep -Fq 'APOIS_ACTIVE_RIDE_DOMAIN_USER_V1' scripts/harden-corridas-driver-accept-pin-visibility.mjs
          node --check scripts/verify-corridas-profile-edit.mjs
          grep -Fq 'r.status in (' supabase/corridas-forward-migrations/20261023211500_passenger_pin_available_after_accept.sql
          grep -Fq 'get_passenger_ride_security_code' scripts/harden-corridas-driver-accept-pin-visibility.mjs

      - name: QA237 verify Corridas Firebase compatibility before enabling push
        shell: bash
        run: |
          set -euo pipefail
          # Do not copy FCM credentials into artifacts or print service-account JSON.
          if [ -z "${CORRIDAS_FIREBASE_PROJECT_ID:-}" ] || [ -z "${FIREBASE_SUPERAPP_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo '::warning::QA237: Push Corridas segue DESABILITADO. Configure CORRIDAS_FIREBASE_PROJECT_ID e a configuração Firebase do Cliente para a validação.'
          elif APOIS_SUPERAPP_RIDES_PUSH_ENABLED=1 node scripts/validate-rides-push-firebase.mjs; then
            echo 'APOIS_SUPERAPP_RIDES_PUSH_ENABLED=1' >> "$GITHUB_ENV"
            echo '[OK] QA237: Push Corridas habilitado somente após correspondência Firebase mobile/backend.'
          else
            echo '::warning::QA237: Firebase mobile/backend incompatíveis; Push Corridas fica DESABILITADO por segurança.'
          fi

      - name: Build Corridas + Entregas + shell Cliente
        shell: bash
        env:
          # APK de teste é assinado com o debug keystore do runner. A chave Android
          # está restrita ao certificado de release; por isso forçamos o fallback
          # Maps JavaScript no APK de homologação para não produzir mapa branco.
          CORRIDAS_ANDROID_MAPS_API_KEY: ""
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          npm run build:corridas
          node scripts/verify-corridas-trip-flow-ux.mjs
          node scripts/verify-corridas-dispatch-ux-v1.mjs
          node scripts/harden-corridas-pickup-map-focus.mjs
          # QA215: the legacy trip UX transform already ran inside build:corridas;
          # reapplying it here would overwrite the tested pickup backoff.
          node scripts/verify-corridas-trip-flow-ux.mjs
          echo '[OK] Passageiro: UX idempotente, mapa pin visivel, cancelamento confirmado e dados limpos'
          grep -Fq 'APOIS_WEBVIEW_REFERRER_COMPAT_V1' .work/corridas/src/services/google/google-maps-loader.ts
          grep -Fq 'APOIS_MAPS_CALLBACK_READY_V1' .work/corridas/src/services/google/google-maps-loader.ts
          grep -Fq 'callback: APOIS_MAPS_READY_CALLBACK' .work/corridas/src/services/google/google-maps-loader.ts
          ! grep -Fq 'finish(new Error("maps_api_unavailable"))' .work/corridas/src/services/google/google-maps-loader.ts
          ! grep -Fq 'auth_referrer_policy: "origin"' .work/corridas/src/services/google/google-maps-loader.ts
          grep -Fq 'APOIS_MAP_ERROR_DIAGNOSTIC_V1' .work/corridas/src/components/map/PassengerMap.tsx
          grep -Fq 'Diagnóstico do mapa:' .work/corridas/src/components/map/PassengerMap.tsx
          grep -Fq 'top-[17%] z-[150]' .work/corridas/src/components/map/PassengerMap.tsx
          grep -Fq 'pointer-events-auto w-full max-w-[360px]' .work/corridas/src/components/map/PassengerMap.tsx
          echo '[OK] Google Maps WebView referrer, relatorio de falha, quebras de linha e JSX validados'
          node --check scripts/harden-entregas-auto-address-cep-v1.mjs
          node --check scripts/verify-entregas-auto-address-cep-v1.mjs
          node --check scripts/harden-entregas-personal-data-light-v1.mjs
          node --check scripts/harden-entregas-superapp-account-deletion.mjs
          node --check scripts/harden-entregas-superapp-profile-navigation.mjs
          node --check scripts/harden-entregas-auto-delivery-address.mjs
          node --check scripts/fix-entregas-customer-delivery-tracking-v1.mjs
          npm run build:entregas
          # QA V8: a tela de enderecos realmente compilada deve manter GPS/CEP, CTA legivel e rolagem segura.
          node scripts/verify-entregas-customer-address-visual-v8.mjs
          node --check scripts/harden-entregas-customer-address-uf-v9.mjs
          grep -Fq "APOIS_ENTREGAS_UF_FORM_V9" .work/entregas/src/lib/brazil-uf.ts
          grep -Fq "state: normalizeBrazilUF(formData.state)" .work/entregas/src/routes/enderecos/novo.tsx
          grep -Fq "APOIS_ENTREGAS_CUSTOMER_ADDRESS_VISUAL_V8" .work/entregas/src/system-theme.css
          grep -Fq "data-apois-address-create-v8" .work/entregas/src/routes/enderecos/novo.tsx
          grep -Fq 'APOIS_CUSTOMER_ORDER_REFRESH_V1' '.work/entregas/src/routes/pedido/$orderId/index.tsx'
          grep -Fq 'Entrega concluída!' '.work/entregas/src/routes/pedido/$orderId/index.tsx'
          grep -Fq 'APOIS_CUSTOMER_COURIER_POLL_V1' .work/entregas/src/components/CustomerDeliveryMap.tsx
          # A vitrine Cliente já não pode exibir os diagnósticos antigos "TESTE APOIS".
          if grep -Fq 'TESTE APOIS - razão:' .work/entregas/src/routes/checkout.tsx; then
            echo "::error::Diagnóstico de homologação vazou para o checkout do Cliente"
            exit 1
          fi
          grep -Fq 'isCustomerHomologationMerchant' .work/entregas/src/routes/checkout.tsx
          grep -Fq 'isCustomerHomologationAddress' .work/entregas/src/routes/checkout.tsx
          grep -Fq 'data-apois-entregas-real-address-v1' .work/entregas/src/routes/buscar.tsx
          echo '[OK] Dados de homologação ocultos no Cliente, seleção real de endereço e checkout preservados'
          grep -Fq 'APOIS_ENTREGAS_PERSONAL_DATA_LIGHT_V1' .work/entregas/src/routes/perfil/dados-pessoais.tsx
          grep -Fq '[&_.profile-input]:bg-white' .work/entregas/src/routes/perfil/dados-pessoais.tsx
          test -s .work/entregas/src/system-theme.css
          grep -Fq 'APOIS_ENTREGAS_CUSTOMER_LIGHT_V4' .work/entregas/src/system-theme.css
          grep -Fq 'APOIS_ENTREGAS_CUSTOMER_VISUAL_V5' .work/entregas/src/system-theme.css
          grep -Fq 'APOIS_ENTREGAS_CUSTOMER_VISUAL_V6' .work/entregas/src/system-theme.css
          grep -Fq 'APOIS_ENTREGAS_CUSTOMER_CONTRAST_V7' .work/entregas/src/system-theme.css
          grep -Fq 'apois-entregas-customer-light-v4' .work/entregas/src/routes/__root.tsx
          grep -Fq 'data-apois-entregas-home-v5' .work/entregas/src/routes/inicio.tsx
          grep -Fq 'data-apois-entregas-customer-nav-v5' .work/entregas/src/components/AppBottomNav.tsx
          echo '[OK] Cliente Entregas: identidade clara atual, cartoes, home e rodape validados'
          npm run build:shell
          node scripts/qa/verify-client-home-viewport-v2.mjs superapp/shell/dist/index.html
          node scripts/qa/verify-apois-mobile-viewport-v1.mjs cliente
          node scripts/qa/verify-client-corridas-loading-v1.mjs superapp/shell/dist/modules/corridas/index.html
          npm run harden:auth-deeplinks
          npm run inject:push-routing
          test -s superapp/shell/dist/modules/corridas/index.html
          test -s superapp/shell/dist/modules/entregas/index.html
          grep -Fq 'APOIS_NATIVE_MAP_FALLBACK_V3' .work/corridas/src/components/map/PassengerMap.tsx
          grep -Fq 'VITE_GOOGLE_MAPS_NATIVE_API_KEY' .work/corridas/src/components/map/PassengerMap.tsx
          echo "[OK] Cliente compilado com mapa nativo Corridas habilitado"

      - name: Diagnose generated Corridas TypeScript on failed build
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          root=".work/corridas/src"
          print_range() {
            local path="$1" start="$2" end="$3"
            local target="$root/$path"
            test -f "$target" || { echo "[DIAG] Missing $path"; return; }
            echo "::group::[DIAG] $path L$start-$end"
            sed -n "${start},${end}{=;p;}" "$target" | paste -d' ' - -
            echo "::endgroup::"
          }
          # Only application snippets near compiler diagnostics: never dump .env or keys.
          print_range components/pricing/CategorySelector.tsx 1 58
          print_range components/profile/PassengerAccountDeletion.tsx 72 92
          print_range lib/useApoisDeletionDialogFocus.ts 54 83
          print_range 'routes/_authenticated.corrida.$rideId.tsx' 243 263
          print_range 'routes/_authenticated.corrida.$rideId.tsx' 321 344
          print_range routes/_authenticated.corridas.tsx 128 150
          print_range routes/_authenticated.inicio.tsx 45 61
          print_range routes/_authenticated.ocorrencias.tsx 1 28
          print_range services/geocoding/geocoding-service.ts 158 175
          print_range services/payments/payment-service.ts 1 86
          print_range services/rides/active-ride-service.ts 15 50
          print_range services/rides/active-ride-service.ts 170 184

      - name: Create Android project
        if: ${{ !contains(github.event.head_commit.message, '[qa-only]') }}
        shell: bash
        env:
          CORRIDAS_ANDROID_MAPS_API_KEY: ""
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          cd superapp/shell
          bun install
          rm -rf android
          bunx cap add android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          bunx cap sync android
          cd ../..
          node scripts/configure-superapp-android.mjs
          node scripts/install-apois-client-native-geocoder.mjs
          test -s superapp/shell/android/app/src/main/java/br/com/apois/app/APOISNativeGeocoderPlugin.java
          grep -Fq 'registerPlugin(APOISNativeGeocoderPlugin.class)' superapp/shell/android/app/src/main/java/br/com/apois/app/MainActivity.java
          grep -Fq 'APOIS_NATIVE_GEOCODER_RECOVERY_V1' .work/corridas/src/hooks/use-pickup-address.tsx
          echo '[OK] Android Cliente: fallback nativo de endereco instalado e registrado'
          node scripts/qa/verify-apois-mobile-viewport-v1.mjs cliente --native
          MANIFEST="superapp/shell/android/app/src/main/AndroidManifest.xml"
          grep -Fq 'com.google.android.geo.API_KEY' "$MANIFEST"
          echo "[OK] Android Cliente de teste criado; mapa Corridas usa fallback web por causa da assinatura debug"

      - name: Restore persistent QA Android debug signing
        if: ${{ !contains(github.event.head_commit.message, '[qa-only]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APOIS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" .qa-signing
          KEYSTORE="$HOME/.android/debug.keystore"
          ENCRYPTED=".qa-signing/android-debug-keystore.enc"
          if [ -n "${QA_DEBUG_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$QA_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            echo "[OK] QA signing restored from protected GitHub Actions secret"
          elif [ -s "$ENCRYPTED" ]; then
            test -n "${GH_TOKEN:-}" || { echo "::error::QA encrypted key requires token"; exit 1; }
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$ENCRYPTED" -out "$KEYSTORE" -pass env:GH_TOKEN
            echo "[OK] Reused encrypted QA signing identity"
          else
            echo "::error::Original Client QA signing key unavailable; no secret or encrypted cache. Never create another key."
            exit 1
          fi
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -alias androiddebugkey -storepass android >/dev/null
          keytool -list -v -keystore "$KEYSTORE" -alias androiddebugkey -storepass android | grep 'SHA256:' | head -n 1
          ACTUAL_FINGERPRINT="$(keytool -list -v -keystore "$KEYSTORE" -alias androiddebugkey -storepass android | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          REQUIRED_FINGERPRINT="$(printf '%s' "${QA_CERT_EXPECTED_SHA256:-}" | tr -cd '[:xdigit:]' | tr '[:upper:]' '[:lower:]')"
          test "${#REQUIRED_FINGERPRINT}" -eq 64 || { echo "::error::Cliente QA certificado SHA-256 configurado invalido ou ausente"; exit 1; }
          test "$ACTUAL_FINGERPRINT" = "$REQUIRED_FINGERPRINT" || { echo "::error::QA certificate changed or cache lost; do not rotate signature automatically"; exit 1; }
          echo "[OK] Reusable QA signing identity verified"

      - name: Stamp monotonic QA Android version
        if: ${{ !contains(github.event.head_commit.message, '[qa-only]') }}
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="superapp/shell/android/app/build.gradle"
          test -s "$GRADLE_FILE"
          # Keep installable QA above historical 1.0.11-qa.1001 test builds.
          QA_VERSION_CODE="$((2000 + GITHUB_RUN_NUMBER))"
          sed -i -E "s/(versionCode[[:space:]]+)[0-9]+/\\1${QA_VERSION_CODE}/" "$GRADLE_FILE"
          sed -i -E "s/(versionName[[:space:]]+)\"[^\"]*\"/\\1\"1.0.11-qa.${GITHUB_RUN_NUMBER}\"/" "$GRADLE_FILE"
          grep -Fq "versionCode ${QA_VERSION_CODE}" "$GRADLE_FILE"
          grep -Fq "versionName \"1.0.11-qa.${GITHUB_RUN_NUMBER}\"" "$GRADLE_FILE"
          echo "[OK] Android QA versionCode=${QA_VERSION_CODE} stamped"

      - name: Force persisted QA debug signing in generated Gradle
        if: ${{ !contains(github.event.head_commit.message, '[qa-only]') }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/configure-apois-client-qa-debug-signing.mjs

      - name: Build installable debug APK
        if: ${{ !contains(github.event.head_commit.message, '[qa-only]') }}
        shell: bash
        run: |
          set -euo pipefail
          cd superapp/shell/android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace
          cd ../../..
          mkdir -p build
          APK="$(find superapp/shell/android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK" >/dev/null
          APK_CERT_DETAILS="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "[DIAG] Android signer certificate information:"
          printf '%s\n' "$APK_CERT_DETAILS" | grep -Ei 'Signer|certificate' | head -n 8 || true
          APK_CERT="$(printf '%s\n' "$APK_CERT_DETAILS" | grep -Eio '[[:xdigit:]]{64}' | head -n 1 | tr '[:upper:]' '[:lower:]' || true)"
          QA_CERT="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "[DIAG] Expected QA certificate SHA-256: ${QA_CERT:-empty}"
          echo "[DIAG] Actual APK certificate SHA-256: ${APK_CERT:-empty}"
          if [ -z "$APK_CERT" ] || [ "$APK_CERT" != "$QA_CERT" ]; then
            echo "::error::APK signer is not the persisted QA identity; blocking artifact"
            exit 1
          fi
          echo "[OK] APK signer matches protected pinned QA signing certificate"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt -perm -111 | sort -V | tail -n 1)"
          test -n "$AAPT" || { echo "::error::aapt missing; cannot verify Cliente APK package/version"; exit 1; }
          "$AAPT" dump badging "$APK" | node scripts/qa/verify-android-apk-badging-v1.mjs "$APP_PACKAGE" "$((2000 + GITHUB_RUN_NUMBER))" "1.0.11-qa.${GITHUB_RUN_NUMBER}"
          echo "[OK] Cliente APK package/version verified against QA configuration"
          # Verify the ACTUAL APK ZIP payload, not only intermediate web/dist.
          TEMP_APK_ASSETS="$(mktemp -d)"
          trap 'rm -rf "$TEMP_APK_ASSETS"' EXIT
          unzip -q "$APK" 'assets/public/*' -d "$TEMP_APK_ASSETS"
          test -s "$TEMP_APK_ASSETS/assets/public/index.html"
          node scripts/qa/verify-client-static-assets-v1.mjs "$TEMP_APK_ASSETS/assets/public"
          node scripts/qa/verify-client-home-viewport-v2.mjs "$TEMP_APK_ASSETS/assets/public/index.html"
          grep -R -Fq 'data-apois-corridas-auth-viewport-v2' "$TEMP_APK_ASSETS/assets/public/modules/corridas/assets" || { echo '[FAIL] Cliente APK: correção global de viewport ausente'; exit 1; }
          for path in index.html modules/corridas/index.html modules/entregas/index.html; do
            grep -Fq 'data-apois-embedded-viewport-v1' "$TEMP_APK_ASSETS/assets/public/$path" || { echo "[FAIL] Cliente APK: proteção global ausente: $path"; exit 1; }
          done
          echo '[OK] Cliente APK inclui viewport global nas três entradas'
          node scripts/qa/verify-client-corridas-loading-v1.mjs "$TEMP_APK_ASSETS/assets/public/modules/corridas/index.html"
          grep -R -Fq 'Recalculando tarifa...' "$TEMP_APK_ASSETS/assets/public/modules/corridas/assets" || { echo '[FAIL] Cliente APK: aviso de tarifa indisponível não empacotado'; exit 1; }
          echo '[OK] APK Cliente tem tarifa pendente explícita sem liberar solicitação'
          echo "[OK] Cliente APK verified after Capacitor packaging: entrypoints, CSS and JS dependency graph"
          rm -rf "$TEMP_APK_ASSETS"
          trap - EXIT
          cp "$APK" build/APOIS-Cliente-TESTE.apk
          test -s build/APOIS-Cliente-TESTE.apk
          echo "[SHA256 APK] $(sha256sum build/APOIS-Cliente-TESTE.apk | awk '{print $1}')"
          echo "[OK] APK Cliente de teste gerado"

      - name: Upload APOIS Cliente APK
        if: ${{ !contains(github.event.head_commit.message, '[qa-only]') }}
        uses: actions/upload-artifact@v4
        with:
          name: APOIS-Cliente-TESTE
          path: build/APOIS-Cliente-TESTE.apk
          if-no-files-found: error
          retention-days: 7
