name: APOIS Cliente QA signing recovery
on:
  push:
    branches:
      - test/apois-pix-simulado-isolado-20261029
    paths:
      - '.github/workflows/apois-client-android.yml'
permissions:
  contents: read
jobs:
  recover-existing-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Restore existing encrypted QA signing only
        uses: actions/cache/restore@v4
        with:
          path: .qa-signing/android-debug-keystore.enc
          key: apois-client-qa-encrypted-signing-v1
          fail-on-cache-miss: true
      - name: Verify pinned identity and persist directly to Actions secret
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APOIS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE="$(mktemp)"
          trap 'rm -f "$KEYSTORE" .qa-signing/android-debug-keystore.enc' EXIT
          test -n "${GH_TOKEN:-}"
          test -s .qa-signing/android-debug-keystore.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in .qa-signing/android-debug-keystore.enc -out "$KEYSTORE" -pass env:GH_TOKEN
          ACTUAL="$(keytool -list -v -keystore "$KEYSTORE" -alias androiddebugkey -storepass android | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "97eaf64ee20ef16b2765a6dff5e96a25dbad4da12ccb6e5c2cd48d4c9c2f61f4" || { echo "::error::QA certificate mismatch; nothing saved"; exit 1; }
          echo "[OK] Original pinned QA certificate verified"
          base64 -w 0 "$KEYSTORE" | gh secret set APOIS_CLIENT_QA_DEBUG_KEYSTORE_BASE64 --repo apoistecnologia-gif/apois-superapp --app actions
          echo "[OK] Existing QA keystore saved directly to Actions secret"
