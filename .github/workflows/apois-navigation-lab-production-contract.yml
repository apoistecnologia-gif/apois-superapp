name: APOIS Navegacao - contrato observado v21 (sem deploy)
on:
  push:
    branches: [lab/apois-navegacao-ferrostar-etapa1]
    paths: ['labs/apois-navigation/production-contract/**','labs/apois-navigation/passenger-provenance-snapshot/**','.github/workflows/apois-navigation-lab-production-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar contrato observado no PostgreSQL descartavel
        run: |
          set -euo pipefail
          docker run -d --name apois-v21-fixture --network none -e POSTGRES_PASSWORD=synthetic_ci_only postgres:17
          trap 'docker rm -f apois-v21-fixture >/dev/null 2>&1 || true' EXIT
          ready=0
          for n in $(seq 1 60); do
            if docker exec apois-v21-fixture pg_isready -h 127.0.0.1 -U postgres; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          run_sql() { docker exec -i apois-v21-fixture psql -X -U postgres -v ON_ERROR_STOP=1; }
          root=labs/apois-navigation/production-contract
          run_sql < "$root/fixture-v21.sql"
          run_sql < labs/apois-navigation/passenger-provenance-snapshot/experimental/apois-navigation/schema.sql
          run_sql < "$root/observed-gates.sql"
          run_sql < "$root/create-passenger-ride-v21.sql"
          run_sql < labs/apois-navigation/passenger-provenance-snapshot/revocation-fixture.sql
          run_sql < "$root/authority-v21.sql"
          run_sql < "$root/service-rpc-v21.sql"
          run_sql < "$root/recovery-v21.sql"
          run_sql < "$root/confirmation-v21.sql"
          run_sql < "$root/test-v21.sql"
          node "$root/request-ride-v21.integration.mjs"
          node --test "$root/v21-edge-adapter.test.mjs"
          node "$root/recovery-v21.integration.mjs"
          run_sql < "$root/test-confirmation-v21.sql"
          node --test "$root/navigation-control-v21.test.mjs"
          node "$root/verified-host-v21.integration.mjs"
          node --test labs/apois-navigation/passenger-provenance-snapshot/experimental/apois-navigation/ui/durable-ride-host.test.mjs labs/apois-navigation/passenger-provenance-snapshot/experimental/apois-navigation/ui/verified-host-transport.test.mjs
          node labs/apois-navigation/passenger-provenance-snapshot/verify.mjs
          run_sql < "$root/least-privilege-trigger-fixture.sql"
          run_sql < "$root/test-least-privilege-trigger.sql"
      - name: Journal persistente em Chromium real
        run: bash labs/apois-navigation/production-contract/test-journal-browser.sh
