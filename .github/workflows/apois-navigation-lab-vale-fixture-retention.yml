name: APOIS GPS - preservacao temporaria do candidato Vale
on:
  push:
    branches: [lab/apois-navegacao-ferrostar-etapa1]
    paths: ['.github/workflows/apois-navigation-lab-vale-fixture-retention.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preserve-inactive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: apois-launch-vale-candidate
          run-id: 45748506856
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apois-launch-vale
      - uses: actions/download-artifact@v4
        with:
          name: apois-launch-vale-search-candidates
          run-id: 45748780382
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apois-vale-search
      - uses: actions/download-artifact@v4
        with:
          name: apois-vale-runtime-assets-inactive
          run-id: 45749604118
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apois-vale-previous-runtime
      - name: Reconstruct and compare exact inactive fixtures before retention
        run: |
          set -euo pipefail
          L=labs/apois-navigation/launch-vale
          python -m unittest discover -s "$L" -p 'test_runtime_assets.py' -v
          python "$L/assemble-pack.py" "$RUNNER_TEMP/apois-launch-vale" "$RUNNER_TEMP/apois-vale-search" "$RUNNER_TEMP/apois-vale-pack"
          python "$L/runtime_assets.py" "$RUNNER_TEMP/apois-launch-vale" "$RUNNER_TEMP/apois-vale-pack" "$RUNNER_TEMP/apois-vale-runtime-assets"
          diff -qr "$RUNNER_TEMP/apois-vale-previous-runtime" "$RUNNER_TEMP/apois-vale-runtime-assets"
          test "$(du -sb "$RUNNER_TEMP/apois-launch-vale" "$RUNNER_TEMP/apois-vale-search" "$RUNNER_TEMP/apois-vale-pack" "$RUNNER_TEMP/apois-vale-runtime-assets" | awk '{s+=$1}END{print s}')" -le 134217728
          echo 'APOIS_VALE_FIXTURES_MATCH_EXACTLY'
      - uses: actions/upload-artifact@v4
        with:
          name: apois-launch-vale-candidate
          path: ${{ runner.temp }}/apois-launch-vale/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: apois-launch-vale-search-candidates
          path: ${{ runner.temp }}/apois-vale-search/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: apois-vale-inactive-data-pack
          path: ${{ runner.temp }}/apois-vale-pack/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: apois-vale-runtime-assets-inactive
          path: ${{ runner.temp }}/apois-vale-runtime-assets/
          retention-days: 30
          if-no-files-found: error
