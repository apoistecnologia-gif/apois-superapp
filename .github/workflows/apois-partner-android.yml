name: APOIS Parceiro Android APK
# QA218: existing Courier cloud vector Map ID and raster fallback are checked in Partner preflight.
# QA218: driver map verification checks both legacy demand and opt-in cohorts before APK packing.
# QA218: known authorized web-only audit workflows are explicitly allowlisted; no release or deploy.
# Build de homologacao Android solicitado em 12/11/2026: executar APK Parceiro no repositorio oficial publico.
# test workflow: GitHub Actions debug APK — courier home structurally non-overlapping inline availability
# QA motorista V4: signup email confirmation + uppercase personal fields + typed birth mask
# QA 2026-11-09: rebuild with courier path selected from existing workspace even when env is relative.
# V4 QA gate: correct normalized uppercase submission in generated React form
# QA208: build installable homologation APK with user-confirmed APOIS JavaScript vector Map ID, reusing original signing; not a production deploy.
# QA214: package approved QA209 camera, PIN and route-finish repairs for Android physical regression; keep original QA signature.

on:
  workflow_dispatch:
  push:
    branches:
      - audit/continuacao-20261107
      - build/qa218-android-homologacao-20261112
      - fix/motorista-qa219-video-20261112
      - fix/entregas-homologacao-ajustes-20261030
      - feat/apois-cliente-red-visual-20261003
      - fix/apois-partner-courier-gps-logo-push-20261027
      - fix/apois-android-github-homolog-20261029
    paths:
      - '.github/workflows/apois-partner-android.yml'
      - 'scripts/audit-partner-red-visual-v16.mjs'
      - 'scripts/audit-codemagic-host-installs-v18.mjs'
      - 'scripts/harden-partner-motorista-history-receipt.mjs'
      - 'scripts/fix-report06-motorista-receipt-v1.mjs'
      - 'scripts/build-partner-release.sh'
      - 'scripts/fix-partner-driver-forward-camera-v1.mjs'
      - 'scripts/fix-partner-driver-qa186-navigation-layout-v1.mjs'
      - 'scripts/fix-partner-driver-qa190-physical-video-v1.mjs'
      - 'scripts/fix-partner-driver-qa192-vector-passenger-v1.mjs'
      - 'scripts/qa/test-partner-driver-qa192-vector-passenger-v1.test.mjs'
      - 'scripts/fix-partner-driver-qa194-passenger-map-style-v1.mjs'
      - 'scripts/qa/test-partner-driver-qa194-passenger-map-style-v1.test.mjs'
      - 'scripts/fix-partner-driver-qa195-physical-ux-v1.mjs'
      - 'scripts/qa/test-partner-driver-qa195-physical-ux-v1.test.mjs'
      - 'scripts/fix-partner-driver-qa198-physical-stability-v1.mjs'
      - 'scripts/qa/test-partner-driver-qa198-physical-stability-v1.test.mjs'
      - 'scripts/fix-partner-driver-qa201-route-reliability-v1.mjs'
      - 'scripts/qa/test-partner-driver-qa201-route-reliability-v1.test.mjs'
      - 'scripts/fix-partner-driver-qa202-cloud-vector-readiness-v1.mjs'
      - 'scripts/qa/test-partner-driver-qa202-cloud-vector-readiness-v1.test.mjs'
      - 'scripts/fix-partner-driver-qa209-camera-v1.mjs'
      - 'scripts/fix-partner-driver-qa209-finished-route-v1.mjs'
      - 'scripts/fix-partner-driver-qa209-pin-controls-v1.mjs'
      - 'scripts/fix-partner-driver-qa220-android-map-pin-v1.mjs'
      - 'scripts/qa/test-partner-driver-qa220-android-map-pin-v1.test.mjs'
      - 'scripts/fix-partner-driver-qa221-map-owner-compact-hud-v1.mjs'
      - 'scripts/qa/test-partner-driver-qa221-map-owner-compact-hud-v1.test.mjs'
      - 'scripts/qa/test-partner-driver-qa209-physical-map-pin-v1.test.mjs'
      - 'scripts/qa/verify-apois-partner-vector-map-config-v1.mjs'
      - 'docs/google-maps/apois-passageiro-vector-style-import.json'
      - 'supabase/corridas-forward-migrations/20261111_apois_driver_offer_passenger_photo_scope.sql'
      - 'scripts/qa/test-partner-driver-qa190-physical-video-v1.test.mjs'
      - 'scripts/qa/test-partner-driver-qa186-navigation-layout-v1.test.mjs'
      - 'scripts/fix-partner-driver-passenger-avatar-v1.mjs'
      - 'scripts/qa/test-partner-driver-forward-camera-v1.test.mjs'
      - 'scripts/audit-partner-preflight-v1.mjs'
      - 'scripts/fix-partner-motorista-map-startup-stability-v1.mjs'
      - 'scripts/fix-partner-motorista-active-ride-map-v2.mjs'
      - 'scripts/qa/test-partner-motorista-active-map-v2.test.mjs'
      - 'scripts/qa/test-partner-motorista-map-startup-stability-v1.test.mjs'
      - 'superapp/partner-shell/build.mjs'
      - 'scripts/protect-apois-embedded-viewport-v1.mjs'
      - 'scripts/harden-apois-native-webview-scroll-v1.mjs'
      - 'scripts/qa/verify-apois-mobile-viewport-v1.mjs'
      - 'scripts/configure-partner-android.mjs'
      - 'scripts/fix-partner-motorista-drawer-profile-v5.mjs'
      - 'scripts/qa/driver-menu-profile-v5.css'
      - 'scripts/verify-partner-motorista-drawer-profile-v5.mjs'
      - 'scripts/fix-report07-driver-reason-code-v1.mjs'
      - 'scripts/fix-report04-driver-center-v1.mjs'
      - 'scripts/harden-partner-motorista-native-utilities.mjs'
      - 'scripts/fix-report05-motorista-security-v1.mjs'
      - 'scripts/fix-partner-courier-offer-focus-ts-v1.mjs'
      - 'scripts/test-partner-driver-recovery-relay-v2.mjs'

permissions:
  contents: read

jobs:
  build-partner-apk:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/audit/continuacao-20261107' || github.ref == 'refs/heads/build/qa218-android-homologacao-20261112' || github.ref == 'refs/heads/fix/motorista-qa219-video-20261112')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUN_VERSION: "1.3.14"
      PARTNER_APP_PACKAGE: "br.com.apois.parceiro"
      PARTNER_APP_LABEL: "APOIS Parceiro"
      PARTNER_VERSION_CODE: "28"
      PARTNER_VERSION_NAME: "1.0.27"
      APOIS_REPO_TOKEN: ${{ secrets.APOIS_REPO_TOKEN }}
      CORRIDAS_VITE_SUPABASE_URL: ${{ secrets.CORRIDAS_VITE_SUPABASE_URL }}
      CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY }}
      CORRIDAS_WEB_MAPS_API_KEY: ${{ secrets.CORRIDAS_WEB_MAPS_API_KEY }}
      # QA-only, enabled after user published style and confirmed vector + rotation in Cloud.
      # QA206: public Map ID created in Google Cloud project Movvi; no API keys or billing changed.
      VITE_APOIS_PARTNER_VECTOR_MAP_ID: "1af3628136c58ef870ba9d1a"
      VITE_APOIS_PARTNER_CLOUD_STYLE_VERIFIED: "true"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      FIREBASE_PARTNER_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_PARTNER_GOOGLE_SERVICES_JSON_BASE64 }}
      APOIS_PARTNER_QA_DEBUG_KEYSTORE_BASE64: ${{ secrets.APOIS_PARTNER_QA_DEBUG_KEYSTORE_BASE64 }}
      APOIS_PARTNER_QA_CERT_SHA256: ${{ secrets.APOIS_PARTNER_QA_CERT_SHA256 }}

    steps:
      - name: Checkout APOIS Superapp
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Validate required GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in APOIS_REPO_TOKEN CORRIDAS_VITE_SUPABASE_URL CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY CORRIDAS_WEB_MAPS_API_KEY VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY FIREBASE_PARTNER_GOOGLE_SERVICES_JSON_BASE64 APOIS_PARTNER_QA_DEBUG_KEYSTORE_BASE64 APOIS_PARTNER_QA_CERT_SHA256
          do
            if [ -z "${!key:-}" ]; then
              echo "::error::GitHub secret ausente: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Cadastre os secrets acima em Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "[OK] Secrets mínimos presentes"

      - name: Checkout protected APOIS sources
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${APOIS_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive
          test -d sources/apois-corridas-motorista-admin
          test -d sources/apois-entregas
          test -d sources/apois-corridas-passageiro
          echo "[OK] Fontes protegidas carregadas"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Android SDK on runner
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_SDK_ROOT:-}"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --list >/dev/null
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "[OK] Android SDK disponível no runner: $SDKMANAGER"

      - name: Install pinned Bun
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.bun/bin:$PATH"
          test "$(bun --version)" = "$BUN_VERSION"
          java -version

      - name: Verify source pins
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          npm run verify:pins

      - name: Validate updated APOIS Parceiro map before building
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-apois-unified-maps.mjs
          node --check scripts/harden-motorista-map-branding.mjs
          node --check scripts/harden-partner-motorista-visual-v18.mjs
          node --check scripts/harden-partner-driver-profile-logout-v3.mjs
          node --check scripts/harden-partner-motorista-pin-ride-v4.mjs
          node --check scripts/harden-partner-motorista-google-roadmap-v5.mjs
          node --check scripts/harden-partner-motorista-arrival-voice-v5.mjs
          node --check scripts/harden-partner-driver-trip-ux-v6.mjs
          node --check scripts/harden-partner-driver-passenger-name-v6.mjs
          grep -Fq 'data-apois-trip-top-v6' scripts/harden-partner-driver-trip-ux-v6.mjs
          grep -Fq 'rounded-\[22px\]' scripts/harden-partner-driver-trip-ux-v6.mjs
          grep -Fq 'data-apois-trip-bottom-v6' scripts/harden-partner-driver-trip-ux-v6.mjs
          grep -Fq 'Ver perfil do passageiro' scripts/harden-partner-driver-trip-ux-v6.mjs
          grep -Fq 'onClick=' scripts/harden-partner-driver-trip-ux-v6.mjs
          grep -Fq 'driverAppPatched=read' scripts/audit-partner-preflight-v1.mjs
          grep -Fq 'PIN V4 always visible' scripts/audit-partner-preflight-v1.mjs
          grep -Fq 'Profile V3 logout handler boundary' scripts/harden-partner-driver-profile-logout-v3.mjs
          grep -Fq 'replaceLogoutFunction' scripts/harden-partner-driver-profile-logout-v3.mjs
          grep -Fq 'nav[aria-label="Navegação principal do motorista"]' scripts/harden-partner-driver-profile-logout-v3.mjs
          grep -Fq 'signOutDriverOnThisDevice' scripts/harden-partner-driver-profile-logout-v3.mjs
          node --check scripts/test-partner-map-visual.mjs
          node scripts/test-partner-map-visual.mjs
          node --test scripts/qa/test-extract-partner-apk-cert-sha256-v1.mjs
          node scripts/audit-partner-motorista-brand-v4.mjs
          echo "[OK] Mapa claro, marcador centralizado e contraste verificados"

      - name: Build Motorista + Entregador modules
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          npm run build:partner
          node scripts/qa/verify-apois-mobile-viewport-v1.mjs parceiro
          # Gate QA: não publicar um APK antigo que omita o cadastro com 13 fotos e o fluxo de pendências.
          node --check scripts/fix-partner-driver-signup-form-v4.mjs
          node --check scripts/fix-partner-driver-auth-resume-v5.mjs
          grep -Fq 'APOIS_DRIVER_AUTH_RESUME_V5' .work/partner-motorista/src/lib/driverRegistration.mobile.ts
          node --check scripts/fix-partner-driver-registration-preflight-v6.mjs
          grep -Fq 'APOIS_DRIVER_REGISTRATION_PREFLIGHT_V6' .work/partner-motorista/src/lib/driverRegistration.mobile.ts
          grep -Fq 'mobility_user_id' .work/partner-motorista/src/lib/driverRegistration.mobile.ts
          grep -Fq 'driver_get_profile' .work/partner-motorista/src/lib/driverRegistration.mobile.ts
          grep -Fq 'Cadastro sem confirmação de persistência' .work/partner-motorista/src/lib/driverRegistration.mobile.ts
          node scripts/verify-apois-13-photo-driver-pendencies-v1.mjs
          node --check scripts/fix-partner-motorista-recovery-v1.mjs
          node --check scripts/fix-partner-motorista-recovery-relay-v2.mjs
          grep -Fq 'APOIS_DRIVER_RECOVERY_PENDING_RELAY_V2' .work/partner-motorista/src/lib/auth/driverPasswordRecovery.ts
          grep -Fq 'window.sessionStorage.removeItem(PARTNER_FORWARDED_RECOVERY_KEY)' .work/partner-motorista/src/lib/auth/driverPasswordRecovery.ts
          node scripts/test-partner-driver-recovery-relay-v2.mjs
          node --check scripts/fix-partner-motorista-recovery-otp-v5.mjs
          grep -Fq 'APOIS_DRIVER_RECOVERY_EMAIL_OTP_V5' .work/partner-motorista/src/routes/motorista.recuperar-senha.tsx
          grep -Fq 'data-apois-driver-recovery-otp-input-v5' .work/partner-motorista/src/routes/motorista.recuperar-senha.tsx
          grep -Fq 'type: "recovery"' .work/partner-motorista/src/routes/motorista.recuperar-senha.tsx
          grep -Fq 'APOIS_DRIVER_RECOVERY_INLINE_CONTRAST_V3' .work/partner-motorista/src/apois-ui-hardening-round3.css
          grep -R -Fq 'data-apois-driver-recovery-otp-input-v5' superapp/partner-shell/dist/modules/motorista
          if grep -R -Fq 'data-apois-driver-recovery-paste-v4' superapp/partner-shell/dist/modules/motorista; then echo '[FAIL] Legacy copy-link recovery remains'; exit 1; fi
          grep -Fq 'data-apois-driver-recovery-email-v1' .work/partner-motorista/src/routes/motorista.recuperar-senha.tsx
          grep -Fq 'APOIS_MOTORISTA_RECOVERY_HARDEN_V1' .work/partner-motorista/src/apois-ui-hardening-round3.css
          grep -Fq 'recovery callback may be pending' .work/partner-motorista/src/routes/__root.tsx
          grep -Fq 'to: "/motorista/login", replace: true' .work/partner-motorista/src/routes/motorista.redefinir-senha.tsx
          grep -R -Fq 'data-apois-driver-recovery-email-v1' superapp/partner-shell/dist/modules/motorista
          grep -Fq 'APOIS_DRIVER_SIGNUP_FORM_V4' .work/partner-motorista/src/routes/motorista.cadastro.tsx
          grep -Fq 'parseDriverBirthDateBR' .work/partner-motorista/src/routes/motorista.cadastro.tsx
          grep -Fq 'onInputCapture={uppercaseDriverField}' .work/partner-motorista/src/routes/motorista.cadastro.tsx
          grep -Fq 'apois-driver-await-email-v4' .work/partner-motorista/src/routes/motorista.login.tsx
          grep -R -Fq 'DD/MM/AAAA' superapp/partner-shell/dist/modules/motorista
          grep -R -Fq 'Verifique seu e-mail' superapp/partner-shell/dist/modules/motorista
          grep -Fq 'data-apois-driver-history-contrast-v2' .work/partner-motorista/src/routes/motorista.corridas.tsx
          grep -Fq 'APOIS_MOTORISTA_MENU_LATERAL_V2' .work/partner-motorista/src/components/MovviHeader.tsx
          grep -Fq 'const showNav = false' .work/partner-motorista/src/components/ApoisDriverBottomNav.tsx
          grep -Fq 'data-apois-courier-search-scan-v1' .work/partner-entregador/src/components/CourierPremiumViews.tsx
          grep -Fq 'data-apois-courier-calls-card-v2' .work/partner-entregador/src/routes/courier.tsx
          grep -Fq 'data-apois-courier-profile-diagnostic-v2' .work/partner-entregador/src/components/CourierPanels.tsx
          grep -Fq 'data-apois-driver-menu-fullscreen-v4' .work/partner-motorista/src/components/DriverSideMenu.tsx
          grep -Fq 'data-apois-driver-settings-contrast-v4' .work/partner-motorista/src/routes/motorista.configuracoes.tsx
          grep -Fq 'rpc("request_own_account_deletion")' .work/partner-motorista/src/routes/motorista.configuracoes.tsx
          echo '[OK] APK Parceiro inclui correções acumuladas Entregador e Motorista'
          grep -Fq 'APOIS_COURIER_SEARCH_SCAN_V1' .work/partner-entregador/src/system-theme.css
          grep -Fq 'APOIS_ANDROID_DRIVER_PHOTO_CAPTURE_V2' .work/partner-motorista/src/components/DriverDocumentField.tsx
          grep -Fq 'APOIS_ANDROID_IMAGE_FALLBACK_V2' .work/partner-motorista/src/lib/imageCompress.ts
          grep -Fq 'APOIS_NATIVE_DRIVER_PHOTO_PICKER_V3' .work/partner-motorista/src/components/DriverDocumentField.tsx
          grep -Fq 'CameraResultType.Base64' .work/partner-motorista/src/lib/driverNativePhotoPicker.ts
          grep -R -Fq 'getPhoto' superapp/partner-shell/dist/modules/motorista
          grep -R -Fq 'data-apois-driver-photo-field-v2' superapp/partner-shell/dist/modules/motorista
          grep -R -Fq 'Preparando arquivo...' superapp/partner-shell/dist/modules/motorista
          grep -R -Fq 'data-apois-driver-corrections-v1' superapp/partner-shell/dist/modules/motorista
          grep -R -Fq 'Faróis acesos' superapp/partner-shell/dist/modules/motorista
          grep -R -Fq '#E51B23' superapp/partner-shell/dist/modules/motorista
          grep -R -Fq '#E51B23' superapp/partner-shell/dist/modules/entregador
          grep -R -Fq 'data-apois-partner-auth-v18' superapp/partner-shell/dist/modules/motorista
          grep -R -Fq 'data-apois-partner-auth-v17' superapp/partner-shell/dist/modules/entregador
          if find superapp/partner-shell/dist/modules/motorista superapp/partner-shell/dist/modules/entregador -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | xargs -0 grep -Fqi '#F6BE1C'; then
            echo "::error::Identidade dourada antiga permaneceu em arquivo executável/visual do bundle Parceiro"
            exit 1
          fi
          echo "[OK] Módulos Parceiro compilados com identidade nova"
          node scripts/qa/verify-apois-partner-vector-map-config-v1.mjs

      - name: Validate full partner preflight on APK bundle
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-partner-preflight-v1.mjs --dist
          grep -Fq 'data-apois-driver-profile-v3' scripts/audit-partner-preflight-v1.mjs
          node scripts/test-partner-shell-navigation-v2.mjs --dist
          echo "[OK] Auditoria integrada e navegacao entre modulos validadas"

      - name: Create Android project
        if: ${{ !contains(github.event.head_commit.message, '[qa-only]') }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          cd superapp/partner-shell
          bun install
          rm -rf android
          bunx cap add android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          bunx cap sync android
          # Native Camera is required: never deliver a WebView-only photo chooser again.
          test -s android/app/src/main/assets/capacitor.plugins.json
          grep -Fq 'CameraPlugin' android/app/src/main/assets/capacitor.plugins.json
          cd ../..
          node scripts/configure-partner-android.mjs
          node scripts/install-partner-launcher.mjs
          node scripts/install-partner-splash.mjs
          node scripts/qa/verify-apois-mobile-viewport-v1.mjs parceiro --native
          MANIFEST="superapp/partner-shell/android/app/src/main/AndroidManifest.xml"
          grep -Fq 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST"
          grep -Fq 'android:scheme="br.com.apois.parceiro"' "$MANIFEST"
          test -s superapp/partner-shell/android/app/google-services.json
          echo "[OK] Projeto Android Parceiro criado"

      - name: Restore original protected Partner QA signing identity
        if: ${{ !contains(github.event.head_commit.message, '[qa-only]') }}
        shell: bash
        run: |
          set -euo pipefail
          : "${APOIS_PARTNER_QA_DEBUG_KEYSTORE_BASE64:?Protected original Partner QA keystore is required}"
          : "${APOIS_PARTNER_QA_CERT_SHA256:?Partner QA certificate SHA256 pin is required}"
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$APOIS_PARTNER_QA_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          node scripts/qa/configure-partner-qa-debug-signing-v1.mjs
          echo "[OK] QA original signing identity pinned; no replacement keystore generated"

      - name: Stamp monotonic Partner QA Android version
        if: ${{ !contains(github.event.head_commit.message, '[qa-only]') }}
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="superapp/partner-shell/android/app/build.gradle"
          VERSION_CODE="$((28 + GITHUB_RUN_NUMBER))"
          VERSION_NAME="1.0.28-qa.${GITHUB_RUN_NUMBER}"
          sed -i -E "s/(versionCode[[:space:]]+)[0-9]+/\\1${VERSION_CODE}/" "$GRADLE_FILE"
          sed -i -E "s/(versionName[[:space:]]+)\"[^\"]*\"/\\1\"${VERSION_NAME}\"/" "$GRADLE_FILE"
          grep -Fq "versionCode ${VERSION_CODE}" "$GRADLE_FILE"
          grep -Fq "versionName \"${VERSION_NAME}\"" "$GRADLE_FILE"
          echo "[OK] Partner QA Android versionCode=${VERSION_CODE} monotonic"

      - name: Build installable debug APK
        if: ${{ !contains(github.event.head_commit.message, '[qa-only]') }}
        shell: bash
        run: |
          set -euo pipefail
          cd superapp/partner-shell/android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace
          cd ../../..
          mkdir -p build
          APK="$(find superapp/partner-shell/android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK" >/dev/null
          APK_CERT="$("$APKSIGNER" verify --print-certs "$APK" | node scripts/qa/extract-partner-apk-cert-sha256-v1.mjs)"
          EXPECTED_CERT="$(printf '%s' "$APOIS_PARTNER_QA_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          if [ "${#EXPECTED_CERT}" -ne 64 ] || [ -z "$APK_CERT" ] || [ "$APK_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::Partner APK signature mismatch: refusing incompatible update"
            exit 1
          fi
          echo "[OK] Partner APK signature matches protected original QA certificate"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt -perm -111 | sort -V | tail -n 1)"
          test -n "$AAPT" || { echo "::error::aapt missing; cannot verify Parceiro APK package/version"; exit 1; }
          "$AAPT" dump badging "$APK" | node scripts/qa/verify-android-apk-badging-v1.mjs "$PARTNER_APP_PACKAGE" "$((28 + GITHUB_RUN_NUMBER))" "1.0.28-qa.${GITHUB_RUN_NUMBER}"
          echo "[OK] Parceiro APK package/version verified against QA configuration"
          # Verify the ACTUAL APK ZIP payload, not only intermediate web/dist.
          TEMP_APK_ASSETS="$(mktemp -d)"
          trap 'rm -rf "$TEMP_APK_ASSETS"' EXIT
          unzip -q "$APK" 'assets/public/*' -d "$TEMP_APK_ASSETS"
          test -s "$TEMP_APK_ASSETS/assets/public/index.html"
          node scripts/qa/verify-partner-static-assets-v1.mjs "$TEMP_APK_ASSETS/assets/public"
          for path in index.html modules/motorista/index.html modules/entregador/index.html; do
            grep -Fq 'data-apois-embedded-viewport-v1' "$TEMP_APK_ASSETS/assets/public/$path" || { echo "[FAIL] Parceiro APK: proteção global ausente: $path"; exit 1; }
          done
          echo '[OK] Parceiro APK inclui viewport global nas três entradas'
          echo "[OK] Parceiro APK verified after Capacitor packaging: entrypoints, CSS and JS dependency graph"
          rm -rf "$TEMP_APK_ASSETS"
          trap - EXIT
          cp "$APK" build/APOIS-Parceiro-TESTE.apk
          test -s build/APOIS-Parceiro-TESTE.apk
          echo "[OK] APK de teste gerado"

      - name: Upload APOIS Parceiro APK
        if: ${{ !contains(github.event.head_commit.message, '[qa-only]') }}
        uses: actions/upload-artifact@v4
        with:
          name: APOIS-Parceiro-TESTE
          path: build/APOIS-Parceiro-TESTE.apk
          if-no-files-found: error
          retention-days: 7
