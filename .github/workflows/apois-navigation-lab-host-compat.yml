name: APOIS Navegacao - compatibilidade Capacitor (sem APK)
on:
  push:
    branches: [lab/apois-navegacao-ferrostar-etapa1]
    paths: ['labs/apois-navigation/host-compat/**', '.github/workflows/apois-navigation-lab-host-compat.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android API 36
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Gerar host real e isolado
        run: |
          set -euo pipefail
          H="$RUNNER_TEMP/apois-compat-host"
          mkdir -p "$H/www"
          cd "$H"
          npm init -y >/dev/null
          npm install --save-exact --no-audit --no-fund @capacitor/core@8.5.0 @capacitor/cli@8.5.0 @capacitor/android@8.5.0
          printf '<!doctype html><title>APOIS lab</title>' > www/index.html
          printf '{"appId":"br.com.apois.navigation.compat.lab","appName":"APOIS navigation lab","webDir":"www"}' > capacitor.config.json
          npx cap add android
          node "$GITHUB_WORKSPACE/labs/apois-navigation/host-compat/prepare-host.mjs" "$H" "$GITHUB_WORKSPACE/labs/apois-navigation"
      - name: Compilar no Gradle original, checar manifesto e dependencias
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/apois-compat-host/android"
          gradle --version
          gradle :app:checkDebugAarMetadata :app:processDebugMainManifest :app:compileDebugJavaWithJavac :navigation-probe:compileDebugKotlin :navigation-probe:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/apois-host-compat.log"
          test -z "$(find . -name '*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apois-host-compat-report
          path: ${{ runner.temp }}/apois-host-compat.log
          retention-days: 7
