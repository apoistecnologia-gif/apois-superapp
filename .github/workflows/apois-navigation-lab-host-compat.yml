name: APOIS Navegacao - compatibilidade Capacitor (sem APK)
on:
  push:
    branches: [lab/apois-navegacao-ferrostar-etapa1]
    paths: ['labs/apois-navigation/host-compat/**', 'labs/apois-navigation/android/**', '.github/workflows/apois-navigation-lab-host-compat.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout pinned public Motorista source (read only)
        uses: actions/checkout@v4
        with:
          repository: apoistecnologia-gif/movvi-go-connect
          ref: 9fc171050d8b5703540c49d19a8f1e9f5162775f
          path: .navigation-driver-source
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android API 36
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Testar cenarios ficticios do host
        run: node --test labs/apois-navigation/host-compat/demo/scenario.test.mjs
      - name: Verificar contrato de autoridade do Motorista
        run: |
          node labs/apois-navigation/host-compat/verify-motorista-authority.mjs "$GITHUB_WORKSPACE/.navigation-driver-source" "$GITHUB_WORKSPACE"
          node --test labs/apois-navigation/host-compat/motorista-authority.test.mjs labs/apois-navigation/host-compat/motorista-intent-dispatcher.test.mjs
      - name: Gerar host real e isolado
        run: |
          set -euo pipefail
          H="$RUNNER_TEMP/apois-compat-host"
          mkdir -p "$H/www"
          cd "$H"
          npm init -y >/dev/null
          npm install --save-exact --no-audit --no-fund @capacitor/core@8.5.0 @capacitor/cli@8.5.0 @capacitor/android@8.5.0
          cp "$GITHUB_WORKSPACE/labs/apois-navigation/host-compat/demo/"{index.html,main.mjs,scenario.mjs} www/
          printf '{"appId":"br.com.apois.navigation.compat.lab","appName":"APOIS navigation lab","webDir":"www"}' > capacitor.config.json
          npx cap add android
          node "$GITHUB_WORKSPACE/labs/apois-navigation/host-compat/prepare-host.mjs" "$H" "$GITHUB_WORKSPACE/labs/apois-navigation"
      - name: Instrumentar copia descartavel do GPS QA290
        run: node labs/apois-navigation/host-compat/prepare-driver-gps.mjs "$RUNNER_TEMP/apois-compat-host" "$GITHUB_WORKSPACE/.navigation-driver-source" "$GITHUB_WORKSPACE"
      - name: Compilar no Gradle original, checar manifesto e dependencias
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/apois-compat-host/android"
          gradle --version
          tasks=(:app:checkDebugAarMetadata :app:processDebugMainManifest :app:compileDebugJavaWithJavac :navigation-probe:compileDebugKotlin :navigation-probe:testDebugUnitTest)
          log="$RUNNER_TEMP/apois-host-compat.log"
          if ! gradle "${tasks[@]}" --no-daemon --stacktrace 2>&1 | tee "$log"; then
            # Retry once only for transient dependency transport failures.
            # No alternative repositories, bypasses, or changes to dependency versions.
            if grep -Eq 'Received status code (403|429|502|503|504) from server|Read timed out|Connection reset' "$log"; then
              echo "Dependency transport failed; one retry" | tee -a "$log"
              gradle "${tasks[@]}" --no-daemon --stacktrace 2>&1 | tee -a "$log"
            else
              exit 1
            fi
          fi
          test -z "$(find . -name '*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apois-host-compat-report
          path: ${{ runner.temp }}/apois-host-compat.log
          retention-days: 7
