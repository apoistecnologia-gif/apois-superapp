name: APOIS Navegacao - compatibilidade Capacitor (sem APK)
on:
  push:
    branches: [lab/apois-navegacao-ferrostar-etapa1]
    paths: ['labs/apois-navigation/host-compat/**', 'labs/apois-navigation/android/**','labs/apois-navigation/launch-vale/ValeOfflineResolver.kt','labs/apois-navigation/launch-vale/ValeRuntimePack.kt','labs/apois-navigation/pack-store/OfflinePackStore.kt', '.github/workflows/apois-navigation-lab-host-compat.yml']
  workflow_dispatch:
# Avoid redundant dependency downloads for superseded laboratory commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Checkout pinned public Motorista source (read only)
        uses: actions/checkout@v4
        with:
          repository: apoistecnologia-gif/movvi-go-connect
          ref: 9fc171050d8b5703540c49d19a8f1e9f5162775f
          path: .navigation-driver-source
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android API 36
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Testar cenarios ficticios do host
        run: node --test labs/apois-navigation/host-compat/demo/scenario.test.mjs
      - name: Verificar contrato de autoridade do Motorista
        run: |
          node labs/apois-navigation/host-compat/verify-motorista-authority.mjs "$GITHUB_WORKSPACE/.navigation-driver-source" "$GITHUB_WORKSPACE"
          node --test labs/apois-navigation/host-compat/motorista-authority.test.mjs labs/apois-navigation/host-compat/motorista-intent-dispatcher.test.mjs labs/apois-navigation/host-compat/guidance-handoff.test.mjs
      - name: Testar contrato do transporte confirmado
        run: |
          set -euo pipefail
          V="$GITHUB_WORKSPACE/labs/apois-navigation/host-compat"
          javac -d "$RUNNER_TEMP/confirmed-request-tests" "$V/ConfirmedNavigationRequest.java" "$V/ConfirmedNavigationRequestTest.java"
          java -cp "$RUNNER_TEMP/confirmed-request-tests" br.com.apois.navigation.compat.lab.ConfirmedNavigationRequestTest
          node --test "$V/confirmed-navigation-launch.test.mjs"
      - name: Gerar host real e isolado
        run: |
          set -euo pipefail
          H="$RUNNER_TEMP/apois-compat-host"
          mkdir -p "$H/www"
          cd "$H"
          npm init -y >/dev/null
          npm install --save-exact --no-audit --no-fund @capacitor/core@8.5.0 @capacitor/cli@8.5.0 @capacitor/android@8.5.0
          cp "$GITHUB_WORKSPACE/labs/apois-navigation/host-compat/demo/"{index.html,main.mjs,scenario.mjs} www/
          printf '{"appId":"br.com.apois.navigation.compat.lab","appName":"APOIS navigation lab","webDir":"www"}' > capacitor.config.json
          npx cap add android
          node "$GITHUB_WORKSPACE/labs/apois-navigation/host-compat/prepare-host.mjs" "$H" "$GITHUB_WORKSPACE/labs/apois-navigation"
      - name: Instrumentar copia descartavel do GPS QA290
        run: node labs/apois-navigation/host-compat/prepare-driver-gps.mjs "$RUNNER_TEMP/apois-compat-host" "$GITHUB_WORKSPACE/.navigation-driver-source" "$GITHUB_WORKSPACE"
      - name: Testar fallback Web Speech sobre fonte real descartavel
        run: |
          set -euo pipefail
          V="$GITHUB_WORKSPACE/labs/apois-navigation/host-compat"
          export APOIS_WEB_VOICE_TEST_DIR="$RUNNER_TEMP/apois-web-voice"
          node "$V/prepare-web-voice.mjs" "$GITHUB_WORKSPACE/.navigation-driver-source" "$APOIS_WEB_VOICE_TEST_DIR"
          node --test "$V/web-voice.test.mjs"
      - name: Testar e instrumentar voz real em copia descartavel
        run: |
          set -euo pipefail
          V="$GITHUB_WORKSPACE/labs/apois-navigation/host-compat"
          javac -d "$RUNNER_TEMP/voice-tests" "$V/VoiceGeneration.java" "$V/VoiceGenerationTest.java"
          java -cp "$RUNNER_TEMP/voice-tests" br.com.apois.navigation.compat.lab.VoiceGenerationTest
          node "$V/prepare-driver-voice.mjs" "$RUNNER_TEMP/apois-compat-host" "$GITHUB_WORKSPACE/.navigation-driver-source" "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        with:
          name: apois-vale-runtime-assets-inactive
          run-id: 45750844751
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apois-vale-runtime-assets
      - name: Stage verified Vale beside actual QA290 GPS and voice code
        run: node labs/apois-navigation/host-compat/prepare-vale-native.mjs "$RUNNER_TEMP/apois-compat-host" "$GITHUB_WORKSPACE/labs/apois-navigation" "$RUNNER_TEMP/apois-vale-runtime-assets"
      - name: Compilar no Gradle original, checar manifesto e dependencias
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/apois-compat-host/android"
          gradle --version
          tasks=(:app:checkDebugAarMetadata :app:processDebugMainManifest :app:compileDebugJavaWithJavac :navigation-probe:compileDebugKotlin :navigation-probe:testDebugUnitTest)
          log="$RUNNER_TEMP/apois-host-compat.log"
          if ! gradle "${tasks[@]}" --no-daemon --stacktrace 2>&1 | tee "$log"; then
            # Retry once only for transient dependency transport failures.
            # No alternative repositories, bypasses, or changes to dependency versions.
            if grep -Eq 'Received status code (403|429|502|503|504) from server|Read timed out|Connection reset' "$log"; then
              echo "Dependency transport failed; one retry" | tee -a "$log"
              # Back off after Maven rate limiting, rather than retry immediately.
              if grep -q "Received status code 429" "$log"; then sleep 30; fi
              gradle "${tasks[@]}" --no-daemon --stacktrace 2>&1 | tee -a "$log"
            else
              exit 1
            fi
          fi
          test -z "$(find . -name '*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apois-host-compat-report
          path: ${{ runner.temp }}/apois-host-compat.log
          retention-days: 7
