name: APOIS GPS - grafo Nordeste compatibilidade Android 3.6.3
on:
  push:
    branches: [lab/apois-navegacao-ferrostar-etapa1]
    paths: ['labs/apois-navigation/embedded-northeast/**','.github/workflows/apois-navigation-lab-embedded-northeast.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apois-navigation-northeast
  cancel-in-progress: false
jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Check scripts and source
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/apois-ne-embedded-report"
          mkdir -p "$O"
          bash -n labs/apois-navigation/embedded-northeast/build-graph.sh
          python -m py_compile labs/apois-navigation/embedded-northeast/inspect-index.py
          df -h > "$O/disk-before.txt"
          free -m > "$O/memory-before.txt"
          bash labs/apois-navigation/embedded-northeast/fetch-source.sh "$RUNNER_TEMP/nordeste.osm.pbf" "$O"

      - name: Generate version-compatible graph and run existing 15 route samples
        env:
          APOIS_LOCAL_ANDROID_TEST: '1'
        run: bash labs/apois-navigation/embedded-northeast/build-graph.sh "$RUNNER_TEMP/nordeste.osm.pbf" "$RUNNER_TEMP/apois-ne-embedded-report"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Prepare Android SDK and emulator
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" >/dev/null
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Compile isolated Android test without bundling graph
        run: bash labs/apois-navigation/embedded-northeast/android-build.sh
      - name: Calculate all 15 routes offline on Android
        run: bash labs/apois-navigation/embedded-northeast/android-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apois-ne-android-evidence
          path: ${{ runner.temp }}/apois-embedded-report/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apois-ne-embedded-graph-report
          path: ${{ runner.temp }}/apois-ne-embedded-report/
          retention-days: 7
          if-no-files-found: warn
