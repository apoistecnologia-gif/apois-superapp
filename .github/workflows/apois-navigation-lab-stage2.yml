name: APOIS Navegacao - Valhalla regional (sem APK)
on:
  push:
    branches: [lab/apois-navegacao-ferrostar-etapa1]
    paths: ['labs/apois-navigation/valhalla/**', '.github/workflows/apois-navigation-lab-stage2.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: navigation-regional-lab
  cancel-in-progress: true
jobs:
  regional:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar contrato e limites do gateway local
        run: node --test labs/apois-navigation/valhalla/route-gateway.test.mjs labs/apois-navigation/valhalla/route-authorization.test.mjs
      - name: Instalar utilitario de extracao OSM
        run: sudo apt-get update -qq && sudo apt-get install -y osmium-tool
      - name: Mes do cache regional
        id: cache-month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: regional-cache
        with:
          path: labs/apois-navigation/valhalla/.regional-cache
          key: apois-valhalla-petrolina-juazeiro-bbox-v1-${{ steps.cache-month.outputs.month }}
      - name: Testar rotas locais em portugues
        run: |
          bash -n labs/apois-navigation/valhalla/run-region.sh
          bash labs/apois-navigation/valhalla/run-region.sh "$RUNNER_TEMP/apois-route-report"
      - uses: actions/cache/save@v4
        if: always() && steps.regional-cache.outputs.cache-hit != 'true' && hashFiles('labs/apois-navigation/valhalla/.regional-cache/extract.sha256') != ''
        with:
          path: labs/apois-navigation/valhalla/.regional-cache
          key: apois-valhalla-petrolina-juazeiro-bbox-v1-${{ steps.cache-month.outputs.month }}
      - name: Reproduzir rotas regionais no Ferrostar
        run: |
          set -euo pipefail
          rustup update stable && rustup default stable
          for name in petrolina_urban crossing_pe_ba crossing_ba_pe; do
            cargo run --manifest-path labs/apois-navigation/replay/Cargo.toml -- "$RUNNER_TEMP/apois-route-report/sdk_$name.json" | tee "$RUNNER_TEMP/apois-route-report/sdk_$name-replay.txt"
            grep -E 'APOIS_REPLAY_OK.*spoken_instruction_fixes=[1-9][0-9]*' "$RUNNER_TEMP/apois-route-report/sdk_$name-replay.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apois-valhalla-regional-report
          path: ${{ runner.temp }}/apois-route-report/
          retention-days: 7
