name: APOIS GPS - Vale PE-BA no Android offline
on:
  push:
    branches: [lab/apois-navegacao-ferrostar-etapa1]
    paths: ['labs/apois-navigation/launch-vale/android-build.sh','labs/apois-navigation/launch-vale/EmbeddedValeRouteTest.kt','labs/apois-navigation/launch-vale/ValeOfflineResolver.kt','labs/apois-navigation/android/probe/**','labs/apois-navigation/host-compat/prepare-host.mjs','.github/workflows/apois-navigation-lab-launch-vale-android.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  embedded:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          name: apois-launch-vale-candidate
          run-id: 45748506856
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apois-launch-vale
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Android SDK and emulator
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" >/dev/null
      - name: Compile engine and Ferrostar, inspect APK permissions and ABI
        env:
          APOIS_PIAUI_GRAPH_DIR: ${{ runner.temp }}/apois-piaui-graph
        run: bash labs/apois-navigation/launch-vale/android-build.sh
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute Vale routes offline and parse for Ferrostar
        run: bash labs/apois-navigation/embedded-probe/emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apois-embedded-vale-report
          path: ${{ runner.temp }}/apois-embedded-report/
          retention-days: 7
          if-no-files-found: warn

  capacitor-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          name: apois-vale-runtime-assets-inactive
          run-id: 45749604118
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apois-vale-runtime-assets
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Generate disposable Capacitor host with embedded engine
        run: |
          set -euo pipefail
          H="$RUNNER_TEMP/apois-compat-offline"
          mkdir -p "$H/www"
          cd "$H"
          npm init -y >/dev/null
          npm install --save-exact --no-audit --no-fund @capacitor/core@8.5.0 @capacitor/cli@8.5.0 @capacitor/android@8.5.0
          cp "$GITHUB_WORKSPACE/labs/apois-navigation/host-compat/demo/"{index.html,main.mjs,scenario.mjs} www/
          printf '{"appId":"br.com.apois.navigation.compat.lab","appName":"APOIS navigation lab","webDir":"www"}' > capacitor.config.json
          npx cap add android
          node "$GITHUB_WORKSPACE/labs/apois-navigation/host-compat/prepare-host.mjs" "$H" "$GITHUB_WORKSPACE/labs/apois-navigation"
          cp "$GITHUB_WORKSPACE/labs/apois-navigation/launch-vale/ValeOfflineResolver.kt" "$H/android/navigation-probe/src/main/java/br/com/apois/navigation/lab/"
          mkdir -p "$H/android/app/src/main/assets"
          cp -a "$RUNNER_TEMP/apois-vale-runtime-assets/." "$H/android/app/src/main/assets/"
          cat >> "$H/android/navigation-probe/build.gradle" <<'EOF'
          dependencies {
            implementation 'io.github.rallista:valhalla-mobile:0.6.3'
            implementation 'io.github.rallista:valhalla-models:0.5.2'
            implementation 'io.github.rallista:valhalla-models-config:0.5.2'
            implementation 'com.stadiamaps:osrm-openapi:0.0.10'
          }
          EOF
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Check AAR metadata, native dependency merge and D8 in isolated host
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/apois-compat-offline/android"
          gradle :app:checkDebugAarMetadata :navigation-probe:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/apois-offline-capacitor.log"
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" > "$RUNNER_TEMP/apois-offline-capacitor-files.txt"
          grep -F 'lib/arm64-v8a/libvalhalla-wrapper.so' "$RUNNER_TEMP/apois-offline-capacitor-files.txt"
          grep -F 'lib/x86_64/libvalhalla-wrapper.so' "$RUNNER_TEMP/apois-offline-capacitor-files.txt"
          for F in apois-regional/vale.pmtiles apois-regional/style.json apois-regional/manifest.json apois-vale-data/graph.tar apois-vale-data/search.json;do grep -F "assets/$F" "$RUNNER_TEMP/apois-offline-capacitor-files.txt";done
          for PAIR in "18dc74cfea6ab6a8365b48df0731173b794825b108ed1f72db740ed16c3490fe apois-regional/vale.pmtiles" "38cf6df5fdd080ac4feb5c053a417fb4b814119765bc8214ad7593da985a1433 apois-vale-data/graph.tar" "9864919ce496184b917818f56d00406ef367c1987cdf37f24cc524c324bc08fa apois-vale-data/search.json";do
            read -r EXPECTED NAME <<< "$PAIR"
            ACTUAL=$(unzip -p "$APK" "assets/$NAME" | sha256sum | cut -d ' ' -f1)
            test "$ACTUAL" = "$EXPECTED"
          done
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 4 "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/apois-offline-capacitor-badging.txt"
          grep -F "package: name='br.com.apois.navigation.compat.lab'" "$RUNNER_TEMP/apois-offline-capacitor-badging.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apois-offline-capacitor-report
          path: ${{ runner.temp }}/apois-offline-capacitor-*.txt
          retention-days: 7
          if-no-files-found: warn
