name: APOIS GPS - candidato regional de lancamento Vale
on:
  push:
    branches: [lab/apois-navegacao-ferrostar-etapa1]
    paths: ['labs/apois-navigation/launch-vale/**','.github/workflows/apois-navigation-lab-launch-vale.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vale:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: sudo apt-get update -qq && sudo apt-get install -y osmium-tool time
      - uses: actions/cache/restore@v4
        with:
          path: labs/apois-navigation/valhalla/.regional-cache
          key: apois-valhalla-petrolina-juazeiro-bbox-v1-2026-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build map and compatible graph from same extract
        run: bash labs/apois-navigation/launch-vale/build.sh "$RUNNER_TEMP/apois-launch-vale"
      - name: Validate actual tiles and labels
        run: |
          python -m pip install --disable-pip-version-check pmtiles==3.8.1 mapbox-vector-tile==2.2.0
          O="$RUNNER_TEMP/apois-launch-vale"
          python labs/apois-navigation/cartography/verify_content.py "$O/vale.pmtiles" "$O" | tee "$O/content-report.json"
          bash labs/apois-navigation/cartography/prepare-glyphs.sh "$O"
          python labs/apois-navigation/cartography/build_asset_pack.py "$O" | tee "$O/asset-pack-report.json"
          python labs/apois-navigation/launch-vale/manifest.py "$O"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apois-launch-vale-candidate
          path: ${{ runner.temp }}/apois-launch-vale/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apois-launch-vale-failure
          path: |
            ${{ runner.temp }}/apois-launch-vale/*.json
            ${{ runner.temp }}/apois-launch-vale/*.log
          retention-days: 7
          if-no-files-found: warn
