name: APOIS Navegacao - transacao de corrida sintetica
on:
  push:
    branches: [lab/apois-navegacao-ferrostar-etapa1]
    paths:
      - '.github/workflows/apois-navigation-lab-ride-transaction.yml'
      - 'labs/apois-navigation/passenger-provenance-snapshot/**'
      - 'labs/apois-navigation/passenger-ride-transaction/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ride-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verificar rollback da corrida em PostgreSQL descartavel
        run: |
          set -euo pipefail
          container="apois-ride-transaction"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --network none --name "$container" -e POSTGRES_PASSWORD=fixture postgres:17
          for attempt in {1..30}; do
            if docker exec "$container" pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          root=labs/apois-navigation/passenger-provenance-snapshot/experimental/apois-navigation
          run_sql() { docker exec -i "$container" psql -X -U postgres -v ON_ERROR_STOP=1; }
          run_sql < "$root/fixture.sql"
          run_sql < "$root/schema.sql"
          run_sql <<'SQL'
          insert into apois_nav_lab.catalog values
            ('00000000-0000-4000-8000-000000000021',1,'node',1,repeat('a',64),'Ponto A',-9.4,-40.5,true),
            ('00000000-0000-4000-8000-000000000022',1,'node',2,repeat('a',64),'Ponto B',-9.42,-40.51,true);
          set role service_role;
          select apois_nav_lab.confirm_selection(
            '00000000-0000-4000-8000-000000000011',
            '00000000-0000-4000-8000-000000000031',
            '00000000-0000-4000-8000-000000000021',1,
            '00000000-0000-4000-8000-000000000022',1);
          do $$
          declare
            actor constant uuid := '00000000-0000-4000-8000-000000000011';
            passenger constant uuid := '00000000-0000-4000-8000-000000000001';
            request_id constant uuid := '00000000-0000-4000-8000-000000000031';
            ride constant uuid := '00000000-0000-4000-8000-000000000041';
            selection_id uuid;
          begin
            select id into strict selection_id from apois_nav_lab.selection where request_key=request_id;
            begin
              if apois_nav_lab.prepare_selection(actor,selection_id,request_id) is null then
                raise exception 'prepare rejected valid selection';
              end if;
              insert into public.rides(id,passenger_id,request_key,category,status,origin_lat,origin_lng,destination_lat,destination_lng,waypoints)
              values(ride,passenger,request_id,'carros','procurar_motorista',-9.4,-40.5,-9.43,-40.51,'[]');
              if not apois_nav_lab.bind_selection(actor,selection_id,ride) then
                raise exception using errcode='P3101', message='binding rejected';
              end if;
              raise exception 'invalid coordinates accepted';
            exception when sqlstate 'P3101' then
              null;
            end;
            if exists(select 1 from public.rides where id=ride) or
               exists(select 1 from apois_nav_lab.selection where id=selection_id
                 and (prepared_xid is not null or ride_id is not null)) then
              raise exception 'failed binding left a partial write';
            end if;
          end $$;
          select 'APOIS_RIDE_TRANSACTION_ROLLBACK_OK';
          -- Fixture-only adapter for the PostgreSQL transaction contract.
          reset role;
          create function apois_nav_lab.create_fixture_ride(
            actor uuid, selection_id uuid, request_id uuid, ride uuid
          ) returns uuid language plpgsql security invoker set search_path = '' as $$
          declare
            prepared jsonb;
            passenger uuid;
            existing_ride uuid;
          begin
            select u.id, s.ride_id into passenger, existing_ride
              from public.users u join apois_nav_lab.selection s on s.passenger_id=u.id
              where u.auth_user_id=actor and s.id=selection_id and s.request_key=request_id
                and u.deleted_at is null and u.blocked_at is null
                and (u.suspended_until is null or u.suspended_until<=clock_timestamp())
              for share of u for update of s;
            if not found then return null; end if;
            if existing_ride is not null then return existing_ride; end if;

            prepared := apois_nav_lab.prepare_selection(actor,selection_id,request_id);
            if prepared is null then return null; end if;
            insert into public.rides(
              id,passenger_id,request_key,category,status,
              origin_lat,origin_lng,destination_lat,destination_lng,waypoints
            ) values (
              ride,passenger,request_id,'carros','procurar_motorista',
              (prepared->'origin'->>'lat')::double precision,
              (prepared->'origin'->>'lng')::double precision,
              (prepared->'destination'->>'lat')::double precision,
              (prepared->'destination'->>'lng')::double precision,'[]'
            );
            if not apois_nav_lab.bind_selection(actor,selection_id,ride) then
              raise exception 'fixture ride binding rejected';
            end if;
            return ride;
          end $$;
          revoke all on function apois_nav_lab.create_fixture_ride(uuid,uuid,uuid,uuid) from public;
          grant execute on function apois_nav_lab.create_fixture_ride(uuid,uuid,uuid,uuid) to service_role;
          set role service_role;
          do $$
          declare
            actor constant uuid := '00000000-0000-4000-8000-000000000011';
            other_actor constant uuid := '00000000-0000-4000-8000-000000000012';
            request_id constant uuid := '00000000-0000-4000-8000-000000000031';
            ride constant uuid := '00000000-0000-4000-8000-000000000041';
            retry_ride constant uuid := '00000000-0000-4000-8000-000000000042';
            selection_id uuid;
          begin
            select id into strict selection_id from apois_nav_lab.selection where request_key=request_id;
            if apois_nav_lab.create_fixture_ride(other_actor,selection_id,request_id,ride) is not null then
              raise exception 'other passenger accepted';
            end if;
            if apois_nav_lab.create_fixture_ride(actor,selection_id,request_id,ride) is distinct from ride then
              raise exception 'fixture ride was not created';
            end if;
            if apois_nav_lab.create_fixture_ride(actor,selection_id,request_id,retry_ride) is distinct from ride then
              raise exception 'retry did not return the linked ride';
            end if;
            if (select count(*) from public.rides where request_key=request_id) <> 1
               or (select ride_id from apois_nav_lab.selection where id=selection_id) is distinct from ride then
              raise exception 'ride and selection state diverged';
            end if;
          end $$;
          select 'APOIS_RIDE_TRANSACTION_CREATE_OK';
          -- Exercise the Passenger column name and baseline coordinate scales.
          reset role;
          alter table public.rides rename column waypoints to intermediates;
          alter table public.rides
            alter column origin_lat type numeric(10,8),
            alter column origin_lng type numeric(11,8),
            alter column destination_lat type numeric(10,8),
            alter column destination_lng type numeric(11,8);
          set role service_role;
          do $$
          declare
            ride constant uuid := '00000000-0000-4000-8000-000000000041';
            driver constant uuid := '00000000-0000-4000-8000-000000000071';
            driver_auth constant uuid := '00000000-0000-4000-8000-000000000061';
          begin
            update public.rides set
              status='motorista_a_caminho', driver_id=driver,
              accepted_driver_id=driver, accepted_at=clock_timestamp()
            where id=ride;
            if apois_nav_lab.read_driver_proof(driver_auth,ride,'PICKUP') is null then
              raise exception 'proof unavailable with Passenger coordinate and stop columns';
            end if;
            update public.rides set intermediates=null where id=ride;
            if apois_nav_lab.read_driver_proof(driver_auth,ride,'PICKUP') is not null then
              raise exception 'unknown Passenger stops accepted';
            end if;
          end $$;
          select 'APOIS_PASSENGER_RIDE_COLUMNS_OK';
          SQL
          docker rm -f "$container" >/dev/null
          docker run --detach --network none --name "$container" -e POSTGRES_PASSWORD=fixture postgres:17
          for attempt in {1..30}; do
            if docker exec "$container" pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          run_sql < "$root/fixture.sql"
          run_sql <<'SQL'
          alter table public.rides rename column waypoints to intermediates;
          alter table public.rides
            alter column origin_lat type numeric(10,8),
            alter column origin_lng type numeric(11,8),
            alter column destination_lat type numeric(10,8),
            alter column destination_lng type numeric(11,8);
          alter table public.rides alter column id set default gen_random_uuid();
          alter table public.rides
            add column scheduled_for timestamptz,
            add column origin_name text,
            add column destination_name text,
            add column distance_km numeric(10,2),
            add column duration_min numeric(10,2),
            add column estimated_price numeric(10,2),
            add column payment_method text,
            add column service_details jsonb,
            add column pickup_label text,
            add column pickup_short_label text,
            add column pickup_address text,
            add column pickup_place_id text,
            add column pickup_source text,
            add column search_expires_at timestamptz,
            add unique (request_key);
          SQL
          run_sql < "$root/schema.sql"
          run_sql < labs/apois-navigation/passenger-ride-transaction/create-passenger-ride.sql
          run_sql <<'SQL'
          insert into apois_nav_lab.catalog values
            ('00000000-0000-4000-8000-000000000021',1,'node',1,repeat('a',64),'Ponto A',-9.4,-40.5,true),
            ('00000000-0000-4000-8000-000000000022',1,'node',2,repeat('a',64),'Ponto B',-9.42,-40.51,true);
          set role service_role;
          do $test$
          declare
            actor constant uuid := '00000000-0000-4000-8000-000000000011';
            request_id constant uuid := '00000000-0000-4000-8000-000000000033';
            ordinary_key constant uuid := '00000000-0000-4000-8000-000000000034';
            point_a constant uuid := '00000000-0000-4000-8000-000000000021';
            point_b constant uuid := '00000000-0000-4000-8000-000000000022';
            selection_id uuid;
            ordinary_selection uuid;
            created public.rides;
            retried public.rides;
            payload jsonb;
          begin
            selection_id := (apois_nav_lab.confirm_selection(actor,request_id,point_a,1,point_b,1)->>'selectionId')::uuid;
            payload := jsonb_build_object(
              'passenger_id','00000000-0000-4000-8000-000000000001',
              'request_key',request_id,'category','carros','status','procurar_motorista',
              'intermediates','[]'::jsonb,'origin_lat',-9.4,'origin_lng',-40.5,
              'destination_lat',-9.42,'destination_lng',-40.51,'origin_name','Ponto A',
              'destination_name','Ponto B','estimated_price',12.34,'payment_method','pix',
              'distance_km',2.10,'duration_min',8,'pickup_source','gps',
              'service_details','{"pricing_breakdown":{"total":12.34}}'::jsonb);
            begin
              perform apois_nav_lab.create_passenger_ride(actor,selection_id,request_id,
                payload || '{"destination_lat":-9.43}'::jsonb);
              raise exception 'mismatched fare coordinates accepted';
            exception when raise_exception then
              if sqlerrm <> 'confirmed points differ from fare inputs' then raise; end if;
            end;
            if exists(select 1 from public.rides where request_key=request_id) or
               exists(select 1 from apois_nav_lab.selection where id=selection_id and prepared_xid is not null) then
              raise exception 'partial write after coordinate rejection';
            end if;
            select * into created from apois_nav_lab.create_passenger_ride(actor,selection_id,request_id,payload);
            select * into retried from apois_nav_lab.create_passenger_ride(actor,selection_id,request_id,payload);
            if created.id is null or retried.id is distinct from created.id or
               created.estimated_price is distinct from 12.34 or created.payment_method is distinct from 'pix' or
               created.service_details is distinct from payload->'service_details' then
              raise exception 'creation, retry or pricing persistence failed';
            end if;
            ordinary_selection := (apois_nav_lab.confirm_selection(actor,ordinary_key,point_a,1,point_b,1)->>'selectionId')::uuid;
            insert into public.rides(passenger_id,request_key,category,status,origin_lat,origin_lng,destination_lat,destination_lng,intermediates)
              values(created.passenger_id,ordinary_key,'carros','procurar_motorista',-9.4,-40.5,-9.42,-40.51,'[]');
            select * into retried from apois_nav_lab.create_passenger_ride(actor,ordinary_selection,ordinary_key,
              payload || jsonb_build_object('request_key',ordinary_key));
            if retried.id is not null or exists(select 1 from apois_nav_lab.selection where id=ordinary_selection and ride_id is not null) then
              raise exception 'ordinary ride was reclassified';
            end if;
          end $test$;
          select 'APOIS_PASSENGER_ADAPTER_OK';
          SQL
