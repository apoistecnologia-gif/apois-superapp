workflows:
  android-superapp-experimental:
    name: APOIS Superapp - Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 21
      android_signing:
        - apois_entregas_release
      groups:
        - apois_android
      vars:
        APP_PACKAGE: "br.com.apois.app"
        APP_LABEL: "APOIS Cliente"
        APP_VERSION_CODE: "1"
        APP_VERSION_NAME: "1.0.0"
        BUN_VERSION: "1.3.14"
        EXPECTED_SIGNING_SHA1: "98:7C:6A:7A:BE:26:9C:1E:5A:01:B5:B7:98:A9:6D:56:66:D8:5E:69"
        APOIS_STRICT_NATIVE_CONFIG: "1"
        APOIS_SUPERAPP_RIDES_PUSH_ENABLED: "0"
        CORRIDAS_PUBLIC_APP_URL: "https://tbbzkrfupmqdywnzgnms.supabase.co/functions/v1/public-ride-tracker"
    scripts:
      - name: Install pinned Bun
        script: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          test "$(bun --version)" = "$BUN_VERSION"
          bun --version
          java -version
      - name: Initialize protected source snapshots
        script: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive
          npm run verify:pins
      - name: Validate release environment
        script: |
          set -euo pipefail
          : "${CORRIDAS_VITE_SUPABASE_URL:?Add CORRIDAS_VITE_SUPABASE_URL to Codemagic}"
          : "${CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY:?Add CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY to Codemagic}"
          # O Cliente Entregas é fixado no projeto de produção pelo builder e
          # não herda mais VITE_SUPABASE_* genéricos/legados do ambiente.
          echo '[OK] Entregas usa Supabase canônico fixado e validado pelo pipeline'
          : "${CORRIDAS_WEB_MAPS_API_KEY:?Add CORRIDAS_WEB_MAPS_API_KEY to Codemagic}"
          : "${CORRIDAS_ANDROID_MAPS_API_KEY:?Add CORRIDAS_ANDROID_MAPS_API_KEY to Codemagic}"
          : "${FIREBASE_SUPERAPP_GOOGLE_SERVICES_JSON_BASE64:?Add unified Firebase google-services.json for br.com.apois.app to Codemagic}"
          : "${APP_VERSION_CODE:?APP_VERSION_CODE is required for the customer release}"
          : "${APP_VERSION_NAME:?APP_VERSION_NAME is required for the customer release}"
          : "${EXPECTED_SIGNING_SHA1:?EXPECTED_SIGNING_SHA1 is required for the customer release}"
          : "${CM_KEYSTORE_PATH:?Codemagic keystore was not loaded}"
          : "${CM_KEYSTORE_PASSWORD:?Codemagic keystore password is missing}"
          : "${CM_KEY_ALIAS:?Codemagic key alias is missing}"
          : "${CM_KEY_PASSWORD:?Codemagic key password is missing}"
          test -s "$CM_KEYSTORE_PATH"
          node scripts/validate-superapp-native-config.mjs
      - name: Audit Superapp before build
        script: |
          set -euo pipefail
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          npm run audit:static
          npm run audit:ui
          npm run audit:hardening
          npm run audit:play-store
          npm run audit:release-integrity
          npm run verify:rides-push-firebase
          npm run verify:release-requirements
          echo '[OK] auditorias e gates de release concluídos sem falhas'
      - name: Build Corridas + Entregas + shell cliente
        script: |
          set -euo pipefail
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          npm run build:corridas
          npm run build:entregas
          npm run build:shell
          npm run harden:auth-deeplinks
          npm run inject:push-routing
          npm run verify:dist
          test -s superapp/shell/dist/modules/corridas/index.html || { echo '[FAIL] index Corridas ausente'; exit 1; }
          test -s superapp/shell/dist/modules/entregas/index.html || { echo '[FAIL] index Entregas ausente'; exit 1; }
          test ! -e superapp/shell/dist/modules/motorista || { echo '[FAIL] módulo Motorista apareceu no Cliente'; exit 1; }
          grep -Fq 'data:image/png;base64,' superapp/shell/dist/index.html || { echo '[FAIL] logo inline ausente no shell'; exit 1; }
          grep -Fq 'APOIS_NATIVE_MAP_FALLBACK_V3' .work/corridas/src/components/map/PassengerMap.tsx || { echo '[FAIL] hardener de mapa nativo V3 ausente no workspace final'; exit 1; }
          grep -R -Fq 'data:image/webp;base64,' superapp/shell/dist/modules/corridas || { echo '[FAIL] sprite local das categorias não chegou inline ao bundle Corridas'; exit 1; }
          grep -Fq 'APOIS_CATEGORY_VEHICLE_SPRITE_V6' .work/corridas/src/components/pricing/CategorySelector.tsx || { echo '[FAIL] CategorySelector não usa o sprite APOIS validado das categorias'; exit 1; }
          grep -Fq 'validated-sprite-v6' .work/corridas/src/components/pricing/CategorySelector.tsx || { echo '[FAIL] CategorySelector sem marcador do sprite APOIS validado'; exit 1; }
          if grep -R -Fq '/assets/categories/apois-vehicles.webp' superapp/shell/dist/modules/corridas; then
            echo '[FAIL] bundle Corridas referencia asset externo de categorias em vez do sprite inline'
            exit 1
          fi
          if grep -Fq 'Para onde vamos?' .work/corridas/src/routes/_authenticated.inicio.tsx; then
            echo '[FAIL] home Corridas reintroduziu busca duplicada no topo'
            exit 1
          fi
          grep -R -Fq 'ptgkwyyolrdgnqketkjj.supabase.co' superapp/shell/dist/modules/entregas || { echo '[FAIL] bundle Entregas sem Supabase canônico'; exit 1; }
          if grep -R -Fq 'sbvhdgyuuperszlsllji.supabase.co' superapp/shell/dist/modules/entregas; then
            echo '[FAIL] bundle Entregas ainda contém o Supabase aposentado'
            exit 1
          fi
          grep -R -Fq 'public-ride-tracker' superapp/shell/dist/modules/corridas || { echo '[FAIL] public-ride-tracker ausente do bundle Corridas'; exit 1; }
          if grep -R -Fq 'create-merchant-mercadopago-pix' superapp/shell/dist/modules/entregas; then
            echo '[FAIL] bundle Entregas reintroduziu create-merchant-mercadopago-pix aposentado'
            exit 1
          fi
          if grep -R -Fq 'process-superapp-refund' superapp/shell/dist/modules/entregas; then
            echo '[FAIL] bundle Entregas reintroduziu process-superapp-refund aposentado'
            exit 1
          fi
          echo '[OK] Superapp Cliente contém somente Corridas + Entregas e não reintroduz gateways legados no bundle'
      - name: Create and harden Capacitor Android project
        script: |
          set -euo pipefail
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd superapp/shell
          bun install
          rm -rf android
          bunx cap add android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          bunx cap sync android
          cd ../..
          node scripts/configure-superapp-android.mjs
          MANIFEST="superapp/shell/android/app/src/main/AndroidManifest.xml"
          grep -Fq 'com.google.android.geo.API_KEY' "$MANIFEST"
          if grep -Fq 'android:name="com.google.android.geo.API_KEY" android:value=""' "$MANIFEST"; then
            echo '[FAIL] Google Maps Android key ficou vazia no AndroidManifest'
            exit 1
          fi
          node scripts/install-superapp-launcher.mjs
          grep -Fq "versionCode ${APP_VERSION_CODE}" superapp/shell/android/app/build.gradle
          grep -Fq "versionName \"${APP_VERSION_NAME}\"" superapp/shell/android/app/build.gradle
      - name: Build APK and AAB release
        script: |
          set -euo pipefail
          cd superapp/shell/android
          ./gradlew clean assembleRelease bundleRelease --no-daemon --stacktrace
          cd ../../..
          mkdir -p build
          UNSIGNED_APK="$(find superapp/shell/android/app/build/outputs/apk/release \( -name '*unsigned*.apk' -o -name 'app-release.apk' \) | head -n 1)"
          UNSIGNED_AAB="$(find superapp/shell/android/app/build/outputs/bundle/release -name '*.aab' | head -n 1)"
          test -s "$UNSIGNED_APK"
          test -s "$UNSIGNED_AAB"
          cp "$UNSIGNED_APK" build/APOIS-Superapp-unsigned.apk
          cp "$UNSIGNED_AAB" build/APOIS-Superapp-unsigned.aab
      - name: Sign and verify customer release artifacts
        script: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          ALIGNED="build/APOIS-Superapp-aligned.apk"
          SIGNED_APK="build/APOIS-Superapp.apk"
          "$BUILD_TOOLS/zipalign" -f -P 16 4 build/APOIS-Superapp-unsigned.apk "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign --ks "$CM_KEYSTORE_PATH" --ks-key-alias "$CM_KEY_ALIAS" --ks-pass "pass:$CM_KEYSTORE_PASSWORD" --key-pass "pass:$CM_KEY_PASSWORD" --out "$SIGNED_APK" "$ALIGNED"
          jarsigner -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" -keypass "$CM_KEY_PASSWORD" -signedjar build/APOIS-Superapp.aab build/APOIS-Superapp-unsigned.aab "$CM_KEY_ALIAS"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"
          ACTUAL_SHA1="$("$BUILD_TOOLS/apksigner" verify --print-certs "$SIGNED_APK" | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL_SHA1"
          NORMALIZED_ACTUAL_SHA1="$(printf '%s' "$ACTUAL_SHA1" | tr -cd '[:xdigit:]' | tr '[:lower:]' '[:upper:]')"
          NORMALIZED_EXPECTED_SHA1="$(printf '%s' "$EXPECTED_SIGNING_SHA1" | tr -cd '[:xdigit:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$NORMALIZED_ACTUAL_SHA1"
          test -n "$NORMALIZED_EXPECTED_SHA1"
          if [ "$NORMALIZED_ACTUAL_SHA1" != "$NORMALIZED_EXPECTED_SHA1" ]; then
            echo "[FAIL] certificado do APK Cliente diverge do esperado: $ACTUAL_SHA1"
            exit 1
          fi
          echo "[OK] certificado APK Cliente confirmado: $ACTUAL_SHA1"
          "$BUILD_TOOLS/zipalign" -v -c -P 16 4 "$SIGNED_APK"
          rm -f "$ALIGNED"
    artifacts:
      - build/APOIS-Superapp.apk
      - build/APOIS-Superapp.aab

  android-partner-superapp:
    name: APOIS Parceiro - Motorista + Entregador
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 21
      android_signing:
        - apois_entregas_release
      groups:
        - apois_android
      vars:
        BUN_VERSION: "1.3.14"
        PARTNER_APP_PACKAGE: "br.com.apois.parceiro"
        PARTNER_APP_LABEL: "APOIS Parceiro"
        PARTNER_VERSION_CODE: "1"
        PARTNER_VERSION_NAME: "1.0.0"
        EXPECTED_SIGNING_SHA1: "98:7C:6A:7A:BE:26:9C:1E:5A:01:B5:B7:98:A9:6D:56:66:D8:5E:69"
    scripts:
      - name: Install pinned Bun
        script: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          test "$(bun --version)" = "$BUN_VERSION"
          java -version
      - name: Initialize protected partner sources
        script: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive
          npm run verify:pins
          test -d sources/apois-corridas-motorista-admin
          test -d sources/apois-entregas
      - name: Validate partner environment
        script: |
          set -euo pipefail
          : "${CORRIDAS_VITE_SUPABASE_URL:?CORRIDAS_VITE_SUPABASE_URL is required}"
          : "${CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY:?CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY is required}"
          : "${CORRIDAS_WEB_MAPS_API_KEY:?CORRIDAS_WEB_MAPS_API_KEY is required}"
          : "${VITE_SUPABASE_URL:?VITE_SUPABASE_URL is required for Entregas}"
          : "${VITE_SUPABASE_PUBLISHABLE_KEY:?VITE_SUPABASE_PUBLISHABLE_KEY is required for Entregas}"
          : "${FIREBASE_PARTNER_GOOGLE_SERVICES_JSON_BASE64:?Add Firebase google-services.json with br.com.apois.parceiro to Codemagic}"
          : "${PARTNER_VERSION_CODE:?PARTNER_VERSION_CODE is required for the partner release}"
          : "${PARTNER_VERSION_NAME:?PARTNER_VERSION_NAME is required for the partner release}"
          : "${EXPECTED_SIGNING_SHA1:?EXPECTED_SIGNING_SHA1 is required for the partner release}"
          : "${CM_KEYSTORE_PATH:?Codemagic keystore was not loaded}"
          : "${CM_KEYSTORE_PASSWORD:?Codemagic keystore password is missing}"
          : "${CM_KEY_ALIAS:?Codemagic key alias is missing}"
          : "${CM_KEY_PASSWORD:?Codemagic key password is missing}"
          test -s "$CM_KEYSTORE_PATH"
      - name: Build Motorista + Entregador partner modules
        script: |
          set -euo pipefail
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          npm run build:partner
          if grep -R -Fq 'Conectar Mercado Pago' superapp/partner-shell/dist/modules/motorista; then
            echo '[FAIL] CTA Mercado Pago permaneceu no bundle Motorista'
            exit 1
          fi
          if grep -R -Fq 'mercadopago-oauth-start' superapp/partner-shell/dist/modules/motorista; then
            echo '[FAIL] endpoint Mercado Pago permaneceu no bundle Motorista'
            exit 1
          fi
          grep -R -Fq 'register_courier_push_device_v2' superapp/partner-shell/dist/modules/entregador
          grep -R -Fq 'br.com.apois.parceiro' superapp/partner-shell/dist/modules/entregador
      - name: Create APOIS Parceiro Android project
        script: |
          set -euo pipefail
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd superapp/partner-shell
          # Este host não possui bun.lock próprio.
          bun install
          rm -rf android
          bunx cap add android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          bunx cap sync android
          cd ../..
          node scripts/configure-partner-android.mjs
          node scripts/install-partner-launcher.mjs
          node scripts/install-partner-splash.mjs
          grep -Fq "versionCode ${PARTNER_VERSION_CODE}" superapp/partner-shell/android/app/build.gradle
          grep -Fq "versionName \"${PARTNER_VERSION_NAME}\"" superapp/partner-shell/android/app/build.gradle
          MANIFEST="superapp/partner-shell/android/app/src/main/AndroidManifest.xml"
          grep -Fq 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST"
          grep -Fq 'android:scheme="br.com.apois.parceiro"' "$MANIFEST"
          test -s superapp/partner-shell/android/app/google-services.json
          test -s superapp/partner-shell/android/app/src/main/res/drawable/apois_partner_splash.xml
          grep -R -Fq 'windowSplashScreenBackground">#050505<' superapp/partner-shell/android/app/src/main/res/values*/styles.xml
          grep -R -Fq 'windowSplashScreenAnimatedIcon">@mipmap/ic_launcher<' superapp/partner-shell/android/app/src/main/res/values*/styles.xml
          if grep -Fq 'android:scheme="br.com.apois.app"' "$MANIFEST" && grep -Fq 'android:pathPrefix="/mercadopago"' "$MANIFEST"; then
            echo '[FAIL] APOIS Parceiro ainda registra callback Mercado Pago do app cliente'
            exit 1
          fi
          echo '[OK] Android Parceiro possui scheme próprio, Firebase, splash APOIS e nenhum callback Mercado Pago legado'
      - name: Build and sign APOIS Parceiro APK
        script: |
          set -euo pipefail
          cd superapp/partner-shell/android
          ./gradlew clean assembleRelease --no-daemon --stacktrace
          cd ../../..
          mkdir -p build
          UNSIGNED="$(find superapp/partner-shell/android/app/build/outputs/apk/release \( -name '*unsigned*.apk' -o -name 'app-release.apk' \) | head -n 1)"
          test -s "$UNSIGNED"
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          ALIGNED="build/APOIS-Parceiro-aligned.apk"
          SIGNED="build/APOIS-Parceiro.apk"
          "$BUILD_TOOLS/zipalign" -f -P 16 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign --ks "$CM_KEYSTORE_PATH" --ks-key-alias "$CM_KEY_ALIAS" --ks-pass "pass:$CM_KEYSTORE_PASSWORD" --key-pass "pass:$CM_KEY_PASSWORD" --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"
          ACTUAL_SHA1="$("$BUILD_TOOLS/apksigner" verify --print-certs "$SIGNED" | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL_SHA1"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SIGNING_SHA1" ]; then
            echo "[FAIL] certificado do APK Parceiro diverge do esperado: $ACTUAL_SHA1"
            exit 1
          fi
          echo "[OK] certificado APK Parceiro confirmado: $ACTUAL_SHA1"
          "$BUILD_TOOLS/zipalign" -v -c -P 16 4 "$SIGNED"
          rm -f "$ALIGNED"
    artifacts:
      - build/APOIS-Parceiro.apk
