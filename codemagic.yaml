workflows:
  android-superapp-experimental:
    name: APOIS Superapp - APK Experimental
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 21
      android_signing:
        - apois_entregas_release
      groups:
        - apois_android
      vars:
        APP_PACKAGE: "br.com.apois.app"
        APP_LABEL: "APOIS"
        EXPECTED_SIGNING_SHA1: "98:7C:6A:7A:BE:26:9C:1E:5A:01:B5:B7:98:A9:6D:56:66:D8:5E:69"
    scripts:
      - name: Install Bun
        script: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          bun --version
          java -version

      - name: Initialize protected source snapshots
        script: |
          set -euo pipefail
          git submodule update --init --recursive
          npm run verify:pins

      - name: Validate module environments
        script: |
          set -euo pipefail
          : "${CORRIDAS_VITE_SUPABASE_URL:?Add CORRIDAS_VITE_SUPABASE_URL to Codemagic}"
          : "${CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY:?Add CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY to Codemagic}"
          : "${VITE_SUPABASE_URL:?Existing APOIS Entregas VITE_SUPABASE_URL is required}"
          : "${VITE_SUPABASE_PUBLISHABLE_KEY:?Existing APOIS Entregas publishable key is required}"
          : "${CM_KEYSTORE_PATH:?Codemagic keystore was not loaded}"
          : "${CM_KEYSTORE_PASSWORD:?Codemagic keystore password is missing}"
          : "${CM_KEY_ALIAS:?Codemagic key alias is missing}"
          : "${CM_KEY_PASSWORD:?Codemagic key password is missing}"
          test -s "$CM_KEYSTORE_PATH"

          if [ -n "${CORRIDAS_ANDROID_MAPS_API_KEY:-}" ]; then
            echo "[OK] Chave Android Google Maps disponível para o Superapp"
          else
            echo "[WARN] CORRIDAS_ANDROID_MAPS_API_KEY ainda não cadastrada; mapa nativo será validado depois"
          fi

          if [ -n "${FIREBASE_SUPERAPP_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "[OK] Firebase do package unificado disponível"
          else
            echo "[WARN] Firebase do Superapp ainda não cadastrado; Push será validado depois"
          fi

      - name: Build Corridas + Entregas + shell
        script: |
          set -euo pipefail
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          npm run build:superapp
          grep -Fq 'br.com.apois.app://auth/callback' .work/entregas/src/components/GoogleLoginButton.tsx
          grep -Fq 'window.location.replace("#/inicio")' .work/entregas/src/components/GoogleLoginButton.tsx
          grep -Fq 'emailRedirectTo: "br.com.apois.app://auth/callback"' .work/entregas/src/routes/register.tsx
          grep -Fq 'redirectTo: "br.com.apois.app://auth/reset"' .work/entregas/src/routes/login.tsx
          grep -Fq 'VITE_APOIS_SUPERAPP_PUSH_ENABLED' .work/entregas/src/lib/customer-push.ts
          grep -Fq 'data-apois-superapp-bridge' .work/corridas/dist/index.html
          grep -Fq 'data-apois-superapp-bridge' .work/entregas/.output/public/index.html
          grep -Fq "appPlugin.addListener('backButton'" .work/entregas/.output/public/index.html
          grep -Fq 'br.com.apois.app://auth/' superapp/shell/index.html
          echo "[OK] OAuth, confirmação, recuperação, Push, deep links e retorno ao shell adaptados"

      - name: Create Capacitor Android project
        script: |
          set -euo pipefail
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd superapp/shell
          bun install
          rm -rf android
          bunx cap add android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          bunx cap sync android
          grep -Fq ':capacitor-google-maps' android/settings.gradle
          grep -Fq ':capacitor-push-notifications' android/settings.gradle
          echo "[OK] Plugins nativos Maps + Push registrados no Android"
          cd ../..
          node scripts/configure-superapp-android.mjs
          grep -Fq 'android.permission.ACCESS_FINE_LOCATION' superapp/shell/android/app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.POST_NOTIFICATIONS' superapp/shell/android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:scheme="br.com.apois.app"' superapp/shell/android/app/src/main/AndroidManifest.xml

      - name: Configure optional Firebase for unified package
        script: |
          set -euo pipefail
          if [ -n "${FIREBASE_SUPERAPP_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$FIREBASE_SUPERAPP_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > superapp/shell/android/app/google-services.json
            grep -Fq "$APP_PACKAGE" superapp/shell/android/app/google-services.json
            echo "Firebase configured for $APP_PACKAGE"
          else
            echo "Firebase Superapp config not supplied; APK will build for integration testing but push is not expected to work yet."
          fi

      - name: Build and sign experimental APK
        script: |
          set -euo pipefail
          cd superapp/shell/android
          ./gradlew clean assembleRelease --no-daemon --stacktrace
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"
          BUILD_TOOLS="$(python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['ANDROID_SDK_ROOT']) / 'build-tools'
          def ver(p):
              out=[]
              for part in p.name.split('.'):
                  try: out.append(int(part))
                  except ValueError: out.append(0)
              return tuple(out)
          print(max((p for p in root.iterdir() if p.is_dir()), key=ver))
          PY
          )"
          ALIGNED="$CM_BUILD_DIR/APOIS-Superapp-release-aligned.apk"
          SIGNED="$CM_BUILD_DIR/APOIS-Superapp.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$CM_KEYSTORE_PATH" \
            --ks-key-alias "$CM_KEY_ALIAS" \
            --ks-pass "pass:$CM_KEYSTORE_PASSWORD" \
            --key-pass "pass:$CM_KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED" | tee /tmp/apois-superapp-signing.txt
          EXPECTED_NORMALIZED="$(printf '%s' "$EXPECTED_SIGNING_SHA1" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_NORMALIZED="$(awk -F': ' '/Signer #1 certificate SHA-1 digest:/ {print $2}' /tmp/apois-superapp-signing.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL_NORMALIZED"
          test "$ACTUAL_NORMALIZED" = "$EXPECTED_NORMALIZED"
          rm -f "$ALIGNED"
          test -s "$SIGNED"
    artifacts:
      - APOIS-Superapp.apk
