workflows:
  android-superapp-experimental:
    name: APOIS Superapp - Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 21
      android_signing:
        - apois_entregas_release
      groups:
        - apois_android
      vars:
        APP_PACKAGE: "br.com.apois.app"
        APP_LABEL: "APOIS"
        APP_VERSION_CODE: "1"
        APP_VERSION_NAME: "1.0.0"
        BUN_VERSION: "1.3.14"
        EXPECTED_SIGNING_SHA1: "98:7C:6A:7A:BE:26:9C:1E:5A:01:B5:B7:98:A9:6D:56:66:D8:5E:69"
        APOIS_STRICT_NATIVE_CONFIG: "1"
        APOIS_SUPERAPP_RIDES_PUSH_ENABLED: "0"
    scripts:
      - name: Install pinned Bun
        script: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          test "$(bun --version)" = "$BUN_VERSION"
          bun --version
          java -version

      - name: Initialize protected source snapshots
        script: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive
          npm run verify:pins

      - name: Validate release environment
        script: |
          set -euo pipefail
          : "${CORRIDAS_VITE_SUPABASE_URL:?Add CORRIDAS_VITE_SUPABASE_URL to Codemagic}"
          : "${CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY:?Add CORRIDAS_VITE_SUPABASE_PUBLISHABLE_KEY to Codemagic}"
          : "${VITE_SUPABASE_URL:?Existing APOIS Entregas VITE_SUPABASE_URL is required}"
          : "${VITE_SUPABASE_PUBLISHABLE_KEY:?Existing APOIS Entregas publishable key is required}"
          : "${CORRIDAS_WEB_MAPS_API_KEY:?Add CORRIDAS_WEB_MAPS_API_KEY to Codemagic}"
          : "${CORRIDAS_ANDROID_MAPS_API_KEY:?Add CORRIDAS_ANDROID_MAPS_API_KEY to Codemagic}"
          : "${FIREBASE_SUPERAPP_GOOGLE_SERVICES_JSON_BASE64:?Add unified Firebase google-services.json for br.com.apois.app to Codemagic}"
          : "${CM_KEYSTORE_PATH:?Codemagic keystore was not loaded}"
          : "${CM_KEYSTORE_PASSWORD:?Codemagic keystore password is missing}"
          : "${CM_KEY_ALIAS:?Codemagic key alias is missing}"
          : "${CM_KEY_PASSWORD:?Codemagic key password is missing}"
          test -s "$CM_KEYSTORE_PATH"
          node scripts/validate-superapp-native-config.mjs

      - name: Audit Superapp before build
        script: |
          set -euo pipefail
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          run_audit() {
            name="$1"
            shift
            log="/tmp/${name}.log"
            echo "===== ${name} ====="
            if ! "$@" 2>&1 | tee "$log"; then
              echo "===== FALHAS EXATAS: ${name} ====="
              grep -E '\[FAIL\]|Error:|ERR_|error:' "$log" | tail -n 80 || true
              echo "===== ÚLTIMAS 120 LINHAS: ${name} ====="
              tail -n 120 "$log" || true
              exit 1
            fi
          }
          run_audit audit-static node scripts/audit-superapp-static.mjs
          run_audit verify-pins node scripts/verify-module-pins.mjs
          run_audit audit-hardening node scripts/audit-superapp-hardening.mjs
          run_audit audit-play-store node scripts/audit-superapp-play-store.mjs
          run_audit audit-release-integrity node scripts/audit-superapp-release-integrity.mjs
          run_audit verify-rides-push node scripts/validate-rides-push-firebase.mjs
          echo "[OK] Todas as auditorias pré-build passaram"

      - name: Build Corridas + Entregas + shell
        script: |
          set -euo pipefail
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          test "$(bun --version)" = "$BUN_VERSION"
          build_log=/tmp/apois-module-build.log
          if ! (npm run build:corridas && npm run build:entregas && npm run build:shell && npm run harden:auth-deeplinks && npm run inject:push-routing && npm run verify:dist) 2>&1 | tee "$build_log"; then
            echo "===== FALHAS EXATAS DO BUILD ====="
            grep -E '\[FAIL\]|Error:|ERR_|error:' "$build_log" | tail -n 100 || true
            echo "===== ÚLTIMAS 160 LINHAS DO BUILD ====="
            tail -n 160 "$build_log" || true
            exit 1
          fi
          test -s superapp/shell/dist/index.html
          test -s superapp/shell/dist/modules/corridas/index.html
          test -s superapp/shell/dist/modules/entregas/index.html
          echo "[OK] Superapp web bundle validado"

      - name: Create and harden Capacitor Android project
        script: |
          set -euo pipefail
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd superapp/shell
          bun install
          rm -rf android
          bunx cap add android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          bunx cap sync android
          cd ../..
          node scripts/configure-superapp-android.mjs
          node scripts/install-superapp-launcher.mjs
          grep -Fq 'android.permission.ACCESS_FINE_LOCATION' superapp/shell/android/app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.POST_NOTIFICATIONS' superapp/shell/android/app/src/main/AndroidManifest.xml
          if grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION' superapp/shell/android/app/src/main/AndroidManifest.xml; then
            echo '[FAIL] localização em segundo plano não permitida neste release'
            exit 1
          fi
          grep -Fq 'android:allowBackup="false"' superapp/shell/android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:usesCleartextTraffic="false"' superapp/shell/android/app/src/main/AndroidManifest.xml
          grep -Eq 'compileSdkVersion[[:space:]]*=[[:space:]]*36' superapp/shell/android/variables.gradle
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36' superapp/shell/android/variables.gradle
          test -s superapp/shell/android/app/google-services.json
          echo "[OK] Android API 36, permissões, Firebase e hardening validados"

      - name: Build APK and AAB release
        script: |
          set -euo pipefail
          cd superapp/shell/android
          ./gradlew clean assembleRelease bundleRelease --no-daemon --stacktrace
          cd ../../..
          mkdir -p build
          UNSIGNED_APK="$(find superapp/shell/android/app/build/outputs/apk/release \( -name '*unsigned*.apk' -o -name 'app-release.apk' \) | head -n 1)"
          UNSIGNED_AAB="$(find superapp/shell/android/app/build/outputs/bundle/release -name '*.aab' | head -n 1)"
          test -n "$UNSIGNED_APK"
          test -s "$UNSIGNED_APK"
          test -n "$UNSIGNED_AAB"
          test -s "$UNSIGNED_AAB"
          cp "$UNSIGNED_APK" build/APOIS-Superapp-unsigned.apk
          cp "$UNSIGNED_AAB" build/APOIS-Superapp-unsigned.aab

      - name: Sign and verify release artifacts
        script: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          UNSIGNED_APK="build/APOIS-Superapp-unsigned.apk"
          ALIGNED_APK="build/APOIS-Superapp-aligned.apk"
          SIGNED_APK="build/APOIS-Superapp.apk"
          UNSIGNED_AAB="build/APOIS-Superapp-unsigned.aab"
          SIGNED_AAB="build/APOIS-Superapp.aab"
          "$BUILD_TOOLS/zipalign" -f -P 16 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign --ks "$CM_KEYSTORE_PATH" --ks-key-alias "$CM_KEY_ALIAS" --ks-pass "pass:$CM_KEYSTORE_PASSWORD" --key-pass "pass:$CM_KEY_PASSWORD" --out "$SIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/zipalign" -v -c -P 16 4 "$SIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED_APK" | tee /tmp/apois-apk-signing.txt
          EXPECTED_NORMALIZED="$(printf '%s' "$EXPECTED_SIGNING_SHA1" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_NORMALIZED="$(awk -F': ' '/Signer #1 certificate SHA-1 digest:/ {print $2}' /tmp/apois-apk-signing.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL_NORMALIZED"
          test "$ACTUAL_NORMALIZED" = "$EXPECTED_NORMALIZED"
          jarsigner -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" -keypass "$CM_KEY_PASSWORD" -signedjar "$SIGNED_AAB" "$UNSIGNED_AAB" "$CM_KEY_ALIAS"
          jarsigner -verify -verbose -certs "$SIGNED_AAB" > /tmp/apois-aab-signing.txt
          grep -Fq 'jar verified.' /tmp/apois-aab-signing.txt
          rm -f "$ALIGNED_APK"
          test -s "$SIGNED_APK"
          test -s "$SIGNED_AAB"
          echo "[OK] APK/AAB assinados; APK compatível com alinhamento 16 KB"

    artifacts:
      - build/APOIS-Superapp.apk
      - build/APOIS-Superapp.aab
